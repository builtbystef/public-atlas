name: Images

# Builds the server, server-agent, server-parse and web images and pushes them to GitHub
# Container Registry once CI has passed on main, so every image is a tested commit. Tags:
# `latest` and `sha-<short sha>`. For hosts that pull images; hosts that build from the
# repository (Railway, Render, Fly) use the Dockerfiles directly, with the target where there
# is one, and ignore this.
#
# Images land at ghcr.io/<owner>/<repo>/server, .../server-agent, .../server-parse and .../web.
# A package is private by default: make it public, or give the host a token with
# `read:packages`.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Build any ref by hand, for example to test a Dockerfile change on a branch.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The parse image installs PyTorch and downloads Docling's models.
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: apps/server/Dockerfile
            target: server
          - name: server-agent
            dockerfile: apps/server/Dockerfile
            target: agent
          - name: server-parse
            dockerfile: apps/server/Dockerfile
            target: parse
          - name: web
            dockerfile: apps/web/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On workflow_run, github.sha is the tip of main, which may have moved on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cases the repository name (registries require it) and derives the tags. `latest`
      # only for main, so a workflow_dispatch on a branch publishes a sha tag alone.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The build stages' layers, cached in the registry, so a source-only change rebuilds
          # neither the dependency install nor the base images.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.name }}:buildcache,mode=max
