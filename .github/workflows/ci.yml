name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same database as apps/server/compose.yaml; the job runs on the runner.
      PUBLIC_ATLAS_DATABASE_URL: postgresql+psycopg://public_atlas:public_atlas@localhost:5432/public_atlas
      # A test marked `lists` fails, instead of skipping, when a list's files are not in the
      # cache: the steps below put them there first.
      PUBLIC_ATLAS_REQUIRE_LISTS: "1"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: public_atlas
          POSTGRES_PASSWORD: public_atlas
          POSTGRES_DB: public_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username public_atlas --dbname public_atlas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Same object storage as apps/server/compose.yaml; the storage tests run against it.
      storage:
        image: rustfs/rustfs:1.0.0-rc.5
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs Vite+, the Node version from .node-version and the package manager from
      # package.json "packageManager", then runs `vp install`.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      # Installs the uv version `required-version` in pyproject.toml allows and the interpreter
      # from .python-version. Caching is on by default.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv sync --locked --all-packages

      # The official lists' files, for the tests marked `lists`. Cached by the pins and manual
      # steps the list modules declare (what `lists manifest` prints). On a miss the cache is
      # seeded from the archive on the `official-lists` release (`lists pack` writes it),
      # because some hosts answer a script with a bot check instead of the file and the manual
      # files exist nowhere else; `lists fetch` then downloads what moved since and fails the job
      # if a file is still missing.
      - id: lists-manifest
        run: echo "hash=$(uv run public-atlas lists manifest | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lists
        with:
          path: ~/.cache/public-atlas/official-lists
          key: official-lists-${{ runner.os }}-${{ steps.lists-manifest.outputs.hash }}
          restore-keys: |
            official-lists-${{ runner.os }}-
      - if: steps.lists.outputs.cache-hit != 'true'
        run: gh release download official-lists --pattern official-lists.tar.gz --output "$RUNNER_TEMP/official-lists.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - if: steps.lists.outputs.cache-hit != 'true'
        run: uv run public-atlas lists fetch --seed "$RUNNER_TEMP/official-lists.tar.gz"
      - if: steps.lists.outputs.cache-hit == 'true'
        run: uv run public-atlas lists fetch

      # Playwright's Chromium, for the tests marked `browser`. Cached by the Playwright version
      # in the lockfile.
      - id: playwright-version
        run: echo "version=$(uv run python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium
      # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor, which Chromium's
      # sandbox needs. Lift the restriction rather than run the tests without the sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # What the storage-init Compose service does locally.
      - run: aws s3api create-bucket --bucket public-atlas
        env:
          AWS_ACCESS_KEY_ID: rustfsadmin
          AWS_SECRET_ACCESS_KEY: rustfsadmin
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:9000

      # The `vp run` task cache. Restored after install, because installing can recreate
      # node_modules.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: task-cache
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - run: vp run check
      # The committed OpenAPI schema and generated client types must match apps/server.
      - run: vp run check:generated
      - run: vp run test
      - run: vp run -r build

      # The console smoke (apps/web/e2e): the console just built, served against the API on a
      # database the smoke rebuilds and seeds with Canada. Node's Playwright is pinned to
      # the Python package's version, so the Chromium installed above is the one it wants
      # and the install here finds it in place.
      - run: |
          node_version="$(pnpm --filter @public-atlas/web exec playwright --version | sed 's/^Version //')"
          python_version="${{ steps.playwright-version.outputs.version }}"
          if [ "$node_version" != "$python_version" ]; then
            echo "::error::@playwright/test is $node_version but the Python playwright is $python_version; pin them together"
            exit 1
          fi
      - run: pnpm --filter @public-atlas/web exec playwright install chromium
      - run: vp run test:e2e

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success()
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

  # The tests marked `parse` run Docling, which the job above does not install: the parse-cpu
  # group is several gigabytes. The rule tests of the lists read from PDFs are among them, so
  # this job has the lists cache too, and keeps the pages Docling parsed beside it.
  parse:
    runs-on: ubuntu-latest
    # A cold lists cache parses three directories' PDFs on the CPU before the pages are saved.
    timeout-minutes: 45
    env:
      PUBLIC_ATLAS_DATABASE_URL: postgresql+psycopg://public_atlas:public_atlas@localhost:5432/public_atlas
      PUBLIC_ATLAS_REQUIRE_LISTS: "1"
      DOCLING_ARTIFACTS_PATH: ${{ github.workspace }}/models
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: public_atlas
          POSTGRES_PASSWORD: public_atlas
          POSTGRES_DB: public_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username public_atlas --dbname public_atlas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv sync --locked --all-packages --group parse-cpu

      # The lists cache, as in the job above, under a key of its own so the parsed pages are
      # saved with it, by the lockfile since they are kept per Docling version.
      - id: lists-manifest
        run: echo "hash=$(uv run public-atlas lists manifest | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lists
        with:
          path: ~/.cache/public-atlas/official-lists
          key: official-lists-parse-${{ runner.os }}-${{ steps.lists-manifest.outputs.hash }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            official-lists-parse-${{ runner.os }}-${{ steps.lists-manifest.outputs.hash }}-
            official-lists-parse-${{ runner.os }}-
            official-lists-${{ runner.os }}-
      - if: steps.lists.outputs.cache-hit != 'true'
        run: gh release download official-lists --pattern official-lists.tar.gz --output "$RUNNER_TEMP/official-lists.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - if: steps.lists.outputs.cache-hit != 'true'
        run: uv run public-atlas lists fetch --seed "$RUNNER_TEMP/official-lists.tar.gz"
      - if: steps.lists.outputs.cache-hit == 'true'
        run: uv run public-atlas lists fetch

      # The models the parse image downloads, kept between runs of one lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: models
        with:
          path: models
          key: docling-models-${{ hashFiles('uv.lock') }}
      - if: steps.models.outputs.cache-hit != 'true'
        run: uv run docling-tools models download --quiet --output-dir models layout rapidocr

      - run: uv run pytest -m parse
