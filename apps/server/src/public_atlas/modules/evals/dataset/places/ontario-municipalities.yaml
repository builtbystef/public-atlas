# Eval dataset for find_homepage on each listed government's domain: 25 of Ontario's 444 municipalities, the ten subject municipalities and fifteen whose listed website is dead, parked, hijacked, moved, wrong or missing.
# Cut from the full list, which was generated by script from the MMAH list (data.ontario.ca) and cross-checked against StatCan 2021 geography; see source and cross_checks.
# status: reviewed 2026-10-01 against the live web and the 2026-05-26 provincial CSV.
country_code: CA
place: Ontario
source:
  url: https://www.ontario.ca/page/list-ontario-municipalities
  data_url: https://data.ontario.ca/dataset/62e83cbc-0731-4d66-abdc-2f2b31bcd76c/resource/6783a586-6b05-4a73-9663-e60a6963c91e/download/municipalities_-_en_2026-0526.csv
  data_url_fr: https://data.ontario.ca/dataset/62e83cbc-0731-4d66-abdc-2f2b31bcd76c/resource/7860ed79-6ed5-41dd-b446-6d8e5d0d8d42/download/municipalities_-_fr_2026-0526.csv
  dataset: https://data.ontario.ca/dataset/municipalities
  publisher: Ministry of Municipal Affairs and Housing (Government of Ontario)
  retrieved_at: "2026-09-29"
  source_version: 'CSV dated 2026-05-26, resource last modified 2026-06-03; the ontario.ca page says "Updated: July 10, 2025" and "There are 444 municipalities in Ontario"'
  note: The ontario.ca page renders its table from https://api.ontario.ca/api/data/83337, which no longer resolves (api.ontario.ca is a CNAME to a non-existent api.ontariogovernment.ca), hence "Unable to load data". The page's own download link (//files.ontario.ca/mmah-list-of-ontario-municipalities-en-utf8-2022-10-05.csv) is an older copy; the data.ontario.ca CSV is the current MMAH release and is used here.
cross_checks:
  - source: MMAH list, 2022-10-05 CSV (files.ontario.ca, linked from the ontario.ca page)
    url: https://files.ontario.ca/mmah-list-of-ontario-municipalities-en-utf8-2022-10-05.csv
    result: "Same 444 municipalities, tiers and geographic areas. Differences: East Ferris changed from Township to Municipality; website URLs updated for 9 municipalities. No additions or removals."
  - source: Statistics Canada, 2021 Census geography (census subdivisions and divisions) via table 17-10-0155-01 metadata (WDS getCubeMetadata) and SGC 2021 structure CSV
    url: https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1710015501 ; https://www.statcan.gc.ca/en/statistical-programs/document/sgc-cgt-2021-structure-eng.csv
    result: 'Ontario has 414 municipal CSDs (types C, CV, CY, T, TP, MU, VL, M, TV; reserves, settlements and unorganized areas excluded) = 173 single + 241 lower. All 414 matched one-to-one by name within the geographic area; the only name difference is Tarbutt (StatCan 2021: "Tarbutt and Tarbutt Additional", 3557014). Every lower-tier CSD sits in the census division of its upper-tier parent, and each of the 30 upper-tiers maps to exactly one CD.'
  - source: Ontario FIPPA/MFIPPA Directory of Institutions, Dec 2025 (institution type "Municipal Corporation")
    url: https://data.ontario.ca/dataset/ec9daf71-33de-469e-af32-05265673049b/resource/c1164f6a-1677-4b21-9ff2-5e92163e9a99/download/doi_dec2025_en.csv
    result: '443 municipal corporations. Missing: Cockburn Island. Stale names there: Galway-Cavendish-Harvey (now Trent Lakes), East Luther Grand Valley (now Grand Valley), Tarbutt and Tarbutt Additional (now Tarbutt). Everything else matches after normalizing "Township Of" style prefixes. The MMAH list is kept as the truth.'
  - source: Live fetch of every official-list website URL on 2026-09-29 (Chrome user agent, redirects followed)
    url: n/a
    result: "homepage is the URL as it serves after redirects. 59 list URLs were set by hand. 37 of them move to another domain: dead or unresolvable domains (e.g. Grimsby, Zorra, Tillsonburg, Southwold, Waterloo city), parked or hijacked domains (Kearney .com is now a gambling site; McDougall, Machar, LaSalle), moved sites (Laurentian Valley, SDG Counties, Elizabethtown-Kitley), a tourism site instead of the municipality (Cramahe), and one swap: the list gives Frontenac County the Frontenac Islands site; the county is frontenaccounty.ca and Frontenac Islands is frontenacislands.ca. The other 22 stay on the same domain with a fixed path or scheme (dead deep links such as Ajax, Whitby /en/, Bayham siteengine) or JS-only home pages kept as is (Ottawa, Simcoe, Moonbeam, Fauquier-Strickland). Vaughan, Quinte West and Hastings County block bots (HTTP 403) and Pickle Lake timed out from here but resolves publicly; those were kept. The list gives no website for Brethour, Gauthier and Thornloe; left empty."
  - source: Re-verification on 2026-10-01 against the live web (Chrome user agent, redirects followed)
    url: https://data.ontario.ca/dataset/municipalities ; https://data.ontario.ca/dataset/municipal-restructuring-activity-summary-table
    result: "The data.ontario.ca CSV is still the 2026-05-26 release and ontario.ca still links the 2022-10-05 CSV; all 444 names, tiers, geographic areas and parents match it, and every listed_homepage matches its link. No 2025-2026 restructuring changes the list: the only recent entry is a Casselman / The Nation annexation (2026-01-01), and the Better Regional Governance Act, 2026 (Bill 100) changes councils, not municipalities. Every homepage and candidate domain was re-fetched; changes: Hearst now serves over https; Brethour (brethourtownship.ca, plus a Wix site) and Gauthier (townshipofgauthier.ca) now have sites of their own; Thornloe still has none found (Facebook page only); edwardsburghcardinal.ca now times out instead of redirecting. Not reachable by script or WebFetch: Vaughan, Quinte West and Hastings County (bot walls, HTTP 403), Huron Shores (HTTP 504), Pickle Lake (connection refused; picklelake.org redirects to it), and St. Thomas (www.stthomas.ca serves a CMS 'uSkinned License Error' page); all kept."
