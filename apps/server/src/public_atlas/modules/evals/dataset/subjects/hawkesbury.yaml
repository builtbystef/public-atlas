notes: >-
  French-majority town (86% French speakers). Every hawkesbury.ca page exists in /en/ and /fr/ with
  translated slugs; the root serves English. The library and Hydro Hawkesbury sites are French-first
  at the root with English under /en/. Sources use the English URL with the French twin as an
  alternate; the town's and the fire service's French home pages are in homepage_alternates (the
  library and Hydro Hawkesbury roots are the French pages, so their /en/ twins are already under the
  root path). Evidence quotes are in the language of the page quoted. No body of the five types
  added with the 2026-10 country file (housing, conservation, paramedic, public health, municipal
  corporation) is the Town's own: paramedics, social housing and the health unit are the UCPR's, and
  South Nation Conservation is labelled once, in the ottawa file (rule 4), so it has no row here
  (Hawkesbury appears to be outside its membership anyway, only in the South Nation source-protection
  area). A Town-owned housing corporation, paramedic service or municipal corporation was searched
  for on the site map, the 2025 statements' reporting entity and the web; none was found (see
  out_of_scope for the near misses).
