candidate_domains:
  - domain: bibliotheque.hawkesbury.on.ca
    institution: hawkesbury-public-library
    expected: confirm
    reason: The library's own site, linked from the Town's navigation and footer (FR and EN).
  - domain: hydrohawkesbury.ca
    institution: hydro-hawkesbury-inc
    expected: confirm
    reason: The utility's own site, linked from the Town's FAQ (FR and EN) and power-outage notices.
  - domain: vivreahawkesbury.ca
    institution: town-of-hawkesbury
    expected: reject
    reason: >-
      "Vivre à Hawkesbury", linked from the Town home page, belongs to the Communauté francophone
      accueillante de Hawkesbury (footer: "Tous droits réservés © 2021. Communauté francophone
      accueillante de Hawkesbury", privacy policy of CÉSOC), an IRCC-funded newcomer project, not the
      Town. The English path the Town links (/en/home/) returns 404.
  - domain: slwofc.ca
    institution: town-of-hawkesbury
    expected: reject
    reason: >-
      Service Line Warranties of Canada, a private company whose letters carry the Town's logo; the
      Town's FAQ links it but says "it is not a Town program".
  - domain: comzacbia.ca
    institution: town-of-hawkesbury
    expected: reject
    reason: Hawkesbury BIA (Commission de la Zone d'amélioration commerciale), out of scope.
  - domain: las.on.ca
    institution: town-of-hawkesbury
    expected: reject
    reason: >-
      Local Authority Services (AMO's group-buying arm), linked from the Town's tender page ("here or
      on www.las.on.ca"). Its Bid Opportunities page lists LAS's own cooperative RFPs, not the Town's
      tenders, so it is another body's site, not a hosting platform for Town pages (checked
      2026-10-01). Was review in the draft.
  - domain: ipn.paymentus.com
    institution: town-of-hawkesbury
    expected: reject
    reason: >-
      Paymentus bill-payment portal ("Pay my bills"), linked from the header of every Town page; a
      vendor payment app with no source types, not the Town's domain.
  - domain: hawkesbury.bciti.com
    institution: town-of-hawkesbury
    expected: reject
    reason: Bciti+, a third-party citizen app the Town uses for notices and requests; hosts no source types.
  - domain: app.amilia.com
    institution: town-of-hawkesbury
    expected: reject
    reason: Amilia, third-party recreation registration store for the Robert Hartley Sports Complex.
  - domain: cdnsm5-hosted.civiclive.com
    institution: town-of-hawkesbury
    expected: reject
    reason: >-
      File CDN of the Town's former CivicLive website, still linked for a few PDFs (tax rebate
      by-law, community safety plan); a vendor host, not an institution domain.
  - domain: hawkesbury.insigniails.com
    institution: hawkesbury-public-library
    expected: reject
    reason: The library's Insignia catalogue (vendor-hosted ILS), not its website.
  - domain: rds.oeb.ca
    institution: hydro-hawkesbury-inc
    expected: reject
    reason: >-
      Ontario Energy Board document search, linked from Hydro Hawkesbury's rates page ("APPLICATION
      AND EVIDENCE DOCUMENTS", case EB-2026-0048); the regulator's domain, not the utility's.
  - domain: chabo.ca
    institution: hydro-hawkesbury-inc
    expected: reject
    reason: >-
      The web designer's site, linked from the footer of every Hydro Hawkesbury page ("Web creation:
      Chabo.ca"); a vendor, not an institution.
  - domain: hiia.ca
    institution: town-of-hawkesbury
    expected: reject
    reason: >-
      Hawkesbury Industrial Investment Association, linked from the Town's Entrepreneurship page
      ("Visit their website"); an independent non-profit the Town does not control (out_of_scope),
      not the Town's domain.
  - domain: hawkesbury.nsw.gov.au
    institution: town-of-hawkesbury
    expected: reject
    reason: Lookalike, Hawkesbury City Council in New South Wales, Australia (shows up in tender and annual-report searches).
  - domain: townofporthawkesbury.ca
    institution: town-of-hawkesbury
    expected: reject
    reason: Lookalike, Town of Port Hawkesbury, Nova Scotia.

out_of_scope:
  - name: Ontario Provincial Police, Hawkesbury Detachment (Police provinciale de l'Ontario)
    url: https://www.opp.ca/
    reason: Hawkesbury has no municipal police; it is policed by the OPP, a provincial service.
  - name: Hawkesbury OPP Detachment Board (Conseil du détachement de la P.P.O. de Hawkesbury)
    url: https://www.hawkesbury.ca/en/residents-services/public-safety/opp-detachment-board
    reason: >-
      README scope rule 5: an OPP detachment board is out_of_scope (it governs the OPP, which is
      provincial). Board under the Community Safety and Policing Act, shared by Alfred and
      Plantagenet, Champlain, East Hawkesbury, Hawkesbury and The Nation, with provincial appointees;
      it runs no police service or procurement. Its page on hawkesbury.ca has agendas, minutes and a
      budget, so an agent may well save it: count that as a false positive.
  - name: Prescott-Russell Fire and Emergency Dispatch Services
    reason: >-
      A division of the Hawkesbury Fire Department (its "Emergency Communications" service area,
      dispatching for 7 municipalities); covered by the fire_service row, not its own institution.
  - name: Hawkesbury Environment Department (drinking water and wastewater)
    url: https://www.hawkesbury.ca/en/residents-services/environment-and-waste/drinking-water-and-wastewater-management
    reason: Town department that runs the water and wastewater plants under the Town's name; no separate utility body or brand (rule 3b).
  - name: United Counties of Prescott and Russell (Comtés unis de Prescott et Russell)
    url: https://www.prescott-russell.on.ca/
    reason: Upper-tier government (level region), scored under its own place, not this lower-tier subject.
  - name: PR Transpo
    url: https://en.prescott-russell.on.ca/stay/pr_transpo
    reason: County (UCPR) service, not the Town's; the intermunicipal transit was permanently suspended in 2023. Hawkesbury has no municipal transit.
  - name: Prescott-Russell Paramedic Services and UCPR social housing
    url: https://www.prescott-russell.on.ca/
    reason: >-
      Upper-tier (UCPR) services: the paramedic service and the housing department are run by the
      United Counties, not the Town (rule 2, a body of the upper tier met on a lower tier's site). They
      belong to the UCPR's file, which is not a subject.
  - name: Eastern Ontario Health Unit (Bureau de santé de l'est de l'Ontario)
    url: https://eohu.ca/
    reason: >-
      Public health unit of the upper tiers, not the Town: its board seats are "appointed for the
      counties of Prescott-Russell", SDG and Cornwall, and it is cost-shared by the Province, the two
      United Counties and Cornwall (eohu.ca/en/about-us, checked 2026-10-01). Hawkesbury neither
      appoints to nor funds it, so it belongs to the UCPR's file (not a subject), not this one (rule 2).
  - name: Hôpital général de Hawkesbury et district (Hawkesbury and District General Hospital)
