absent_sources:
  - institution: linx-transit
    source_type: procurement
    covered_by: county-of-simcoe
    note: >-
      LINX has no procurement page of its own. As a county division it buys through County
      Procurement, Fleet and Property, whose Vendor Information page lists "Heavy, light duty, public
      transit and off-the-road (OTR) vehicles, repair, maintenance, and fuel" among the commodities
      it buys. Checked the LINX pages (landing, About, Accessible Transit, Fares) and simcoe.ca search.

  - institution: linx-transit
    source_type: tender
    covered_by: county-of-simcoe
    note: >-
      LINX bids (buses, operations contracts) are posted as County of Simcoe bids on the county's
      bids&tenders portal (simcoecounty.bidsandtenders.ca); there is no LINX bid page.

  - institution: linx-transit
    source_type: budget
    covered_by: county-of-simcoe
    note: >-
      No LINX budget page. The Transit budget is a section of the county budget book (2026 Budget
      PDF, page 258, "Transit ... The LINX transit system provides citizens and visitors a reliable
      and courteous transit system"), published on the county's Budgets page.

  - institution: linx-transit
    source_type: capital_plan
    covered_by: county-of-simcoe
    note: >-
      No LINX capital plan page. Transit capital (bus purchases, the bus order cancelled after the
      maker's insolvency) is in the county budget book, 2026 Budget PDF page 263, on the county's
      Budgets page. The Transportation Master Plan page (https://simcoe.ca/services/planning/tmp/,
      transit, road and active transportation network to 2051) is the county's, not a LINX plan.

  - institution: linx-transit
    source_type: board_meeting
    note: >-
      LINX has no board of directors. It is a county division, and transit matters go to County
      Council / Committee of the Whole (see the county's council_meeting source on
      simcoe.civicweb.net). Checked the LINX pages (landing, About, Accessible Transit, Fares),
      the Transit Service Delivery Review page, the Council & Committees list of committees (no
      transit committee), and a web search for a LINX board.

  - institution: linx-transit
    source_type: strategic_plan
    covered_by: county-of-simcoe
    note: >-
      No LINX plan page: the LINX landing page on simcoe.ca and its navigation (checked
      2026-09-29) link to no transit plan. Transit is a division, so its direction sits in the
      County's strategic plan, recorded under the county. Judgement call: the county's
      Transportation Master Plan (https://simcoe.ca/services/planning/tmp/) sets the transit network
      to 2051 and names LINX, but it is a county-wide multimodal plan, not a LINX plan; a reviewer
      may prefer it as a LINX strategic_plan source.

  - institution: simcoe-county-housing-corporation
    source_type: procurement
    covered_by: county-of-simcoe
    note: >-
      No procurement page of its own. SCHC buys through County Procurement, Fleet and Property: its
      bids are posted as County of Simcoe bids on simcoecounty.bidsandtenders.ca (e.g. RFP 2018-021,
      "The Simcoe County Housing Corporation (SCHC) is planning the redevelopment of a 4 acre site
      located in the Town of Wasaga Beach"). Checked the Housing pages and the Vendor Information page.

  - institution: simcoe-county-housing-corporation
    source_type: tender
    covered_by: county-of-simcoe
    note: >-
      SCHC bids are posted on the county's bids&tenders portal under the County of Simcoe (RFP
      2018-021); there is no SCHC bid page.

  - institution: lake-simcoe-regional-airport
    source_type: procurement
    covered_by: county-of-simcoe
    note: >-
      No procurement page on lakesimcoeairport.com (checked the menu, About, Contact and Business at
      the Airport pages). The county's Vendor Information page lists "Airport maintenance equipment"
      among the commodities County Procurement buys.

  - institution: lake-simcoe-regional-airport
    source_type: tender
    covered_by: county-of-simcoe
    note: >-
      No bid page on lakesimcoeairport.com; airport bids go through the county's bids&tenders portal
      (simcoecounty.bidsandtenders.ca), whose About Procurement page names the airport among the
      county's services.

  - institution: simcoe-muskoka-district-health-unit
    source_type: budget
    note: >-
      No budget page found. Checked the About Us menu (Health Unit Profile, Board of Health, Board
      Meetings, Agendas, Minutes, Reports, Strategic Plan) and a web search for an SMDHU budget page;
      the budget is approved by the Board of Health in its meeting materials. The county's budget
      book shows only the county's levy to it (2026 Budget PDF, page 335), not the health unit's
      budget, so it is not covered_by the county.

