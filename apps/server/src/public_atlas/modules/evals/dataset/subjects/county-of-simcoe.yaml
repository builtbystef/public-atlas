      "Vendor Information" page: how the county buys (bids&tenders over $100,000, supplier database
      below), commodities purchased, and contact. The Doing Business hub (one click up) and the
      About Procurement, Fleet and Property page are alternates. Procurement policy PDF:
      https://simcoe.ca/wp-content/uploads/2025/11/POL-PFP-2025-01-Procurement-Policy.pdf.
