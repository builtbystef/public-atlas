out_of_scope:
  # Separated cities
  - name: City of Barrie
    url: https://www.barrie.ca/
    reason: >-
      Separated single-tier city, not part of the county government ("The cities of Barrie and
      Orillia, although separate politically and administratively from the County, are
      geographically and economically part of the County", simcoe.ca Council & Committees). It is in
      census division 3543 but is its own municipality-level subject. The county provides paramedic,
      social and housing services to it under agreement.
  - name: City of Orillia
    url: https://www.orillia.ca/
    reason: Separated single-tier city, not part of the county government (same source as Barrie). It is in census division 3543 but is its own municipality-level place.

  # Policing: not a county function
  - name: Ontario Provincial Police
    url: https://www.opp.ca/
    reason: >-
      Polices most Simcoe County municipalities (and Orillia) under contract with the lower tiers.
      The county has no police service or board: simcoe.ca says the lower-tier municipalities are
      responsible for "fire and police services". A provincial body, scored under Ontario.
  - name: Huronia West OPP Detachment Board
    url: https://www.wasagabeach.com/our-organization/boards-committees/huronia-west-opp-detachment-board/
    reason: OPP detachment board (Community Safety and Policing Act) for Clearview, Springwater and Wasaga Beach; governed by lower-tier members, not the county.
  - name: Southern Georgian Bay OPP Detachment Board
    url: https://sgb.detachmentboard.com/
    reason: OPP detachment board for Midland, Penetanguishene, Tay, Tiny and Georgian Bay; lower-tier body, not the county. Other Simcoe detachment boards (Nottawasaga, Collingwood and Blue Mountains, Orillia) are in the same position.
  - name: South Simcoe Police Service
    url: https://southsimcoepolice.on.ca/
    reason: Municipal police of the Town of Innisfil and the Town of Bradford West Gwillimbury (lower tiers), not the county.
  - name: Barrie Police Service
    url: https://www.barriepolice.ca/
    reason: Police service of the separated City of Barrie; not the county.
  - name: Bradford West Gwillimbury/Innisfil Police Service Board
    reason: Board of the South Simcoe Police Service (rule 5 folds it into the service), which belongs to the Towns of Innisfil and Bradford West Gwillimbury (lower tiers), not the county.

  # County departments and dissolved bodies that are not institutions
  - name: County of Simcoe long-term care homes (Georgian Manor, Simcoe Manor, Sunset Manor, Trillium Manor)
    url: https://simcoe.ca/ltc
    reason: '"The County owns and operates 4 long-term care homes." Long-term care homes run as a county department (Long-Term Care and Seniors Services), not separately constituted; README rule 2 keeps them out.'
  - name: Simcoe County Library Co-operative
    reason: >-
      County-managed library co-operative, dissolved by County Council in 2022 and replaced by a
      county Information Library Service (ILS) that gives IT and licensing support to the local
      libraries (simcoe.ca statement of April 26, 2022); the ILS is not a library. A dissolved body gets no row. Had it still operated it would
      be a library row with expected: review (README rule 1: a YAML type at a level the YAML does
      not list it under). Public libraries in Simcoe are lower-tier boards.
  - name: Simcoe County Museum
    url: https://museum.simcoe.ca/
    reason: >-
      County department on its own subdomain, not a separately constituted board or corporation.
      Rule 3(b) gives a division a row only when its work matches a type; a museum run as a
      department does not (municipal_corporation covers a venue only when a corporation, authority
      or board the county owns runs it).
  - name: County of Simcoe Paramedic Services
    url: https://simcoe.ca/residents/paramedic-services/
    reason: A department of the County of Simcoe, which buys and budgets for it; the country file has no paramedic type (dropped 2026-10-01, README rule 2)
  - name: Simcoe County Archives
    url: https://simcoe.ca/explore/simcoe-county-archives/
    reason: County department, not separately constituted; its work matches no institution type (rule 3(b)).
  - name: Simcoe County Forests
    url: https://simcoe.ca/explore/forests/
    reason: County forest management department, not separately constituted; its work matches no institution type (rule 3(b)).
  - name: County of Simcoe Solid Waste Management
    url: https://simcoe.ca/residents/organics-recycling-and-garbage/
    reason: >-
      County waste collection and landfill department. Rule 8: a waste department gets a
      public_utility row only when it presents under its own name, like Toronto Water. Simcoe's
      does not: its pages are the "Organics, Recycling, & Garbage" section of simcoe.ca with no
      name, brand or site of its own, and "Solid Waste Management" appears only as a department
      label (CAO page, Council Highlights). It is not separately constituted. The old URL
      /residents/organics-and-garbage/ still serves the same page. Open question in
      docs/todo.md (open decisions); judgement call for review.
  - name: Economic Development Office / Tourism Simcoe County / Immigration Simcoe
    url: https://edo.simcoe.ca/
    reason: >-
      County departments on simcoe.ca subdomains (edo., experience., immigration.), not separately
      constituted. municipal_corporation covers economic development only when a corporation,
      authority or board the county owns runs it (rule 3); a department doing it gets no row.

  # Lower-tier bodies (not the county's)
  - name: Barrie Transit
    url: https://www.barrie.ca/services-payments/transportation-parking/barrie-transit
    reason: City of Barrie transit (separated city). LINX connects to it but it is not a county body.
  - name: Local transit of member municipalities (Colltrans, BWG Transit, Midland Transit, Wasaga Beach Transit, Innisfil Transit) and Orillia Transit
    reason: '"six of the County’s 16 member municipalities, as well as Barrie and Orillia, operate their own transit service" (simcoe.ca/transitreview). Lower-tier or city bodies, not the county.'
  - name: InnPower Corporation
    url: https://innpower.ca/
    reason: Electricity distributor owned by the Town of Innisfil (lower tier). The county owns no utility; water, sewer and hydro are lower-tier.

  # Other levels / types
  - name: Simcoe County District School Board
    url: https://www.scdsb.on.ca/
    reason: school_board is a province-level type, scored under Ontario, not the county.
  - name: Simcoe Muskoka Catholic District School Board
    url: https://www.smcdsb.on.ca/
    reason: school_board is a province-level type, scored under Ontario.
  - name: Royal Victoria Regional Health Centre
    url: https://www.rvh.on.ca/
    reason: hospital is a province-level type, scored under Ontario.
  - name: Georgian Bay Area Public Purchasing Co-operative
    reason: Voluntary buying group of public bodies that the county belongs to (named on its bids&tenders page and About Procurement page); not owned or controlled by the county (rule 3) and runs no business of its own.

notes: >-
  Upper-tier county with 16 lower-tier members. Barrie and Orillia are separated cities. The county
  runs paramedics, social services, housing, long-term care, roads, waste, LINX transit, museum,
  archives, forests and an airport. Besides regional_government and transit_agency (LINX) it has
  two municipal_corporation rows (Simcoe County Housing Corporation and Lake Simcoe Regional
  Airport Inc.) and, as a shared body labelled here, public_health_unit (Simcoe Muskoka District
  Health Unit). County of Simcoe Paramedic Services is a department with no type of its own
  (out_of_scope). The county runs no police service and no utility (waste is a department
  without a name of its own, rule 8). Its CivicWeb meeting types list only two boards of its own
  (SCHC and LSRA); long-term care, museum, archives, forests and economic development are
  departments. The county library co-operative, which would be a library row with expected: review,
  is dissolved. Nottawasaga Valley and Lake Simcoe Region Conservation Authorities are left out with
  no row: their members are the lower-tier municipalities (NVCA's About page lists 18, none of them
  the county), simcoe.ca only links to them, and the 2026 county budget has no levy to either. LINX,
  SCHC and the airport buy (and LINX budgets) through the county, so those absent_sources carry
  covered_by: county-of-simcoe (README, "Bought or budgeted through someone else").
