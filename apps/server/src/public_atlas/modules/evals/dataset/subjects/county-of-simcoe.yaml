subject:
  kind: place
  country_code: CA
  name: County of Simcoe
  level: region
  place: County of Simcoe
  parent: Ontario
  tier: upper
  official_code: "3543" # Statistics Canada census division "Simcoe, County (CTY)", SGC 2021 3543 (verified). The CD geography includes Barrie and Orillia; the county government does not.
  institution: county-of-simcoe

status: reviewed
reviewed_at: 2026-10-01
labelled_at: 2026-09-29

trusted_at_start: [ontario.ca, simcoe.ca]

institutions:
  - key: county-of-simcoe
    type: regional_government
    names:
      - { text: County of Simcoe, lang: en }
      - { text: Corporation of the County of Simcoe, lang: en }
      - { text: Simcoe County, lang: en }
    homepage: https://simcoe.ca/
    homepage_host: trusted_domain
    evidence:
      url: https://simcoe.ca/government/clk/municipal-partners/
      quote: "The County of Simcoe is composed of 16 member municipalities and, as an upper tier municipality, provides a wide-range of crucial public services to County residents"
    notes: >-
      www.simcoe.ca and http://simcoe.ca redirect to https://simcoe.ca/. The ontario.ca list of
      municipalities (https://www.ontario.ca/page/list-ontario-municipalities) is rendered from
      api.ontario.ca by JavaScript, so it cannot give a curl-checkable quote; evidence is from simcoe.ca.

  - key: linx-transit
    type: transit_agency
    names:
      - { text: LINX Transit, lang: en }
      - { text: Simcoe County LINX, lang: en }
      - { text: LINX, lang: en }
    homepage: https://simcoe.ca/residents/linx-transit/
    homepage_host: trusted_domain
    evidence:
      url: https://simcoe.ca/residents/linx-transit/about-linx-transit/
      quote: "Simcoe County LINX is a conventional public transit system that begun it’s operations in 2018."
    notes: >-
      A county division (Transit, in Transportation and Engineering), not a separate board or
      commission; it gets a row under rule 3(b) because it matches transit_agency and presents
      itself under its own name. LINX Plus (LINX+) is its specialized service, not a separate body.
      http://linx.simcoe.ca redirects to the homepage (https://linx.simcoe.ca timed out);
      the legacy https://www.simcoe.ca/dpt/linx/about redirects to the About LINX page. The county's
      Transit Service Delivery Review planned "Transit Governance Recommendations" for Council in
      April 2026; no new transit body was found on simcoe.ca, in the 2026 Council Highlights or in the
      2026 Budget (page 258: Phase 2 of the review continues "advancing the growth of LINX") as of
      2026-10-01.
    parent:
      institution: county-of-simcoe
      label: operates
      evidence:
        url: https://simcoe.ca/transitreview/
        quote: The County also operates a separate inter-community service known as LINX Transit

  - key: simcoe-county-housing-corporation
    type: municipal_corporation
    names:
      - { text: Simcoe County Housing Corporation, lang: en }
      - { text: SCHC, lang: en, is_acronym: true }
      - { text: Simcoe County Housing Corporation Board, lang: en }
      - { text: County of Simcoe Housing Corporation, lang: en }
    homepage: https://simcoe.ca/residents/housing/about/
    homepage_alternates:
      - https://simcoe.ca/residents/housing/
    homepage_host: trusted_domain
    evidence:
      url: https://simcoe.ca/residents/housing/about/
      quote: "The County of Simcoe is the direct owner and manager of the Simcoe County Housing Corporation (SCHC)"
    notes: >-
      Local housing corporation under the Housing Services Act, 2011, wholly owned by the county
      (sole shareholder; its board is county, Barrie and Orillia councillors and meets at Committee
      of the Whole). A separately constituted corporation running community housing, so
      municipal_corporation (housing_corporation folded into it 2026-10-01). No site of its own: its
      home is the "Housing Corporation" section of the county's Social and Affordable Housing page;
      the Housing hub one click up is an alternate.
      Its financial statements are on the county's Financial Information page
      (https://simcoe.ca/simcoe-business/finance/financial-information/), and its operations are the
      Community Housing section of the county budget (2026 Budget PDF, page 79).
    parent:
      institution: county-of-simcoe
      label: sole shareholder
      evidence:
        url: https://simcoe.civicweb.net/Portal/MeetingTypeList.aspx
        quote: The Corporation of the County of Simcoe is the sole shareholder of the Simcoe County Housing Corporation.

  - key: lake-simcoe-regional-airport
    type: municipal_corporation
    names:
      - { text: Lake Simcoe Regional Airport, lang: en }
      - { text: Lake Simcoe Regional Airport Inc., lang: en }
      - { text: LSRA, lang: en, is_acronym: true }
      - { text: Lake Simcoe Regional Airport Board, lang: en }
    homepage: https://lakesimcoeairport.com/
    homepage_host: own_domain
    evidence:
      url: https://simcoe.ca/simcoe-business/doing-business/about-procurement-fleet-and-property/
      quote: "Ontario Works, Lake Simcoe Regional Airport, Children’s Services"
      kind: links_to
      link_target: https://lakesimcoeairport.com/
    notes: >-
      Airport wholly owned by the county since 2020, run by a municipal service corporation (Lake
      Simcoe Regional Airport Inc.) with its own board; the county is its sole shareholder
      (simcoe.civicweb.net meeting types). An airport is named in municipal_corporation's
      definition. The simcoe.ca menu ("Lake Simcoe Regional Airport", Business and Explore) links to
      lakesimcoeairport.com on every page. It buys through County Procurement (the Vendor Information
      page lists "Airport maintenance equipment"), so its procurement and tender are covered_by.
    parent:
      institution: county-of-simcoe
      label: wholly owned by
      evidence:
        url: https://lakesimcoeairport.com/about/
        quote: The Lake Simcoe Regional Airport is wholly owned by the County of Simcoe

  - key: simcoe-muskoka-district-health-unit
    type: public_health_unit
    names:
      - { text: Simcoe Muskoka District Health Unit, lang: en }
      - { text: SMDHU, lang: en, is_acronym: true }
      - { text: Simcoe Muskoka District Health Unit Board of Health, lang: en }
    homepage: https://www.simcoemuskokahealth.org/
    homepage_host: own_domain
    evidence:
      url: https://simcoe.ca/government/clk/aboutcc/
      quote: "Economic Development Sub-Committee, Simcoe Muskoka District Health Unit, and Hospital Board"
    notes: >-
      Shared body (rule 4): its Board of Health has members from the County of Simcoe, the District
      of Muskoka, Barrie and Orillia, plus provincial appointees. Headquartered in Barrie, which is
      not a subject, so its one row is here, the first subject that meets it, with a member_of from
      the county. The county pays it a levy (2026 Budget PDF, page 335: "The Simcoe Muskoka District
      Health Unit (SMDHU) annualized levy is set at $6.4M"). No simcoe.ca page links to its home page
      (only to topic pages), so the evidence is appears_on.

sources:
