institutions:
  - key: city-of-kitchener
    type: municipal_government
    names:
      - { text: City of Kitchener, lang: en }
      - { text: Corporation of the City of Kitchener, lang: en }
    homepage: https://www.kitchener.ca/
    homepage_host: trusted_domain
    evidence:
      url: https://www.kitchener.ca/
      quote: "City of Kitchener 200 King Street West, Kitchener, Ontario N2G 4G7"
    notes: >-
      "The Corporation of the City of Kitchener" is the legal name on kitchener.ca (website policy; Vendor invoices and
      payments: "Full Legal Name – The Corporation of the City of Kitchener must be on all invoices").

  - key: kitchener-fire-department
    type: fire_service
    names:
      - { text: Kitchener Fire Department, lang: en }
      - { text: Kitchener Fire, lang: en }
    homepage: https://www.kitchener.ca/living-in-kitchener/kitchener-fire-department/
    homepage_host: trusted_domain
    evidence:
      url: https://www.kitchener.ca/living-in-kitchener/kitchener-fire-department/about-kitchener-fire/
      quote: "Kitchener Fire provides emergency response, fire prevention and education to residents, visitors and businesses in Kitchener."
    notes: >-
      Internal division (Community Services department) that presents itself under its own name (README scope rule 3b).
      No own domain (kitchenerfire.ca / kitchenerfire.com do not resolve). Its Fire Master Plan page covers 2017-2022 only
      and no successor plan is published (checked 2026-10-01), so it is not recorded as a current strategic_plan.
    parent:
      institution: city-of-kitchener
      label: Community services includes these services
      evidence:
        url: https://www.kitchener.ca/council-and-city-administration/city-departments/
        quote: inclusion and support services Kitchener Fire Department

  - key: kitchener-utilities
    type: public_utility
    names:
      - { text: Kitchener Utilities, lang: en }
      - { text: City of Kitchener Utilities, lang: en }
    homepage: https://www.kitchenerutilities.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.kitchener.ca/taxes-utilities-and-finance/utilities/
      quote: "Our locally owned gas and water utility is a division of the City of Kitchener."
      kind: links_to
      link_target: https://www.kitchenerutilities.ca/en/index.aspx
    notes: >-
      City division (gas, water, sewer, stormwater, rental water heaters) with its own brand and domain (rule 3b).
      The kitchener.ca link targets the legacy /en/index.aspx URL, which redirects to https://www.kitchenerutilities.ca/.
      kitchener.ca home page also links "Kitchener Utilities" -> https://www.kitchenerutilities.ca/.
    parent:
      institution: city-of-kitchener
      label: a division of the City of Kitchener
      evidence:
        url: https://www.kitchener.ca/taxes-utilities-and-finance/utilities/
        quote: Our locally owned gas and water utility is a division of the City of Kitchener.

  - key: kitchener-public-library
    type: library
    names:
      - { text: Kitchener Public Library, lang: en }
      - { text: KPL, lang: en, is_acronym: true }
      - { text: Kitchener Public Library Board, lang: en }
    homepage: https://www.kpl.org/
    homepage_host: own_domain
    evidence:
      url: https://www.kitchener.ca/living-in-kitchener/in-your-neighbourhood/kitchener-public-library/
      quote: "Kitchener Public Library (KPL) has more than 638,000 items in its collections"
      kind: links_to
      link_target: https://www.kpl.org/
    notes: Separately constituted public library board under the Public Libraries Act, members appointed by Kitchener council.
    parent:
      institution: city-of-kitchener
      label: Boards
      evidence:
        url: https://www.kitchener.ca/council-and-city-administration/civic-engagement/advisory-committees-and-boards/
        quote: The Kitchener Public Library (KPL) board, which is established under provincial legislation, is responsible for the management and control of our local public libraries.

  - key: enova-power-corp
    type: public_utility
    names:
      - { text: Enova Power Corp., lang: en }
      - { text: Enova Power, lang: en }
      - { text: Enova, lang: en }
    homepage: https://enovapower.com/
    homepage_host: own_domain
    evidence:
      url: https://www.kitchener.ca/living-in-kitchener/moving-to-kitchener/
      quote: "Enova Power for electricity"
      kind: links_to
      link_target: https://enovapower.com/
    notes: >-
      Shared body (README scope rule 4). Electricity distributor formed 2022 from Kitchener-Wilmot Hydro Inc. and
      Waterloo North Hydro Inc.; wholly owned subsidiary of Enova Energy Corporation, which is owned by Kitchener (53.4%),
      Waterloo (30.8%), Woolwich (8.5%), Wilmot (4.5%) and Wellesley (2.8%). Labelled here because Kitchener is the majority
      owner and the Kitchener office (301 Victoria Street South) is its main office; none of the other owners is a dataset subject.
      Row is the operating company (Enova Power Corp.), not the holding company, since the brief and the city's pages name
      Enova Power as the utility; Enova Energy Corporation is in out_of_scope.

  - key: centre-in-the-square-inc
    type: municipal_corporation
    names:
      - { text: Centre In The Square, lang: en }
      - { text: The Centre In The Square Inc., lang: en }
      - { text: Centre In The Square Inc., lang: en }
      - { text: CITS, lang: en, is_acronym: true }
    homepage: https://centreinthesquare.com/
    homepage_host: own_domain
    evidence:
      url: https://www.kitchener.ca/council-and-city-administration/civic-engagement/advisory-committees-and-boards/
      quote: "is a not-for-profit arts corporation, which operates and maintains the city-owned venue known as the Centre In The Square (CITS)"
      kind: links_to
      link_target: https://centreinthesquare.com/
    notes: >-
      Not-for-profit corporation that runs the city-owned concert hall (a venue, so municipal_corporation, README rule 1).
      Controlled by the city (rule 3a), not only funded: its board is "a 14-member board, which includes the mayor, three
      City of Kitchener councillors, and eight citizens appointed by Kitchener City Council" (centreinthesquare.com
      Governance), it is listed under "Boards" on the city's Advisory committees and boards page, and the city's financial
      report consolidates it "based upon control exercised by the City" (2024 financial report, note 1a, pdf page 36
      (printed 34): "The following boards, municipal enterprises and utilities have been included in the consolidated
      financial statements: ... The Centre in the Square Inc."). Was out of scope (no type) before the type was added.
    parent:
      institution: city-of-kitchener
      label: Boards
      evidence:
        url: https://www.kitchener.ca/council-and-city-administration/civic-engagement/advisory-committees-and-boards/
        quote: operates and maintains the city-owned venue known as the Centre In The Square (CITS)

