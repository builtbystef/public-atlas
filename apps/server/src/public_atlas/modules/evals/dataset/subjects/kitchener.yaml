      Transit is a Region of Waterloo responsibility ("Transit" under Region of Waterloo on kitchener.ca/city-and-regional-services);
      labelled as region-of-waterloo:grand-river-transit.
  - name: Waterloo Regional Police Service
    url: https://wrps.ca/
    reason: Police are a Region of Waterloo responsibility; labelled as region-of-waterloo:waterloo-regional-police-service.
  - name: Region of Waterloo Paramedic Services
    reason: >-
      Ambulance is regional ("Police, Ambulance" under Region of Waterloo on the city and regional services page). A body of
      the upper tier met on the lower tier's site (README rule 2); it belongs to region-of-waterloo.yaml.
  - name: Region of Waterloo Public Health
    reason: >-
      Public health unit of the Region of Waterloo (Regional Council is the Board of Health). A body of the upper tier met on
      the lower tier's site (README rule 2); it belongs to region-of-waterloo.yaml.
  - name: Enova Energy Corporation
    url: https://enovapower.com/corporate-information/about-us/
    reason: >-
      Holding company owned by Kitchener, Waterloo, Woolwich, Wilmot and Wellesley; parent of Enova Power Corp. No website or
      procurement of its own; the utility row is Enova Power Corp. (reviewer: confirm this choice of row).
  - name: Alliance Metering Solutions
    url: https://alliancemetering.com/
    reason: >-
      Commercial sub-metering subsidiary of Enova Energy Corporation; not a public utility in the YAML sense, and a
      subsidiary of the holding company rather than a body the city owns directly, so not a municipal_corporation (README rule 6).
  - name: Enova Energy Services
    reason: >-
      Streetlight-maintenance subsidiary of Enova Energy Corporation (formerly Kitchener Energy Services Inc.). A subsidiary of
      the holding company with no procurement of its own found, so no row (README rules 3 and 6).
  - name: Grand River Energy Solutions Corp.
    reason: >-
      Energy-transition investment subsidiary of Enova Energy Corporation. A subsidiary of the holding company with no
      procurement of its own found, so no row (README rules 3 and 6).
  - name: Kitchener-Wilmot Hydro Inc.
    url: http://www.kwhydro.on.ca/
    reason: Merged into Enova Power Corp. in September 2022; domain redirects to enovapower.com. Saving it as a separate institution is a false positive.
  - name: Kitchener Housing Inc.
    url: https://kitchenerhousinginc.ca/
    reason: >-
      Non-profit housing corporation, incorporated 1986 "sponsored by the City of Kitchener" (its About us page; two
      councillors sit on its board), but not controlled by the city: it is not among the boards and enterprises the city's
      financial report consolidates "based upon control exercised by the City" (2024 report, note 1a), and it is "funded in
      part by the Region of Waterloo". A not-for-profit the city does not control (README rule 2), not a housing_corporation.
  - name: Downtown Kitchener Business Improvement Area
    url: https://downtownkitchenerbia.ca/
