    reason: "BIA (README: out of scope)."
  - name: Kitchener Cemeteries
    url: https://www.kitchenercemeteries.ca/
    reason: >-
      City division with its own site. A division, not a separately constituted corporation, authority or board, so not a
      municipal_corporation (README rule 3); cemeteries match no other type.
  - name: Kitchener Market
    url: https://www.kitchenermarket.ca/
    reason: >-
