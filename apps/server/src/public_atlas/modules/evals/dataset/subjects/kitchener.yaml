absent_sources:
  - institution: kitchener-fire-department
    source_type: procurement
    covered_by: city-of-kitchener
    note: >-
      Kitchener Fire is a city division; it buys through the city's procurement page and bids&tenders site. No fire-specific
      purchasing page in the kitchener.ca sitemap, the Kitchener Fire Department section, or the fire safety section.
  - institution: kitchener-fire-department
    source_type: budget
    covered_by: city-of-kitchener
    note: >-
      No separate fire budget page; fire is funded in the city's operating budget (2026 budget, Appendix B). Checked the Kitchener
      Fire Department section (About, Fire Master Plan 2017-2022, public education) and the budget pages.
  - institution: kitchener-utilities
    source_type: procurement
    covered_by: city-of-kitchener
    note: >-
      No purchasing page on kitchenerutilities.ca (sitemap, About, Builders/developers/contractors pages checked). Purchasing
      goes through the city's procurement page. The "Builder, developer, contractor login" (kuvendorportal.esolutionsgroup.ca)
      is for gas/water service requests, not procurement. The "Gas vendor resources" page (/gas-vendor-resources/) is for
      natural gas direct-purchase marketers (contract request forms, heat values), not for suppliers bidding to the utility.
  - institution: kitchener-utilities
    source_type: tender
    covered_by: city-of-kitchener
    note: No tender listing on kitchenerutilities.ca; utility tenders appear on the city's kitchener.bidsandtenders.ca site.
  - institution: kitchener-utilities
    source_type: capital_plan
    covered_by: city-of-kitchener
    note: >-
      No utility-specific capital plan page on kitchenerutilities.ca (sitemap, Water, Sewer, Stormwater and About pages checked).
      Gas/water/sewer/stormwater capital is in the city's 2026 capital budget (Appendix C) and the Corporate Asset Management
      Plan, both city sources. The sewer page's Integrated Sanitary Master Plan anchor and the story map are not capital plans.
  - institution: kitchener-utilities
    source_type: board_meeting
    note: Kitchener Utilities is a city division with no board of its own; it is governed by Kitchener city council (see city council_meeting).
  - institution: kitchener-public-library
    source_type: budget
    covered_by: city-of-kitchener
    note: >-
      No budget page on kpl.org (site search for "budget", sitemap.xml, Library Board, Governance Policies, Strategic Plan,
      Departments pages checked). Budget material appears only as individual Finance Committee agenda PDFs on the Library
      Board page. The KPL operating grant is set in the city budget ("Boards and Grants include the Centre in the Square
      (CITS) and the Kitchener Public Library (KPL)", 2026 Budget Summary PDF page 28, linked from the 2026 budget page),
      so covered_by the city, as for the Oakville and Greater Sudbury libraries.
  - institution: enova-power-corp
    source_type: procurement
    note: >-
      No procurement/supplier page on enovapower.com: page sitemap (215 URLs), WordPress search API for "procurement",
      "supplier", "tender", "bid", Corporate Information menu, and web search all checked. enovapower.bidsandtenders.ca returns 404.
  - institution: enova-power-corp
    source_type: tender
    note: No bid opportunities on enovapower.com or on bids&tenders/MERX found (same searches as procurement).
  - institution: enova-power-corp
    source_type: capital_plan
    note: >-
      No standalone capital plan or Distribution System Plan page. The Regulatory Information page lists OEB rate applications
      (2027 IRM with an Incremental Capital Module request, as PDFs); judged regulatory filings, not a capital plan landing page.
  - institution: enova-power-corp
    source_type: board_meeting
    note: >-
      Private corporation (OBCA) board; no public agendas or minutes. The Leadership Team page lists directors of Enova Power Corp.
      and Enova Energy Corporation but no meeting materials.
  - institution: centre-in-the-square-inc
    source_type: procurement
    note: >-
      No purchasing or supplier page on centreinthesquare.com: page sitemap (about 120 pages), WordPress search for
      "procurement", "tender", "rfp", "request for proposal", "supplier" and "bid", and the About, Governance, Careers and
      Rentals menus checked 2026-10-01. Not recorded as covered_by the city: no page says CITS buys through the city's
      procurement (it sets its own operating budget, per the city's Boards page).
  - institution: centre-in-the-square-inc
    source_type: tender
    note: No open calls for bids on centreinthesquare.com (same searches as procurement).
  - institution: centre-in-the-square-inc
    source_type: board_meeting
    note: >-
      The board meets monthly at the Centre (city Boards page) but publishes no agendas or minutes: the Governance page
      lists directors only, and WordPress search for "minutes" and "agenda" and the page sitemap found none (2026-10-01).
      Its meetings are not on the city's eSCRIBE portal or council calendar.

candidate_domains:
  - domain: kitchenerutilities.ca
    institution: kitchener-utilities
    expected: confirm
    reason: Kitchener Utilities' own site, linked from kitchener.ca home and utilities pages; footer "© 2026 City of Kitchener Utilities".
  - domain: kpl.org
    institution: kitchener-public-library
    expected: confirm
    reason: Kitchener Public Library's own site, linked from the city's library page.
  - domain: enovapower.com
    institution: enova-power-corp
    expected: confirm
    reason: Enova Power Corp.'s own site, linked from kitchener.ca "Moving to Kitchener"; legacy kwhydro.on.ca and wnhydro.com redirect here.
  - domain: engagewr.ca
    institution: city-of-kitchener
    expected: reject
    reason: >-
      Shared consultation site ("one-stop site for online engagement opportunities across Waterloo Region", with projects
      from Kitchener, Cambridge, North Dumfries and the Region), linked from kitchener.ca's footer and budget page; not any
      institution's homepage. Matches region-of-waterloo.yaml.
  - domain: kuvendorportal.esolutionsgroup.ca
    institution: kitchener-utilities
    expected: reject
    reason: eSolutions Group builder/contractor service-request login linked from Kitchener Utilities; not the utility's website and not a procurement portal.
  - domain: kitchenerhousinginc.ca
    institution: city-of-kitchener
    expected: reject
    reason: >-
      Kitchener Housing Inc., a non-profit housing corporation linked from the city/regional services page ("Social Housing -
      Kitchener Housing"). Sponsored by the city at its founding but not controlled by it (not among the bodies the city's
      financial report consolidates), so a not-for-profit out of scope, not a housing_corporation of Kitchener's.
  - domain: downtownkitchener.ca
    institution: city-of-kitchener
    expected: reject
    reason: >-
      The city's own downtown destination microsite (footer "© 2026 Downtown Kitchener" with the City Hall address and
      info@kitchener.ca, on the same Govstack CMS); a campaign microsite, not the city's official domain. It is not the
      BIA's site (checked 2026-10-01).
  - domain: downtownkitchenerbia.ca
    institution: city-of-kitchener
    expected: reject
    reason: Downtown Kitchener BIA site, linked from the city's Advisory committees and boards page; BIAs are out of scope.
  - domain: kitchenerlive.ca
    institution: city-of-kitchener
    expected: reject
    reason: City-run events microsite ("Kitchener Live"), linked from the kitchener.ca home page; not an institution's official domain.
  - domain: kitchenercemeteries.ca
