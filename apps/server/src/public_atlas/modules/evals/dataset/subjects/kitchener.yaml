  - name: Explore Waterloo Region
    url: https://explorewaterloo.ca/
    reason: Regional tourism organization, a not-for-profit the area municipalities fund but do not control (README rule 2).

notes: >-
  Lower-tier city in the Region of Waterloo. Transit, police, paramedics and public health are regional (see out_of_scope).
  In-scope bodies: Kitchener Fire Department and Kitchener Utilities (city divisions with their own names), Kitchener Public
  Library (separate board), Enova Power Corp. (shared utility, majority-owned by Kitchener, labelled here), and The Centre In
  The Square Inc. (city-controlled corporation running the city-owned concert hall, municipal_corporation). Grand River
  Conservation Authority is a shared body labelled in region-of-waterloo.yaml (README rule 4), so it has no row here.
  Kitchener has no housing corporation of its own: social housing is the Region's, and Kitchener Housing Inc. is a
  non-profit the city does not control (see out_of_scope). The city's joint
  services with Waterloo (fire dispatch, cooperative purchasing) are service agreements, not separate bodies.
  City-run division and event sites (downtownkitchener.ca, kitchenerlive.ca, kitchenercemeteries.ca, kitchenermarket.ca)
  are reject traps, as campaign microsites and no-type division sites are in the other subject files. The city's council
  agendas and minutes live on its eSCRIBE portal (pub-kitchener.escribemeetings.com), which the calendar and the
  "Current agendas and reports" page lead to; Laserfiche holds the minutes archive.
