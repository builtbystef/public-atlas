subject:
  kind: place
  name: Regional Municipality of Waterloo
  level: region
  place: Regional Municipality of Waterloo
  parent: Ontario
  tier: upper
  official_code: "3530" # Statistics Canada census division, verified 2026-09-29 on the 2021 Census Profile (DGUID 2021A00033530, "Waterloo, Regional municipality (RM) [Census division], Ontario")
  institution: regional-municipality-of-waterloo

status: reviewed
reviewed_at: 2026-10-01
labelled_at: 2026-09-29

trusted_at_start: [ontario.ca, regionofwaterloo.ca]

institutions:
  - key: regional-municipality-of-waterloo
    type: regional_government
    names:
      - { text: Regional Municipality of Waterloo, lang: en }
      - { text: Region of Waterloo, lang: en }
    homepage: https://www.regionofwaterloo.ca/
    homepage_host: trusted_domain
    evidence:
      url: https://www.regionofwaterloo.ca/government-and-council/about-us/
      quote: "The Regional Municipality of Waterloo was officially established on January 1, 1973."

  - key: grand-river-transit
    type: transit_agency
    names:
      - { text: Grand River Transit, lang: en }
      - { text: GRT, lang: en, is_acronym: true }
    homepage: https://www.grt.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.regionofwaterloo.ca/programs-and-services/roads-and-transportation/transit-and-transportation/grand-river-transit-and-ion/
      quote: "Grand River Transit (GRT) provides transit service in Waterloo Region."
      kind: links_to
      link_target: https://www.grt.ca/
    notes: >-
      Internal service of the Region (Transit Services, in the Transportation Services department)
      that presents under its own name and domain, so it gets a row under rule 3(b). ION light rail
      and ION bus are GRT service lines ("GRT operates conventional buses, ION light rail trains
      ..."), not a separate body: see out_of_scope. grt.ca is on the same Govstack CMS as
      regionofwaterloo.ca and its footer links back to the Region, but it is not in
      trusted_at_start, so it needs find_homepage.
    parent:
      institution: regional-municipality-of-waterloo
      label: our Region's transit system
      evidence:
        url: https://www.regionofwaterloo.ca/news-public-notices-and-council-info/posts/grt-celebrates-transit-team-appreciation-day/
        quote: Many thanks to all the people who work tirelessly to make our Region’s transit system run each and every day,

  - key: waterloo-regional-police-service
    type: police_service
    names:
      - { text: Waterloo Regional Police Service, lang: en }
      - { text: WRPS, lang: en, is_acronym: true }
      - { text: Waterloo Regional Police, lang: en }
      - { text: Waterloo Regional Police Service Board, lang: en }
    homepage: https://wrps.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.regionofwaterloo.ca/programs-and-services/emergency-services-and-preparedness/police-services/
      quote: "Waterloo Regional Police Service (WRPS) provides policing services for the Region of Waterloo"
      kind: links_to
      link_target: http://www.wrps.on.ca/
    notes: >-
      The Region links to http://www.wrps.on.ca/, which redirects to https://wrps.ca/ (curl reports
      the effective URL as https://wrps.ca:443/). One row for the service and its governing
      Waterloo Regional Police Service Board: the board has no separate site or procurement (its
      pages are wrps.ca/about-us/police-service-board and its eSCRIBE portal), and police_service
      already carries board_meeting as a source type. An agent that saves the board as a second
      police_service row should be reviewed, not necessarily penalised. "Waterloo Regional Police"
      is the wrps.ca page-title name. "Waterloo Regional Police Service Board" is in names under
      README rule 5 (wrps.ca/about-us/police-service-board and the Region's Boards and Foundations
      page both use it); checked 2026-10-01.
    parent:
      institution: regional-municipality-of-waterloo
      label: Its budget is the responsibility of Regional Council
      evidence:
        url: https://www.regionofwaterloo.ca/government-and-council/committees/boards-and-foundations/
        quote: Its budget is the responsibility of Regional Council and met through the Regional levy.

  - key: region-of-waterloo-library
    type: library
    expected: review
    names:
      - { text: Region of Waterloo Library, lang: en }
      - { text: RWL, lang: en, is_acronym: true }
    homepage: https://www.rwlibrary.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.regionofwaterloo.ca/culture-and-experiences/arts-and-culture/libraries/
      quote: "The Region of Waterloo operates 12 library branches in the four townships."
      kind: links_to
      link_target: https://www.rwlibrary.ca/
    notes: >-
      A Region service (Cultural Services, in Planning, Development and Legislative Services)
      that presents under its own name and domain, so it gets a row under rule 3(b). canada.yaml
      lists library under municipality only, so this is the README rule 1 case: the agent should
      save it as a library and it should land in review (rule type_level). Its governing Library
      Committee (a committee of Regional Council chaired by a township mayor) folds into this row
      under rule 5. rwlibrary.ca is on the same Govstack CMS as regionofwaterloo.ca and its
      footer links back to the Region, but it is not in trusted_at_start, so it needs
      find_homepage.
    parent:
      institution: regional-municipality-of-waterloo
      label: operates
      evidence:
        url: https://www.regionofwaterloo.ca/culture-and-experiences/arts-and-culture/libraries/
        quote: The Region of Waterloo operates 12 library branches in the four townships.

  - key: region-of-waterloo-public-health
    type: public_health_unit
    names:
      - { text: Region of Waterloo Public Health, lang: en }
    homepage: https://www.regionofwaterloo.ca/programs-and-services/public-health/
    homepage_host: trusted_domain
    evidence:
      url: https://www.regionofwaterloo.ca/programs-and-services/public-health/
      quote: "Region of Waterloo Public Health operates out of three main clinic spaces."
    notes: >-
      The health unit for Waterloo Region, a Region division (Public Health, in the Public Health
      and Paramedic Services department) that presents under its own name, so it gets a row under
      rule 3(b). Its board of health is Regional Council itself ("Region of Waterloo Council serves
      as the Board of Health for this region"), so there is no separate board row; under rule 5 the
      Board of Health meetings are this row's board_meeting source. No site of its own.
    parent:
      institution: regional-municipality-of-waterloo
      label: reports to the Board of Health
      evidence:
        url: https://www.regionofwaterloo.ca/government-and-council/committees/boards-and-foundations/
        quote: Region of Waterloo Public Health reports to the Board of Health.

  - key: waterloo-region-housing
    type: municipal_corporation
    names:
      - { text: Waterloo Region Housing, lang: en }
      - { text: WRH, lang: en, is_acronym: true }
    homepage: https://www.regionofwaterloo.ca/programs-and-services/housing-and-shelter/
    homepage_host: trusted_domain
    evidence:
      url: https://www.regionofwaterloo.ca/programs-and-services/housing-and-shelter/apply-for-community-housing/living-in-community-housing/
      quote: "As a tenant of Waterloo Region Housing rent payments can be made online, in-person or by mail."
    notes: >-
      Judgement call. The Region's own community housing (more than 2,700 units), which the Region
      owns and operates directly through Housing Services rather than through a separate local
      housing corporation, but which presents to tenants under its own name (Waterloo Region
      Housing, WRH: rent payee, revitalization plan, its own ten-year capital section in the budget
      book). A municipal_corporation row under rule 3(b): not a separately constituted body, but a
      Region division that runs a business of its own (community housing: tenants, rents, property
      managers) under its own name, the same call as the airport; the type names community housing
      (housing_corporation was folded into municipal_corporation on 2026-10-01). No site of its
      own: homepage is the Region's Housing and Shelter section, whose pages (Living in
      Community Housing, the WRH Revitalization Plan) carry it. Reviewer may prefer out_of_scope as
      a service of the Region.
    parent:
      institution: regional-municipality-of-waterloo
      label: owns and operates
      evidence:
        url: https://www.regionofwaterloo.ca/programs-and-services/housing-and-shelter/apply-for-community-housing/living-in-community-housing/
        quote: The Region owns and operates more than 2,700 community housing units in Waterloo Region.

  - key: region-of-waterloo-international-airport
    type: municipal_corporation
    names:
      - { text: Region of Waterloo International Airport, lang: en }
      - { text: YKF, lang: en, is_acronym: true }
    homepage: https://www.waterlooairport.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.regionofwaterloo.ca/culture-and-experiences/airport/
      quote: "The Region of Waterloo International Airport (YKF) is a full-service, customer-friendly facility"
      kind: links_to
      link_target: "https://www.waterlooairport.ca/#"
    notes: >-
      Judgement call. Not a separately constituted corporation: the airport is a Region division
      (a chapter of Planning, Development and Legislative Services in the budget book) that runs a
      business of its own (airlines, 44 tenant businesses, rates and fees, parking) under its own
      name and domain, so it gets a municipal_corporation row under rule 3(b); the type names an
      airport. The Region's Airport page links the site only as "https://www.waterlooairport.ca/#"
      (Learn More), so that is the link_target. Reviewer may prefer out_of_scope as a Region
      service.
    parent:
      institution: regional-municipality-of-waterloo
      label: owned and operated by
      evidence:
        url: https://www.regionofwaterloo.ca/news-public-notices-and-council-info/posts/region-of-waterloo-international-airport-ykf-propels-economic-growth/
        quote: YKF is owned and operated by the Regional Municipality of Waterloo, Ontario (Canada).

  - key: grand-river-conservation-authority
    type: conservation_authority
    names:
      - { text: Grand River Conservation Authority, lang: en }
      - { text: GRCA, lang: en, is_acronym: true }
    homepage: https://www.grandriver.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.regionofwaterloo.ca/government-and-council/committees/boards-and-foundations/
      quote: "The Grand River Conservation Authority is established under the Conservation Authorities Act."
      kind: links_to
      link_target: http://www.grandriver.ca/
    notes: >-
      Shared body (rule 4): 38 watershed municipalities, 22 of them participating municipalities
      that appoint its 26-member board. One row in the whole eval dataset, here: it is headquartered in
      Cambridge, inside the Region (400 Clyde Road, per the Region's Boards and Foundations page),
      and the Region appoints board members (the GRCA contact page lists eight "Region of Waterloo"
      members). Other subject files (kitchener) leave it without a row. The Grand River Source
      Protection Authority is the same board under the Clean Water Act, not a separate row.

