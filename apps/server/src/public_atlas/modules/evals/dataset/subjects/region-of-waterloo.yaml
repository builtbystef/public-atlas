out_of_scope:
  - name: ION (ION light rail and ION bus rapid transit)
    url: https://www.regionofwaterloo.ca/programs-and-services/roads-and-transportation/transit-and-transportation/grand-river-transit-and-ion/
    reason: >-
      Service lines of Grand River Transit, not a separate body ("GRT operates conventional buses,
      ION light rail trains and specialized vehicles"). Stage 2 ION is a Region capital project.
      Saving ION as its own transit_agency is a false positive.
  - name: GrandLinq
    reason: Private consortium that built and operates/maintains ION light rail under contract to the Region; not a public body.
  - name: Kiwanis Transit
    url: https://www.grt.ca/mobilityplus/specialized-transit-services-for-township-residents/
    reason: Independent non-profit providing specialized transit in Wellesley, Wilmot and Woolwich, funded by the Region; not controlled or owned by it.
  - name: Region of Waterloo Water and Wastewater Services
    url: https://www.regionofwaterloo.ca/programs-and-services/water-and-wastewater/
    reason: >-
      Judgement call. public_utility is a region-level type, but water and wastewater is an
      internal service area of the Engineering and Environmental Services department with no own
      brand, site or procurement (Region Procurement buys for all divisions), so it fails rule
      3(b). Reviewer may prefer a public_utility row.
  - name: Region of Waterloo Museums
    url: https://www.regionofwaterloomuseums.ca/
    reason: >-
      Judgement call. Cultural service of the Region (Cultural Services, with its own site) that
      runs museums and archives as a public program funded through the levy, not a corporation,
      authority or board running a business of its own, so not a municipal_corporation; no other
      type covers museums. Reviewer may prefer a municipal_corporation row (a venue).
  - name: Waterloo Region Economic Development Corporation
    url: http://www.techtriangle.com/
    reason: >-
      A not-for-profit the Region funds but does not control: the Region's words are "an
      independent non-profit corporation governed by a board of directors" whose board "includes
      municipal representatives and other public sectors, but mainly represents business". Not a
      municipal_corporation, which needs ownership or control.
  - name: Region of Waterloo Arts Fund
    url: https://artsfund.ca/
    reason: >-
      Arm's-length granting body created by Regional Council; it only gives grants and runs no
      business of its own, so it is not a municipal_corporation, and no other type covers it.
  - name: Waterloo Regional Heritage Foundation
    url: http://www.wrhf.org/
    reason: A funding foundation for local heritage groups; foundations are out of scope (README rule 2), and it runs no business of its own.
  - name: Grand River Conservation Foundation
    url: https://www.grandriver.ca/who-we-are/grcf/
    reason: The GRCA's charitable fundraising foundation (donations, grants, scholarships), not the conservation authority itself; foundations are out of scope (README rule 2).
  - name: Region of Waterloo Paramedic Services
    url: https://www.regionofwaterloo.ca/programs-and-services/emergency-services-and-preparedness/ambulance-and-paramedic-services/
    reason: >-
      A department of the Regional Municipality of Waterloo, which buys and budgets for it; the
      country file has no paramedic type (dropped 2026-10-01, README rule 2).
  - name: University of Waterloo and Wilfrid Laurier University (Boards of Governors)
    reason: Regional Council appoints a representative, but universities are province-level types, scored under Ontario.
  - name: Ontario Provincial Police, Cambridge Detachment
    url: https://www.opp.ca/
    reason: Polices provincial highways in the region; a provincial service, not the Region's.
  - name: Waterloo Region District School Board and Waterloo Catholic District School Board
    reason: >-
      School boards named for the region but not controlled by it; school_board is a
      province-level type, scored under Ontario (README rule 2). Matches kitchener.yaml.

notes: >-
  Scope: at region level the country file lists regional_government, transit_agency,
  police_service, public_utility, and conservation_authority, public_health_unit and
  municipal_corporation. Found two bodies of the first four types besides the Region: Grand River
  Transit (division with own name and domain) and Waterloo Regional Police Service (with its board
  folded into one row), plus the Region of Waterloo Library, a library at a level the YAML does
  not list it under, recorded with expected: review. Of the three later types: Region of Waterloo
  Public Health (Regional Council is its Board of Health), Waterloo Region Housing and the Region
  of Waterloo International Airport are Region divisions under their own names (rule 3(b); housing
  and the airport are judgement calls, both municipal_corporation rows since housing_corporation
  was folded into it on 2026-10-01), and the Grand River Conservation Authority is a shared body
  whose one row in the eval dataset is here (rule 4; headquartered in Cambridge, Region-appointed
  board members). Region of Waterloo Paramedic Services is out_of_scope: the paramedic type was
  dropped on 2026-10-01, as a department the Region buys and budgets for. Museums, the arts and
  heritage funds and the economic development corporation stay out_of_scope with reasons. No regional body presents as a public utility under
  its own name; the Region's Water and Wastewater Services is out_of_scope as a judgement call. Both regionofwaterloo.ca and
  grt.ca moved to Govstack in 2025-26; old .aspx URLs mostly 404 or redirect. No relationship with
  a City of Kitchener body is stated on a Region page (the Mayor of Kitchener sits on Regional
  Council, but that is a place link, not an institution relationship), so no cross-file
  ref is used. The WRPS strategic plan is recorded under the floor rule. Supplier
  registration pages are not recorded: vendor_portal was dropped as a source type on
  2026-10-01 (how to register to bid is not a buying signal).
