  # --- Grand River Transit ---
  - institution: grand-river-transit
    source_type: capital_plan
    url: https://www.grt.ca/about-grt/plans-and-projects/grt-business-plan/
    alternates:
      - https://www.grt.ca/about-grt/plans-and-projects/
    evidence:
      url: https://www.grt.ca/about-grt/plans-and-projects/grt-business-plan/
      quote: "Grand River Transit's business plan will provide a roadmap to guide future transit service expansion and investments over the next 10 years and beyond."
    notes: >-
      Judgement call. The GRT Business Plan is a ten-year service and investment plan (fleet
      growth, stations, frequent network); coverage reports put its major transit capital
      projects at $798M for 2025-2035, so it counts as the capital plan as well as the strategic
      plan (one URL, two source types). The Transit capital program itself sits in the Region's
      budget book (Grand River Transit Bus Services, Ten Year Capital Budget and Forecast).
  - institution: grand-river-transit
    source_type: strategic_plan
    url: https://www.grt.ca/about-grt/plans-and-projects/grt-business-plan/
    alternates:
      - https://www.grt.ca/about-grt/plans-and-projects/
    evidence:
      url: https://www.grt.ca/about-grt/plans-and-projects/grt-business-plan/
      quote: "Grand River Transit's business plan will provide a roadmap to guide future transit service expansion and investments over the next 10 years and beyond."
    notes: The ten-year business plan is GRT's strategic plan; see the capital_plan entry.

  # --- Waterloo Regional Police Service ---
  - institution: waterloo-regional-police-service
    source_type: procurement
    url: https://wrps.bidsandtenders.ca/Module/Tenders/en
    platform: bidsandtenders.ca
    evidence:
      url: https://wrps.bidsandtenders.ca/Module/Tenders/en
      quote: "The Waterloo Regional Police Service intends to participate in one or more procurements conducted by the following cooperative buying groups."
    notes: >-
      Judgement call: WRPS has no purchasing page on wrps.ca (tried /purchasing, /procurement,
      /bids-and-tenders: 404). The site nav's "Bid and Tenders" link and the legacy page
      https://www.wrps.on.ca/en/about-us/bids-and-tenders.aspx both go straight to this portal,
      which carries WRPS's purchasing notices (cooperative buying groups, contacts). The Board's
      purchasing by-law is a document (https://wrps.ca/resource/bylaw-24-02-purchasing), not a
      landing page. Same URL as the tender source. A real WRPS source, not covered_by the Region:
      wrps.bidsandtenders.ca is the Police Service's own portal (its own logo, "Waterloo Regional
      Police Service Bid Opportunities Website", WRPS bids only), separate from the Region's
      regionofwaterloo.bidsandtenders.ca; checked 2026-09-29.

