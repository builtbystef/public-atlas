    notes: >-
      The Council Calendar page embeds the eSCRIBE portal in an iframe (recorded separately
      below). An older calendar for 2017 to May 2022 is at https://calendar.regionofwaterloo.ca/council
      (archive only, not a separate dataset entry).

  - institution: regional-municipality-of-waterloo
