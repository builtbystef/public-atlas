      Linked from the trusted procurement page ("View Current Bid Opportunities"). Covers every
      Region division, including Grand River Transit. Vendor registration (Create Account) is on
      the same portal.

  - institution: regional-municipality-of-waterloo
    source_type: budget
    url: https://www.regionofwaterloo.ca/government-and-council/plans-budget-and-performance/our-plan-and-budget/
    alternates:
      - https://www.regionofwaterloo.ca/government-and-council/plans-budget-and-performance/
    evidence:
      url: https://www.regionofwaterloo.ca/government-and-council/plans-budget-and-performance/our-plan-and-budget/
      quote: "Our Plan and Budget is how we make investments in things that matter guided by our Growing with Care"
    notes: >-
      Lists the 2027 budget meeting schedule, the current (2026) Final Budget Book and past budget
      books. The 2026 book includes the Waterloo Regional Police Service and Transit Services
      budgets.

  - institution: regional-municipality-of-waterloo
    source_type: capital_plan
    url: https://www.regionofwaterloo.ca/government-and-council/plans-budget-and-performance/our-plan-and-budget/
    alternates:
      - https://www.regionofwaterloo.ca/government-and-council/plans-budget-and-performance/2026-annual-review-of-asset-management-planning-progress/
    evidence:
      url: https://www.regionofwaterloo.ca/media/ynro4cd2/2026_final_budget_book.pdf
      quote: "2026 Operating Budget & 2026-2035 Capital Budget Summaries"
      locator: "pdf page 2 (table of contents)"
      manual_check: "pdftotext 2026-09-29"
    notes: >-
      Judgement call. The Region has no separate capital plan page: the ten-year capital program
      (2026-2035 Capital Budget and Forecast) is published only inside the Final Budget Book
      linked from Our Plan and Budget (served on media-003-ca.cdn.govstack.com; the same file is
      at the regionofwaterloo.ca/media path used for evidence). The asset management planning
      page, which reports on "the ten-year capital program", is accepted as an alternate.
      Evidence is a PDF, so the evidence check reports it as unchecked.

  - institution: regional-municipality-of-waterloo
    source_type: council_meeting
    url: https://www.regionofwaterloo.ca/government-and-council/council/council-calendar/
    alternates:
