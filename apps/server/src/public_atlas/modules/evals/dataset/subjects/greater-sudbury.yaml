out_of_scope:
  - name: Greater Sudbury Paramedic Services
    url: https://www.greatersudbury.ca/live/emergency-services/paramedic-services/
    reason: >-
      A department of the City of Greater Sudbury (Community Development Department), which buys and budgets for it;
      the country file has no paramedic type (dropped 2026-10-01, README rule 2).
  - name: Pioneer Manor
    url: https://www.greatersudbury.ca/live/long-term-care-pioneer-manor/
    reason: Long-term care home run as a City department (Long-term Care Services); out of scope under README rule 2.
  - name: Greater Sudbury Development Corporation (City of Greater Sudbury Community Development Corporation)
    url: https://investsudbury.ca/
    reason: >-
      Not-for-profit economic development corporation (GSDC) that the City funds but does not control: the City's 2025
      consolidated financial statements list "The City of Greater Sudbury Community Development Corporation" among the
      entities "not under the control of Council" (with the conservation authority and the board of health), and the
      City appoints only the Mayor and three councillors of its 18 directors (city's GSDC board page). So not a
      municipal_corporation (README rule 3(a)); a not-for-profit the municipality only funds (rule 2). Its legal name,
      used in the City's procurement notice and its audited statements, is The City of Greater Sudbury Community
      Development Corporation (same mandate wording as the city's GSDC board page; checked 2026-10-01), so one entry,
      not two.
  - name: Water and Wastewater Services Division
    url: https://www.greatersudbury.ca/live/water-wastewater-treatment-compliance/
    reason: >-
      City division ("The City of Greater Sudbury’s Water and Wastewater Services Division") under a generic service
      name on the City site, with no brand, site or procurement of its own: README scope rule 8, as for Region of
      Waterloo Water and Wastewater Services. Saving it as a public_utility is a false positive.
  - name: Downtown Sudbury Business Improvement Area
    url: https://downtownsudbury.com/
    reason: BIA board of management; BIAs are out of scope.
  - name: Flour Mill Business Improvement Area
    reason: BIA board of management; BIAs are out of scope.
  - name: Agilis Networks (Greater Sudbury Telecommunications Inc.)
    url: https://agilisnet.com/
    reason: >-
      Competitive broadband subsidiary of GSU (sister of Greater Sudbury Hydro); not a public utility, and as a GSU
      subsidiary with no public procurement of its own it gets no row (README rules 3 and 6), not even as a
      municipal_corporation.
  - name: "@home Energy (1627596 Ontario Inc.)"
    url: https://athomeenergy.ca/
    reason: >-
      Competitive water-heater rental subsidiary of GSU (sister of Greater Sudbury Hydro); not a public utility, and a
      GSU subsidiary with no procurement of its own gets no row (README rules 3 and 6).
  - name: Greater Sudbury Hydro Plus Inc.
    reason: GSU subsidiary named on the city's local boards page; not the operating utility (Greater Sudbury Hydro Inc. is).
  - name: ConverGen Inc.
