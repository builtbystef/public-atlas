    notes: >-
      Internal division (Transit Services, Planning and Growth Department) that presents itself under its own brand, so it
      gets a row under README rule 3(b). No board of its own; Council has a Transit Committee (on eSCRIBE).
      "Greater Sudbury Transit" is the main-office name on /live/transit/contact-transit/.
      French twin of the home page: https://www.grandsudbury.ca/vivre/transit/
