  - key: greater-sudbury-police-service
    type: police_service
    names:
      - { text: Greater Sudbury Police Service, lang: en }
      - { text: GSPS, lang: en, is_acronym: true }
      - { text: Service de police du Grand Sudbury, lang: fr }
