      quote: "The Greater Sudbury Public Library strives to enrich the lives of individuals and the spirit of the community"
      kind: links_to
      link_target: http://www.sudburylibraries.ca
    notes: >-
      Public Libraries Act board ("constituted as a corporation"), members appointed by Council. The city links to
      http://www.sudburylibraries.ca, which redirects to https://www.sudburylibraries.ca/. French home:
      https://www.sudburylibraries.ca/fr/ (uses "Bibliothèque publique du Grand Sudbury" and "L’application de la BPGS").
    parent:
      institution: city-of-greater-sudbury
      label: duly appointed by the Council of the City of Greater Sudbury
      evidence:
        url: https://www.greatersudbury.ca/city-hall/get-involved/volunteerism/join-a-local-board-committee-or-advisory-panel/local-boards-and-corporations/greater-sudbury-public-library-board/
        quote: The Board consists of nine members, duly appointed by the Council of the City of Greater Sudbury

  - key: greater-sudbury-hydro-inc
    type: public_utility
    names:
      - { text: Greater Sudbury Hydro Inc., lang: en }
      - { text: Greater Sudbury Hydro, lang: en }
      - { text: GSH, lang: en, is_acronym: true }
      - { text: Hydro du Grand Sudbury Inc., lang: fr }
      - { text: Greater Sudbury Utilities Inc., lang: en }
      - { text: Greater Sudbury Utilities, lang: en }
      - { text: GSU, lang: en, is_acronym: true }
      - { text: Services Publics du Grand Sudbury Inc., lang: fr }
    homepage: https://sudburyhydro.com/
    homepage_alternates:
      - https://gsuinc.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.greatersudbury.ca/live/environment-and-sustainability1/earthcare-sudbury/earthcare-sudbury/community-partners/
      quote: "Greater Sudbury Housing Corporation Greater Sudbury Hydro Inc."
      kind: links_to
      link_target: http://www.sudburyhydro.com/
    notes: >-
      Operating utility (README scope rule 6): Greater Sudbury Hydro Inc. (GSH), the OEB-licensed electricity
      distributor, a subsidiary of the holding company Greater Sudbury Utilities Inc. (GSU, wholly owned by the City).
      The city's EarthCare partners page links "Greater Sudbury Hydro Inc." to http://www.sudburyhydro.com/ (redirects to
      https://sudburyhydro.com/); the city's local boards page says "Greater Sudbury Hydro Inc. (GSH) is a subsidiary of
      Greater Sudbury Utilities Inc.". GSU is folded into this row's names, not given its own row or out_of_scope: the
      hydro's own pages present themselves under GSU (sudburyhydro.com: menu "About > Greater Sudbury Utilities", "Login
      to GSU MyAccount", customerservice@gsuinc.ca, "Greater Sudbury Utilities' core capabilities"), and gsuinc.ca serves
      the same customer pages (billing, outages, projects, regulatory affairs) from the same WordPress install, so
      https://gsuinc.ca/ is a webpage alternate. GSU keeps no row of its own: neither company publishes procurement (no
      procurement/tender/supplier page in either site's page-sitemap.xml; WordPress search for tender/procurement/rfp
      "Nothing Found" on both). The city names "Greater Sudbury Utilities" as a member of the Sudbury Regional Buying
      Group, but that is the group's shared membership, not a separate published procurement function. Other GSU
      subsidiaries (Hydro Plus, Agilis Networks, @home Energy, ConverGen) are not the operating utility: out_of_scope.
      French names from the GSU consolidated statements ("Greater Sudbury Hydro lnc./Hydro du Grand Sudbury Inc.", sic;
      "Greater Sudbury Utilities Inc. / Services Publics du Grand Sudbury Inc."); sudburyhydro.com has no French pages
      (only a Translate widget).
    parent:
      institution: city-of-greater-sudbury
      label: appointed by Council
      evidence:
        url: https://www.greatersudbury.ca/city-hall/get-involved/volunteerism/join-a-local-board-committee-or-advisory-panel/local-boards-and-corporations/greater-sudbury-utilities-inc-and-subsidiary-boards/
        quote: "Greater Sudbury Hydro Inc. Board: Membership includes the three Council Members who sit on the GSU Board of Directors and four independent directors appointed by Council."

  - key: greater-sudbury-housing-corporation
    type: municipal_corporation
    names:
      - { text: Greater Sudbury Housing Corporation, lang: en }
      - { text: GSHC, lang: en, is_acronym: true }
      - { text: Société de logement du Grand Sudbury, lang: fr }
      - { text: SLGS, lang: fr, is_acronym: true }
    homepage: https://www.greatersudbury.ca/live/community-housing/housing-operations/
    homepage_alternates:
      - https://www.grandsudbury.ca/vivre/logement-communautaire/societe-de-logement-du-grand-sudbury-slgs/
    homepage_host: trusted_domain
    evidence:
      url: https://www.greatersudbury.ca/live/community-housing/housing-operations/
      quote: "Housing Operations acts as the landlord for Greater Sudbury Housing Corporation (GSHC) properties."
    notes: >-
      City-owned corporation (README rule 3(a)): "The City of Greater Sudbury is the sole shareholder for the
      corporation with the Board of Directors being comprised of the entirety of City Council" (local boards page), and
      it is consolidated in the City's 2025 financial statements. 1,848 rent-geared-to-income units. It has no site of
      its own: the City's Housing Operations section is its webpage (the French twin is titled "Société de logement du
      Grand Sudbury (SLGS)"). The old sudburyhousing.org (contact email domain) is now a one-page stub that says GSHC
      information "can now be found on the city's website" and links there; the City pages do not link it, so it is
      not a candidate domain. Was out_of_scope before housing_corporation was added to the country file; that type
      was folded into municipal_corporation (community housing) on 2026-10-01.
    parent:
      institution: city-of-greater-sudbury
      label: sole shareholder
      evidence:
        url: https://www.greatersudbury.ca/city-hall/get-involved/volunteerism/join-a-local-board-committee-or-advisory-panel/local-boards-and-corporations/greater-sudbury-housing-corporation-board-of-directors/
        quote: The City of Greater Sudbury is the sole shareholder for the corporation with the Board of Directors being comprised of the entirety of City Council.

  - key: conservation-sudbury
    type: conservation_authority
    names:
      - { text: Conservation Sudbury, lang: en }
      - { text: Nickel District Conservation Authority, lang: en }
      - { text: NDCA, lang: en, is_acronym: true }
      - { text: Conservation Sudbury, lang: fr }
    homepage: https://www.conservationsudbury.ca/
    homepage_alternates:
      - https://www.conservationsudbury.ca/fr/
    homepage_host: own_domain
    evidence:
      url: https://www.greatersudbury.ca/live/environment-and-sustainability1/lake-health/shoreline-development/
      quote: "The Nickel District Conservation Authority (NDCA) also known as Conservation Sudbury, regulates development"
      kind: links_to
      link_target: https://conservationsudbury.ca/en/permits-planning.html
    notes: >-
      Conservation authority under the Conservation Authorities Act; its only member municipality is the City
      ("its sole municipal partner, the City of Greater Sudbury", conservationsudbury.ca Municipal Agreements), which
      appoints all seven General Board members (city's Conservation Sudbury General Board page). Not consolidated by
      the City (its statements list it among entities "not under the control of Council"), but conservation_authority
      is a type of its own. The member_of relationship follows the authority's own words ("its member municipality,
      the City of Greater Sudbury"), though the City is its only member. One row in the eval dataset, here. The city's pages link old URLs (nickeldistrict.ca,
      conservationsudbury.ca/en/...) that redirect to https://www.conservationsudbury.ca/. The French site
      (/fr/) also uses "Conservation Sudbury". Was out_of_scope before conservation_authority was added.

  - key: public-health-sudbury-and-districts
    type: public_health_unit
    names:
      - { text: Public Health Sudbury & Districts, lang: en }
      - { text: Board of Health for Public Health Sudbury & Districts, lang: en }
      - { text: Sudbury & District Health Unit, lang: en }
      - { text: Santé publique Sudbury et districts, lang: fr }
    homepage: https://www.phsd.ca/
    homepage_alternates:
      - https://www.phsd.ca/fr/
    homepage_host: own_domain
    evidence:
      url: https://www.greatersudbury.ca/live/environment-and-sustainability1/lake-health/shoreline-development/
      quote: "Public Health Sudbury and District (PHSD) is responsible for administering Section 8 of the Ontario Building Code"
      kind: links_to
      link_target: https://www.phsd.ca/health-topics-programs/sewage-systems/
    notes: >-
      Shared body (README rule 4): the Board of Health "is comprised of 11 municipal members and up to 10 members
      appointed by the Lieutenant Governor in Council"; seven of the municipal members are "Appointed by: City of
      Greater Sudbury", the rest by the district municipalities (phsd.ca Board members page, browser 2026-10-01). Head
      office 1300 Paris Street, Sudbury, so its one row is here. Not consolidated by the City (statements: "Board of
      Health for the Sudbury & District Health Unit" is "not under the control of Council"). "Sudbury & District Health
      Unit" is the legal/former name, still used in older motions on phsd.ca. phsd.ca sits behind a Cloudflare
      challenge (curl gets 403), so its pages were read in a browser. Was out_of_scope before public_health_unit was
      added.

  - key: sudbury-airport-community-development-corporation
    type: municipal_corporation
    names:
      - { text: Sudbury Airport Community Development Corporation, lang: en }
      - { text: SACDC, lang: en, is_acronym: true }
      - { text: Greater Sudbury Airport, lang: en }
    homepage: https://flysudbury.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.greatersudbury.ca/play/getting-around/airport/
      quote: "The Greater Sudbury Airport is managed by the Sudbury Airport Community Development Corporation (SACDC)."
      kind: links_to
      link_target: http://www.flysudbury.ca/
    notes: >-
      Airport corporation (municipal_corporation: an airport). Controlled by the City (README rule 3(a)): the City's
      2025 consolidated financial statements (note 1(a)(iii)) account for it as one of the City's two Government
      Business Enterprises with GSU ("Government Business Enterprises (GBE) include the Greater Sudbury Utilities
      Inc./Services Publics du Grand Sudbury Inc. (GSU), and the Sudbury Airport Community Development Corporation
      (SACDC)"), the City budget lists it as a service partner, and airport jobs are posted by the City
      (flysudbury.ca Working at YSB). Judgment: the City appoints only two of eleven directors, but GBE status means
      control under PSAS, so it is promoted, not left as a funded not-for-profit. The city links http://www.flysudbury.ca/
      (redirects to https://flysudbury.ca/). No relationship row: no page states the City's control in words an
      agent would quote (the GBE note is in a PDF). greatersudburyairport.com is the airport's employee permit portal.

