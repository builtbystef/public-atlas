      greatersudbury.ca says "Police Services Board (GSPSB)") are one row: the board is the service's governing body and
      has no separate site. The board's names are listed here so a saved board matches this row. gsps.ca has no French
      pages; the French names come from https://www.grandsudbury.ca/vivre/services-durgence/services-policiers/.
    parent:
      institution: city-of-greater-sudbury
      label: including
      evidence:
        url: https://www.greatersudbury.ca/do-business/purchasing-section-and-procurement-opportunities/procurement-opportunities-and-contract-awards/
