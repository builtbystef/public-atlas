notes: >-
  Structure: single-tier city (CSD 3553005). In scope: the city, two internal divisions with their own names (GOVA
  Transit, Greater Sudbury Fire Services), two local boards on their own domains (Police Service and its board as one
  row; Public Library) and the operating utility Greater Sudbury Hydro Inc. (holding company GSU folded into its names,
  README scope rule 6). The city's procurement
  notice says City procurement covers Fire, Paramedics, the Police Services Board, the Library Board, the Community
  Development Corporation, the Housing Corporation and the Airport CDC, which is why their procurement/tender types are
  absent (covered_by: city-of-greater-sudbury) rather than duplicated. Divisions (GOVA, Fire) have no source rows that
  repeat the City's pages; the city's pages are recorded once, under city-of-greater-sudbury.
  Moved from out_of_scope to institutions when types were added to the country file (2026-10-01): Greater Sudbury
  Housing Corporation (City sole shareholder; housing_corporation, now municipal_corporation), Conservation
  Sudbury (conservation_authority; the City is its only member municipality), Public Health Sudbury & Districts
  (public_health_unit; shared board of health headquartered in Sudbury, one row here, rule 4) and the Sudbury Airport
  Community Development Corporation (municipal_corporation; a City Government Business Enterprise). Later the same
  day the country file folded housing_corporation into municipal_corporation and dropped paramedic_service, so
  Greater Sudbury Paramedic Services, a City department, went back to out_of_scope. The Greater Sudbury Development
  Corporation stays out (the City's statements say it is not under Council's control). Pioneer Manor stays out as a
  long-term care home run as a department. The city's
  local boards page lists its boards only through a script; its child pages were found by web search and read
  directly (GSDC, GSU, Housing Corporation, Library, Conservation Sudbury, Airport CDC).
