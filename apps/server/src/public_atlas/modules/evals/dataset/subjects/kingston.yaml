    url: https://www.kingstonaccessbus.net/
    reason: >-
      Specialized (paratransit) transit, but an "incorporated non-profit, registered charitable
      organization operated as an external agency to the City" with one councillor on its board; not
      owned or controlled by the city (README scope rule 3), so not a transit_agency row.
  - name: Kingston and Area Taxi Commission
    url: https://katc.ca/
    reason: >-
      Taxi licensing and regulatory commission under its own statute, a regulator rather than a body
      running a business of its own (a tribunal-like body, README scope rule 2); its licensing moved
      to the City on 2026-10-01 (katc.ca), so it is not a municipal_corporation.
  - name: Kingston Economic Development Corporation (Invest Kingston)
    url: https://www.investkingston.ca/
    reason: >-
      Separately incorporated not-for-profit (four of twelve directors are council members) that the
      city funds but does not own or control: it is not in the City's consolidated reporting entity
      (2025 audited financial statements, note 1(a)), and the city lists it among External Agencies it
      supports "primarily through direct financial funding". A not-for-profit the municipality only
      funds (README scope rule 2), so not a municipal_corporation despite economic development.
  - name: Tourism Kingston
    url: https://www.visitkingston.ca/
    reason: >-
      Tourism not-for-profit the city funds (two councillors on its board) but does not own or
      control; not in the City's consolidated reporting entity. A not-for-profit the municipality
