      quote: "eSCRIBE Published Meetings"
    notes: >-
      Same portal as the council_meeting entry. Recordings since Nov. 5, 2024 are on each meeting's agenda page here;
      City Council meetings carry HasVideo in the portal's calendar data (checked 2026-10-01). The meeting list is loaded
      by JavaScript, so the quote is the portal's static title.
      The government's page that links here only points to it, so it is an alternate.
      Each recording plays in the portal's own player, e.g.
      /Players/ISIStandAlonePlayer.aspx?ClientId=kingston&FileName=Compact%20Encoder_City%20Council%20Meeting_2026-09-01-07-00.mp4;
      the City's "Watch a live meeting" ISI webcast is live only and not a source.

