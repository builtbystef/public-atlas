institutions:
  - key: city-of-kingston
    type: municipal_government
    names:
      - { text: City of Kingston, lang: en }
      - { text: The Corporation of the City of Kingston, lang: en }
    homepage: https://www.cityofkingston.ca/
    homepage_host: trusted_domain
    evidence:
      url: https://www.cityofkingston.ca/
      quote: "© 2026 The Corporation of the City of Kingston"
    notes: >-
      Separated city: single-tier, independent of the County of Frontenac although it sits inside
      the Frontenac census division. Site runs on Govstack; many subpages under /business-in-kingston/
      are JS stubs (window.location.replace) pointing at the canonical page or at outside bodies.

  - key: kingston-transit
    type: transit_agency
    names:
      - { text: Kingston Transit, lang: en }
    homepage: https://www.kingstontransit.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.cityofkingston.ca/careers-and-volunteering/career-opportunities/bus-operator-recruitment/
      quote: "Come work with us at Kingston Transit and keep Kingston moving!"
    notes: >-
      City division (the "Transportation & Transit" department under Transportation & Infrastructure
      Services) presenting itself under its own name and domain; row under README scope rule 3(b).
      The link to kingstontransit.ca from a trusted page is the city home page's "Transit" navigation
      link (link text does not name the body, so the naming quote comes from the recruitment page).
      kingstontransit.ca is built on the same Govstack instance, footer "© 2026 Kingston Transit".
    parent:
      institution: city-of-kingston
      label: department reporting to the Commissioner of Transportation & Infrastructure Services
      evidence:
        url: https://www.cityofkingston.ca/council-and-city-administration/organizational-structure/
        quote: "The following departments report to the Commissioner of Transportation & Infrastructure Services: Engineering Services Major Projects Public Works & Solid Waste Services Transportation & Transit"

  - key: kingston-police
    type: police_service
    names:
      - { text: Kingston Police, lang: en }
      - { text: KP, lang: en, is_acronym: true }
      - { text: Kingston Police Service Board, lang: en }
      - { text: KPSB, lang: en, is_acronym: true }
      - { text: Kingston Police Services Board, lang: en }
    homepage: https://www.kingstonpolice.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.cityofkingston.ca/council-and-city-administration/committees-and-boards/other-committees-and-boards/
      quote: "The Kingston Police Service Board provides civilian oversight of the Kingston Police."
      kind: links_to
      link_target: https://www.kingstonpolice.ca/about-kp/police-service-board/
    notes: >-
      One row for the service and its board: the Kingston Police Service Board is a separately
      constituted local board, but the police_service type already carries board_meeting, so the
      board's pages are recorded as this institution's sources rather than as a second institution.
      An agent that saves "Kingston Police Service Board" as its own institution should be reviewed
      (see report). kingstonpolice.ca uses "KP" in its navigation ("About KP", "Join KP"). Board names
      added per README scope rule 5 (checked 2026-10-01): "Kingston Police Service Board" and "KPSB"
      on the board and meetings pages; "Kingston Police Services Board", the pre-CSPA name, on the
      Our History page.
    parent:
      institution: city-of-kingston
      label: police service board is a local board under the Municipal Act
      evidence:
        url: https://www.cityofkingston.ca/council-and-city-administration/committees-and-boards/other-committees-and-boards/
        quote: In Ontario, a police service board is a local board under the Municipal Act, but it derives its authority from the Community Safety and Policing Act (CSPA).

  - key: kingston-fire-rescue
    type: fire_service
    names:
      - { text: Kingston Fire & Rescue, lang: en }
      - { text: Kingston Fire and Rescue, lang: en }
      - { text: KFR, lang: en, is_acronym: true }
    homepage: https://www.cityofkingston.ca/emergency-services-and-public-health/fire-and-rescue/
    homepage_host: trusted_domain
    evidence:
      url: https://www.cityofkingston.ca/emergency-services-and-public-health/fire-and-rescue/
      quote: "The Communications Division of Kingston Fire & Rescue (KFR) provides emergency fire response services for nine departments"
    notes: City department ("Fire & Emergency Services" in the org chart) presenting itself under its own name; README scope rule 3(b).
    parent:
      institution: city-of-kingston
      label: department reporting to the Commissioner of Corporate & Emergency Services
      evidence:
        url: https://www.cityofkingston.ca/council-and-city-administration/organizational-structure/
        quote: "The following departments report to the Commissioner of Corporate & Emergency Services: Communications & Customer Experience Corporate Asset Management & Fleet Facilities Management & Construction Services Fire & Emergency Services"

  - key: utilities-kingston
    type: public_utility
    names:
      - { text: Utilities Kingston, lang: en }
      - { text: 1425445 Ontario Limited, lang: en }
    homepage: https://utilitieskingston.com/
    homepage_host: own_domain
    evidence:
      url: https://www.cityofkingston.ca/
      quote: Utilities Kingston
      kind: links_to
      link_target: https://utilitieskingston.com/
    notes: >-
      City-owned multi-utility corporation (water, wastewater, natural gas, fibre, street lights) that
      also operates Kingston Hydro's electricity system. Legal name 1425445 Ontario Limited, owned by
      holding company 1425447 Ontario Limited, which is owned by the City. Runs its own procurement on
      bids&tenders. utilitieskingston.com answers plain curl with HTTP 403 (bot protection) but 200 to
      httpx with a Chrome UA, so the evidence checker can fetch it.
    parent:
      institution: city-of-kingston
      label: a separate corporation that is owned by the city
      evidence:
        url: https://www.cityofkingston.ca/council-and-city-administration/budgets-and-finances/
        quote: Utilities Kingston, a separate corporation that is owned by the city, prepares budgets for municipal utilities

  - key: kingston-hydro
    type: public_utility
    names:
      - { text: Kingston Hydro, lang: en }
      - { text: Kingston Hydro Corporation, lang: en }
    homepage: https://www.kingstonhydro.com/
    homepage_host: own_domain
    evidence:
      url: https://www.cityofkingston.ca/news/posts/city-explores-establishment-of-municipal-service-corporation-for-water-and-wastewater-services/
      quote: "Kingston Hydro, owned 100 per cent by the City of Kingston, is an Ontario Business Corporation"
    notes: >-
      OEB-licensed electricity distributor, separately constituted and owned directly by the City,
      with its own board (chaired by the Mayor); row under README scope rule 3(a). It owns the assets
      but its system is operated by Utilities Kingston staff and it has no procurement of its own
      (see absent_sources). No trusted page links to kingstonhydro.com; utilitieskingston.com links to
      it ("Electricity Rates"). Same 403-to-curl behaviour as utilitieskingston.com.
    parent:
      institution: city-of-kingston
      label: owned 100 per cent by the City of Kingston
      evidence:
        url: https://www.cityofkingston.ca/news/posts/city-explores-establishment-of-municipal-service-corporation-for-water-and-wastewater-services/
        quote: Kingston Hydro, owned 100 per cent by the City of Kingston, is an Ontario Business Corporation

  - key: kingston-frontenac-public-library
    type: library
    names:
      - { text: Kingston Frontenac Public Library, lang: en }
      - { text: KFPL, lang: en, is_acronym: true }
      - { text: Kingston Frontenac Public Library Board, lang: en }
      - { text: Kingston-Frontenac Public Library Board, lang: en }
      - { text: Kingston & Frontenac Public Library, lang: en }
    homepage: https://www.kfpl.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.cityofkingston.ca/council-and-city-administration/committees-and-boards/other-committees-and-boards/
      quote: "The Kingston Frontenac Public Library Board is the legal authority of the Library"
      kind: links_to
      link_target: https://www.kfpl.ca/about-the-library/library-board-and-management
    notes: >-
      Shared body (README scope rule 4): governed jointly with the County of Frontenac (board seats
      appointed by "Kingston City Council" and "Frontenac County Council" per kfpl.ca), headquartered
      at the Central Branch in Kingston, so the row lives here with member_of from the city. The
      County of Frontenac is not a dataset subject, so no member_of from it is recorded. The city's own
      /arts-culture-and-events/kingston-frontenac-public-library/ page is a JS redirect to kfpl.ca.
      "Kingston-Frontenac Public Library Board" is the name on the audited financial statements;
      "Kingston & Frontenac Public Library" is the city budget page's wording.

  - key: kingston-frontenac-housing-corporation
    type: municipal_corporation
    names:
      - { text: Kingston & Frontenac Housing Corporation, lang: en }
      - { text: KFHC, lang: en, is_acronym: true }
    homepage: https://kfhc.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.cityofkingston.ca/council-and-city-administration/committees-and-boards/other-committees-and-boards/
      quote: "The Kingston & Frontenac Housing Corporation (KFHC) Board oversees the governance of Kingston & Frontenac Housing Corporation"
      kind: links_to
      link_target: http://www.kfhc.ca
    notes: >-
      Added 2026-10-01 (was out_of_scope); housing_corporation folded into municipal_corporation
      the same day, so it is a municipal_corporation (community housing). Local housing
      corporation under the Social Housing Reform Act, 2000; "The City of Kingston is the sole
      shareholder of KFHC" (kfhc.ca/about-kfhc), so README scope rule 3(a), and it is in the City's
      consolidated reporting entity (2025 audited financial statements, note 1(a)). Serves Kingston
      and the County of Frontenac, but owned by the City alone, so parent_of rather than member_of.
      The city links http://www.kfhc.ca, which redirects to https://kfhc.ca/ (GoDaddy site builder).
    parent:
      institution: city-of-kingston
      label: sole shareholder
      evidence:
        url: https://kfhc.ca/about-kfhc
        quote: The City of Kingston is the sole shareholder of KFHC.

  - key: southeast-public-health
    type: public_health_unit
    names:
      - { text: Southeast Public Health, lang: en }
      - { text: SEPH, lang: en, is_acronym: true }
      - { text: Southeast Board of Health, lang: en }
      - { text: South East Health Unit, lang: en }
    homepage: https://southeastph.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.cityofkingston.ca/council-and-city-administration/committees-and-boards/other-committees-and-boards/
      quote: "is responsible for ensuring Southeast Public Health meets the mandatory Health Programs and Services Guidelines"
      kind: links_to
      link_target: https://southeastph.ca/about-us/board-of-health/
    notes: >-
      Added 2026-10-01 with the public_health_unit type (was out_of_scope). Board of health formed
      on 2025-01-01 by merging KFL&A Public Health, Hastings Prince Edward Public Health and Leeds,
      Grenville and Lanark District Health Unit. Shared body (README scope rule 4): governed by the
      City "together with twelve other participating municipalities"; its "Kingston Main office" is
      at 221 Portsmouth Avenue and the board meets in Kingston, so the row lives here with member_of
      from the city. None of the other member municipalities is a dataset subject. "South East Health
      Unit" is its legal name (Our story page); "Southeast Board of Health" is the city's wording
      for its board. The former KFL&A Public Health is a predecessor, not a name of this body.

  - key: cataraqui-region-conservation-authority
    type: conservation_authority
    names:
      - { text: Cataraqui Region Conservation Authority, lang: en }
      - { text: Cataraqui Conservation, lang: en }
      - { text: CRCA, lang: en, is_acronym: true }
    homepage: https://cataraquiconservation.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.cityofkingston.ca/council-and-city-administration/committees-and-boards/other-committees-and-boards/
      quote: Cataraqui Region Conservation Authority (CRCA)
    notes: >-
      Added 2026-10-01 with the conservation_authority type (was out_of_scope). Shared body (README
      scope rule 4): 17 board members appointed by the 11 watershed municipalities, four of them
      Kingston councillors; headquartered in Kingston (Administration Building, 2069 Battersea
      Road, Glenburnie, a community within the city), so its one row
      in the eval dataset is here, with member_of from the city. No trusted page links to its site (the
      city's committees page and budget page name it without a link). Brands itself "Cataraqui
      Conservation" on a Shopify site; crca.ca, its email domain and PDF host, redirects there.
      cataraquiconservation.ca rate-limits repeated fetches (HTTP 429 on /blogs/ pages).

  - key: kingston-airport
    type: municipal_corporation
    names:
      - { text: Kingston Airport, lang: en }
      - { text: YGK Airport, lang: en }
      - { text: Norman Rogers Airport, lang: en }
    homepage: https://www.ygkairport.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.cityofkingston.ca/
      quote: "Learn more about Kingston Airport services."
      kind: links_to
      link_target: https://www.ygkairport.ca/
    notes: >-
      Added 2026-10-01 with the municipal_corporation type (was out_of_scope, "an airport matches no
      institution type"). The City's Airport Division (reports to the CAO), presenting itself under
      its own name and domain, so README scope rule 3(b): "The YGK Airport is owned and operated by
      the City of Kingston" (ygkairport.ca). ygkairport.ca runs on the city's Govstack instance,
      footer "© 2026 The Corporation of the City of Kingston". The home page card reads "Kingston
      Airport - YGK".
    parent:
      institution: city-of-kingston
      label: department reporting to the CAO
      evidence:
        url: https://www.cityofkingston.ca/council-and-city-administration/organizational-structure/
        quote: "The following departments report to the CAO: Strategy, Innovation & Partnerships Airport Division"

  - key: kingston-grand-theatre
    type: municipal_corporation
    names:
      - { text: Kingston Grand Theatre, lang: en }
      - { text: Grand Theatre Kingston, lang: en }
    homepage: https://www.kingstongrand.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.cityofkingston.ca/news/posts/local-arts-residency-returns-for-a-fourth-year-to-kingston-grand-theatre/
      quote: "We are thrilled to welcome the 2024 artists-in-residence to Kingston Grand Theatre"
    notes: >-
      Added 2026-10-01 with the municipal_corporation type. Judgment call: a City-run performing
      arts venue (box office, rentals, resident companies) under Arts & Culture Services, presenting
      under its own name and domain (footer "© 2026 The Corporation of the City of Kingston"), so
      README scope rule 3(b) with "a venue" from the type's description. It is not a board or
      corporation, and not in the org chart by name; a reviewer may prefer out_of_scope. The city's
      /arts-culture-and-events/kingston-grand-theatre/ page is a JS redirect to kingstongrand.ca, so
      no trusted page links to it by href. No parent_of: no page found that states the
      relationship in words.

