notes: >-
  Researched 2026-09-29 from cityofkingston.ca (sitemap, Council and City Administration section,
  Committees and Boards, Budgets and Finances, Organizational Structure) and each body's own site.
  City procurement is centralised: the city page points to Biddingo for all bids and supplier
  registration, and transit and fire buy through it (recorded as absent for those divisions rather
  than duplicating the city's pages, with covered_by: city-of-kingston). Utilities Kingston runs its own procurement on
  bids&tenders. Council agendas and minutes live on eSCRIBE (pub-cityofkingston.escribemeetings.com)
  and in the events.cityofkingston.ca meeting calendar.
  Updated 2026-10-01 for the five new institution types: KFHC (housing_corporation, folded into
  municipal_corporation later that day), Southeast
  Public Health (public_health_unit, shared, headquartered here) and Cataraqui Conservation
  (conservation_authority, shared, headquartered here) moved from out_of_scope; the Airport Division
  (YGK) and the Kingston Grand Theatre added as municipal_corporation divisions under rule 3(b),
  and ygkairport.ca flipped from reject to confirm. Paramedics are the County of Frontenac's, and
  the economic development and tourism corporations are funded, not controlled, so they stay out.
