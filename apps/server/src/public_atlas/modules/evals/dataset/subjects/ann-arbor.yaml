subject:
  kind: place
  country_code: US
  name: City of Ann Arbor
  level: municipality
  place: City of Ann Arbor
  parent: Washtenaw County
  official_code: "2603000" # FIPS state + place code (26 + 03000), SUB-EST2025 "Ann Arbor city"
  institution: city-of-ann-arbor

status: reviewed
reviewed_at: 2026-10-09
labelled_at: 2026-10-09

trusted_at_start: [michigan.gov, a2gov.org, washtenaw.org]

institutions:
  - key: city-of-ann-arbor
    type: municipal_government
    names:
      - { text: City of Ann Arbor, lang: en }
    homepage: https://www.a2gov.org/
    homepage_host: trusted_domain
    evidence:
      url: https://www.a2gov.org/
      quote: "© 2026 City of Ann Arbor"
    notes: >-
      Home-rule city in Washtenaw County, council-manager form (mayor, ten council members, a city
      administrator). Site runs on Govstack like Kingston's; pages are server-rendered. Agendas and
      minutes of council and of every board live on Legistar (a2gov.legistar.com); the boards and
      commissions roster is on Granicus (a2gov.granicus.com); formal bids are on BidNet's MITN group.
      The city's own text uses many zero-width spaces, so quotes avoid the words they sit in.

  - key: ann-arbor-fire-department
    type: fire_service
    names:
      - { text: Ann Arbor Fire Department, lang: en }
      - { text: AAFD, lang: en, is_acronym: true }
    homepage: https://www.a2gov.org/fire-department/
    homepage_host: trusted_domain
    evidence:
      url: https://www.a2gov.org/fire-department/
      quote: "Ann Arbor Fire Department delivers exceptional life and property protection services to the entire community"
    notes: >-
      City department ("Fire" in the Departments list) presenting under its own name; README scope
      rule 3(b). Buys and budgets through the city (ITBs on the city's purchasing pages, a section of
      the city budget book), so its procurement and budget are absent with covered_by.
    parent:
      institution: city-of-ann-arbor
      label: city department (Departments list)
      evidence:
        url: https://www.a2gov.org/departments/
        quote: "This is an alphabetical list of all city departments."

  - key: ann-arbor-police-department
    type: police_service
    names:
      - { text: Ann Arbor Police Department, lang: en }
      - { text: AAPD, lang: en, is_acronym: true }
    homepage: https://www.a2gov.org/police-department/
    homepage_host: trusted_domain
    evidence:
      url: https://www.a2gov.org/police-department/
      quote: "About the Ann Arbor Police Department"
    expected: review
    notes: >-
      City police department presenting under its own name (README scope rule 3(b)). police_service
      is a type the United States uses but lists at no level, so the row is expected: review (README
      scope rule 1). No governing board: the Independent Community Police Oversight Commission is a
      council commission that reviews complaints (out_of_scope), so board_meeting is absent. Its
      crime-data dashboard sits on annarborpolice.org, a domain of its own, while the homepage stays
      on a2gov.org.
    parent:
      institution: city-of-ann-arbor
      label: city department (Departments list)
      evidence:
        url: https://www.a2gov.org/departments/
        quote: "This is an alphabetical list of all city departments."

  - key: ann-arbor-water
    type: public_utility
    names:
      - { text: Ann Arbor Water, lang: en }
    homepage: https://www.a2gov.org/ann-arbor-water/
    homepage_host: trusted_domain
    evidence:
      url: https://www.a2gov.org/ann-arbor-water/
      quote: "Ann Arbor Water has been named Best Tasting Water in Michigan"
    notes: >-
      The city's water, wastewater and stormwater units (Water Treatment Plant, Water Resource
      Recovery Facility, Public Works water distribution) presenting since 2022 as one unit under its
      own name, "Ann Arbor Water", with its own section of the site and a council-approved strategic
      plan (2024): README scope rule 8 / 3(b), as Toronto Water. It is not separately constituted and
      has no board; it buys through the city's Purchasing Services and its capital program is the
      Water, Sanitary Sewer and Stormwater categories of the city's Capital Improvements Plan. The
      Water Treatment Plant and Water Resource Recovery Facility pages are facilities of this unit,
      not institutions (out_of_scope).
    parent:
      institution: city-of-ann-arbor
      label: the City of Ann Arbor water team (city departments working as one unit)
      evidence:
        url: https://www.a2gov.org/ann-arbor-water/
        quote: "The City of Ann Arbor water team will now represent Michigan in the national competition"

  - key: ann-arbor-sustainable-energy-utility
    type: public_utility
    names:
      - { text: Ann Arbor Sustainable Energy Utility, lang: en }
      - { text: Sustainable Energy Utility, lang: en }
      - { text: A2SEU, lang: en, is_acronym: true }
      - { text: SEU, lang: en, is_acronym: true }
    homepage: https://www.a2gov.org/sustainable-energy-utility/
    homepage_host: trusted_domain
    evidence:
      url: https://www.a2gov.org/sustainable-energy-utility/
      quote: "The Sustainable Energy Utility (known as the A2SEU or just SEU) is an innovative new form of municipal energy utility."
    notes: >-
      Opt-in municipal electric utility (rooftop solar and batteries the city finances, owns and
      maintains) authorized by city voters in November 2024, created in 2025, piloting in the Bryant
      neighbourhood in 2026 and expanding citywide in 2027; a member of the Michigan Municipal
      Electric Association since October 2026. A city utility with an executive director, presenting
      under its own name (README scope rule 3(b)); no board of its own (council oversees it), and its
      RFPs run through the city's Purchasing Services. Judgment call: a reviewer may prefer to wait
      until it buys on its own account.
    parent:
      institution: city-of-ann-arbor
      label: the city finances, owns, installs and maintains the systems
      evidence:
        url: https://www.a2gov.org/sustainable-energy-utility/about-the-seu/
        quote: "The city finances, owns, installs and maintains the systems at customers’ own homes, businesses or other properties."

  - key: ann-arbor-housing-commission
    type: municipal_corporation
    names:
      - { text: Ann Arbor Housing Commission, lang: en }
      - { text: AAHC, lang: en, is_acronym: true }
      - { text: Housing Commission, lang: en }
    homepage: https://www.a2gov.org/housing-commission/
    homepage_host: trusted_domain
    evidence:
      url: https://www.a2gov.org/housing-commission/housing-commission-board/
      quote: "The Ann Arbor Housing Commission is governed by a board of five city residents."
    notes: >-
      Public housing authority (HUD code MI064) constituted under Michigan's Housing Facilities Act
      with a five-member board the mayor appoints and council approves: a separately constituted body
      the city controls that runs community housing and buys on its own account (its own procurement
      policy, IFBs and RFPs on the Housing Agency Marketplace), so README scope rule 3(a) and the
      municipal_corporation type's "community housing". Its site is a section of a2gov.org
      (/housing-commission/); its applicant portal is housing.a2gov.org. Board packets and minutes
      are on the city's Legistar.
    parent:
      institution: city-of-ann-arbor
      label: board appointed by the mayor and approved by City Council
      evidence:
        url: https://www.a2gov.org/housing-commission/housing-commission-board/
        quote: "Residents are appointed by the mayor and approved by City Council for a five-year term"

  - key: ann-arbor-downtown-development-authority
    type: municipal_corporation
    names:
      - { text: Ann Arbor Downtown Development Authority, lang: en }
      - { text: Downtown Development Authority, lang: en }
      - { text: Ann Arbor DDA, lang: en }
      - { text: DDA, lang: en, is_acronym: true }
    homepage: https://www.a2dda.org/
    homepage_host: own_domain
    evidence:
      url: https://www.a2gov.org/departments/
      quote: "Downtown Development"
      kind: links_to
      link_target: http://www.a2dda.org/
    notes: >-
      Authority under Michigan's DDA Act (1975), created 1982, with a twelve-member board the mayor
      and council appoint, a staff of its own, tax-increment financing, and the city's downtown
      parking system to manage: a separately constituted body the city controls that runs parking
      and downtown infrastructure and buys on its own account (its own RFPs and bids), so README
      scope rule 3(a) and the type's "parking". The Departments list links it as "Downtown
      Development" (http://www.a2dda.org/, which redirects to https://www.a2dda.org/); the Budget
      Public Process page names it in full ("Downtown Development Authority (DDA)"). Agendas,
      packets, minutes and board videos are posted on the city's Legistar.
    parent:
      institution: city-of-ann-arbor
      label: component unit of the City of Ann Arbor government
      evidence:
        url: https://www.a2dda.org/who-we-are/
        quote: "The Ann Arbor DDA is a component unit of the City of Ann Arbor government"

  - key: ann-arbor-ypsilanti-smartzone-ldfa
    type: municipal_corporation
    names:
      - { text: Ann Arbor/Ypsilanti SmartZone Local Development Finance Authority, lang: en }
      - { text: Ann Arbor/Ypsilanti SmartZone, lang: en }
      - { text: Local Development Finance Authority, lang: en }
      - { text: SmartZone, lang: en }
      - { text: LDFA, lang: en, is_acronym: true }
    homepage: https://www.a2gov.org/finance-and-administrative-services/smart-zone/
    homepage_host: trusted_domain
    evidence:
      url: https://www.a2gov.org/finance-and-administrative-services/smart-zone/
      quote: "The governing body, known as the Ann Arbor/Ypsilanti SmartZone Local Development Finance Authority (LDFA) consists of a nine-member board of directors"
    notes: >-
      Tax-increment authority for the MEDC SmartZone district, governed by a nine-member board (six
      seats appointed by Ann Arbor City Council, three by Ypsilanti's) that spends its capture on
      business-acceleration contracts, chiefly with Ann Arbor SPARK: a separately constituted body
      the city controls (README scope rule 3(a), the type's "economic development"). Shared body
      (README scope rule 4) with the City of Ypsilanti; it has no office of its own, is administered
      by Ann Arbor's CFO (ex-officio member), meets at Larcom City Hall and is a component unit of
      Ann Arbor's ACFR, so its one row lives here. The City of Ypsilanti is not a dataset subject.
      Its site is a section of a2gov.org; agendas and minutes since 2015 are on the city's Legistar.
    parent:
      institution: city-of-ann-arbor
      label: component unit of the City of Ann Arbor
      evidence:
        url: https://www.a2gov.org/finance-and-administrative-services/smart-zone/
        quote: "The SmartZone is included in the City of Ann Arbor’s Annual Comprehensive Financial Report"

  - key: ann-arbor-airport
    type: municipal_corporation
    names:
      - { text: Ann Arbor Airport, lang: en }
      - { text: Ann Arbor Municipal Airport, lang: en }
    homepage: https://www.a2gov.org/fleet-and-facilities/ann-arbor-airport/
    homepage_host: trusted_domain
    evidence:
      url: https://www.a2gov.org/fleet-and-facilities/ann-arbor-airport/
      quote: "The Ann Arbor Airport is a municipally owned airport operating 24 hours a day, seven days a week."
    notes: >-
      Judgment call, following Kingston's reviewed airport row: a municipally owned general-aviation
      airport (ARB) run by the Fleet and Facilities unit, listed as "Airport" in the Departments list
      and presenting under its own name on its own section of the site, so README scope rule 3(b)
      with "an airport" from the type's description. It is not a corporation or authority and does
      not buy on its own account (its ITBs, e.g. runway lighting ITB 4796, are on the city's
      Invitation to Bid page), and its Airport Advisory Committee only advises; a reviewer may prefer
      out_of_scope.
    parent:
      institution: city-of-ann-arbor
      label: municipally owned (Fleet and Facilities unit)
      evidence:
        url: https://www.a2gov.org/fleet-and-facilities/ann-arbor-airport/
        quote: "The Ann Arbor Airport is a municipally owned airport"

  - key: ann-arbor-area-transportation-authority
    type: transit_agency
    names:
      - { text: Ann Arbor Area Transportation Authority, lang: en }
      - { text: AAATA, lang: en, is_acronym: true }
      - { text: TheRide, lang: en }
      - { text: The Ride, lang: en }
      - { text: Ann Arbor Transportation Authority, lang: en }
    homepage: https://www.theride.org/
    homepage_host: own_domain
    evidence:
      url: https://www.a2gov.org/sustainability-innovations-home/sustainability-me/transportation/public-transit/
      quote: "Ann Arbor Area Transportation Authority, or AAATA, has a broad-reaching system that serves Ann Arbor, Ypsilanti, and beyond"
      kind: links_to
      link_target: https://www.theride.org/
    notes: >-
      Public transit authority under Michigan's Act 55 of 1963, incorporated by the City of Ann
      Arbor and joined by the City of Ypsilanti and Ypsilanti Township (2013-2014, the Articles of
      Incorporation amendments on the city's Legal Notices page). Shared body (README scope rule 4):
      a ten-member board, eight seats from the City of Ann Arbor, headquartered in Ann Arbor (Blake
      Transit Center), so the row lives here with member_of from the city; no parent recorded, since
      the city is one of three members. Ypsilanti and Ypsilanti Township are not dataset subjects.
      Its Local Advisory Council is advisory. "Ann Arbor Transportation Authority" is the pre-2013
      name, still used by BidNet's page slug and text. The city's Boards and Commissions page links
      its board meetings page but with zero-width spaces inside the name, so the naming quote comes
      from the Public Transit page.

  - key: ann-arbor-district-library
    type: library
    names:
      - { text: Ann Arbor District Library, lang: en }
      - { text: AADL, lang: en, is_acronym: true }
    homepage: https://aadl.org/
    homepage_host: own_domain
    evidence:
      url: https://www.a2gov.org/city-clerk/boards-and-commissions/
      quote: "Ann Arbor District Library Board Meetings"
      kind: links_to
      link_target: https://aadl.org/aboutus/schedule
    notes: >-
      Independent district library under Michigan's District Library Establishment Act, with its own
      millage and seven trustees elected at large; it serves the city and parts of seven townships.
      The city neither owns nor controls it, so no parent is recorded, but library is an expected
      type at the municipality level in the United States seed (the special districts of the Census
      of Governments), so it has a row here. The city's Boards and Commissions page links it under
      "Other government meetings in Ann Arbor"; the City Council Meetings page links its historical
      council minutes archive (aadl.org/councilminutes).

  - key: ann-arbor-public-schools
    type: school_board
    names:
      - { text: Ann Arbor Public Schools, lang: en }
      - { text: AAPS, lang: en, is_acronym: true }
      - { text: Ann Arbor Public Schools Board of Education, lang: en }
      - { text: Ann Arbor School District, lang: en }
    homepage: https://www.a2schools.org/
    homepage_host: own_domain
    evidence:
      url: https://www.a2gov.org/city-clerk/boards-and-commissions/
      quote: "Ann Arbor Public Schools Board of Education Meetings"
      kind: links_to
      link_target: https://www.a2schools.org/board-of-education/board-of-education/board-calendar
    notes: >-
      Independent school district headquartered in the city with an elected seven-member Board of
      Education; school_board is expected at the municipality level in the United States seed, so it
      has a row here (unlike Ontario's boards). No parent: the city does not control it. Board
      agendas and minutes are on a Diligent Community portal (a2schools.community.highbond.com),
      formal bids on BidNet's MITN group, and capital (bond and sinking fund) IFBs and RFPs on the
      district's own bond-program site a2schoolsbond.org; meeting recordings are on the city's CTN
      YouTube channel. "Ann Arbor School District" is the Bids page's wording; aaps.k12.mi.us is its
      email domain only.

sources:
  # --- City of Ann Arbor ------------------------------------------------------------
  - institution: city-of-ann-arbor
    source_type: procurement
    url: https://www.a2gov.org/finance-and-administrative-services/purchasing/
    alternates:
      - https://www.a2gov.org/finance-and-administrative-services/purchasing/bid-process/
    evidence:
      url: https://www.a2gov.org/finance-and-administrative-services/purchasing/
      quote: "Purchasing services provides procurement support for all areas of city government."
    notes: >-
      Purchasing Services page (policies, surplus auctions on GovDeals, the MITN bid notification
      system). The Bid Process page one click down (thresholds, how bids are advertised and awarded)
      is the "City Bids & Contracts" footer link and is accepted as an alternate.

  - institution: city-of-ann-arbor
    source_type: tender
    url: https://www.a2gov.org/finance-and-administrative-services/purchasing/invitation-to-bid/
    evidence:
      url: https://www.a2gov.org/finance-and-administrative-services/purchasing/invitation-to-bid/
      quote: "Bid Notification System Website (MITN.info)"
    notes: >-
      Invitation to Bid table: open and closed ITBs with documents, addenda, bid tabs and tentative
      awards. Per-year archive pages (invitation-to-bid-2013 to -2022) sit below it.

  - institution: city-of-ann-arbor
    source_type: tender
    url: https://www.a2gov.org/finance-and-administrative-services/purchasing/request-for-proposals/
    evidence:
      url: https://www.a2gov.org/finance-and-administrative-services/purchasing/request-for-proposals/
      quote: "Bid Notification System Website (MITN.info)"
    notes: >-
      Request for Proposals table, the twin of the ITB page (open and closed RFPs with documents and
      addenda); a genuinely different page, so a separate entry.

  - institution: city-of-ann-arbor
    source_type: tender
    url: https://www.bidnetdirect.com/mitn/city-of-ann-arbor
    alternates:
      - https://www.bidnetdirect.com/mitn
    platform: bidnetdirect.com
    evidence:
      url: https://www.a2gov.org/finance-and-administrative-services/purchasing/
      quote: "City Purchasing posts all formal solicitations on the MITN (Michigan Inter-governmental Trade Network) service"
      kind: links_to
      link_target: https://www.bidnetdirect.com/mitn
    notes: >-
      The city's own page on BidNet Direct's MITN purchasing group ("City of Ann Arbor Bid
      Opportunities", open and closed solicitations; details need a free login). bidnetdirect.com is
      a listed platform. The city links the group's landing page, not its own page, so the group
      page is an alternate; the Bid Process page also links MITN's old govbids.com address.

  - institution: city-of-ann-arbor
    source_type: budget
    url: https://www.a2gov.org/finance-and-administrative-services/financial-reporting/
    alternates:
      - https://www.a2gov.org/finance-and-administrative-services/guide-to-finance-and-budget/
    evidence:
      url: https://www.a2gov.org/finance-and-administrative-services/financial-reporting/
      quote: "The annual budget is the City's plan for providing services to the community during the fiscal year"
    notes: >-
      Financial Reporting page: adopted budget books FY2023-FY2027 (FY2027 on a ClearGov document
      viewer, city-ann-arbor-mi-cleardoc.cleargov.com, a JavaScript-only page; the rest are PDFs),
      ACFRs, single audits and A2OpenBook. The Guide to Finance and Budget (a citizen guide with
      budget-process, revenue and expenditure pages) is accepted as an alternate.

  - institution: city-of-ann-arbor
    source_type: budget
    url: https://www.a2gov.org/finance-and-administrative-services/guide-to-finance-and-budget/budget-public-process/
    evidence:
      url: https://www.a2gov.org/finance-and-administrative-services/guide-to-finance-and-budget/budget-public-process/
      quote: "The city's budget planning process has been finalized for fiscal year 2027."
    notes: >-
      Budget Public Process page: the yearly timeline (administrator's recommended budget in April,
      adoption in May), council work-session presentations and videos per service area (including
      the Housing Commission, the DDA and the SmartZone/LDFA) and the council's budget-response
      memos; a genuinely different page from the budget books.

  - institution: city-of-ann-arbor
    source_type: capital_plan
    url: https://www.a2gov.org/systems-planning/capital-planning/
    alternates:
      - https://www.a2gov.org/systems-planning/capital-planning/updated-fy2026-2031-capital-improvements-plan/
    evidence:
      url: https://www.a2gov.org/systems-planning/capital-planning/
      quote: "A six-year schedule of public service expenditures; updated annually"
    notes: >-
      Capital Improvement Planning page: the six-year Capital Improvements Plan the Planning
      Commission adopts each year under Michigan's Act 33 of 2008, with the current FY2026-2031 CIP
      page (461 projects, $1.17 billion, by asset group: Water, Streets and Bridges, Stormwater, City
      Owned Buildings) one click down as an alternate, plus an interactive CIP map (a2gov.org/a2cipmap).

  - institution: city-of-ann-arbor
    source_type: council_meeting
    url: https://a2gov.legistar.com/Calendar.aspx
    platform: legistar.com
    evidence:
      url: https://www.a2gov.org/city-clerk/city-council-meetings/
      quote: "agendas, packets and minutes of the City Council, City Planning Commission and other city boards and commissions"
      kind: links_to
      link_target: http://a2gov.legistar.com/Calendar.aspx
    notes: >-
      The city's Legistar calendar (434 meetings listed for 2026 on 2026-10-09): agendas, packets,
      minutes, eComment and a video link per meeting for City Council and every board and commission,
      the Housing Commission, the DDA and the LDFA among them. legistar.com is a listed platform.
      The home page's "Meeting Agendas" link and the clerk's page link it (the clerk's page by http).

  - institution: city-of-ann-arbor
    source_type: council_meeting
    url: https://www.a2gov.org/city-clerk/city-council-meetings/
    alternates:
      - https://www.a2gov.org/city-council/council-meetings-overview/
      - https://www.a2gov.org/city-council/
    evidence:
      url: https://www.a2gov.org/city-clerk/city-council-meetings/
      quote: "Agendas, Packets and Minutes (Calendars)"
    notes: >-
      The clerk's City Council Meetings page (links to Legistar's calendar and legislation search,
      eComment, remote comment, archive minutes 1891-1991 on AADL and HathiTrust, video on demand).
      The Council Meetings Overview (schedule, public commentary rules) and the City Council page
      (members, "first and third Monday") are the pages one click up and are accepted as alternates.

  - institution: city-of-ann-arbor
    source_type: strategic_plan
    url: https://www.a2gov.org/planning/comprehensive-plan/
    evidence:
      url: https://www.a2gov.org/planning/comprehensive-plan/
      quote: "The City of Ann Arbor has adopted its Comprehensive Plan - 2050"
    notes: >-
      The city's master plan under Michigan's Planning Enabling Act: the Comprehensive Plan 2050
      adopted in 2026, with its element plans (parks and recreation, transportation, Treeline trail)
      and resource documents. Recorded as the strategic_plan since the type's description includes
      "master plan" and the city publishes no organizational strategic plan document (see the next
      entry). The A2ZERO Carbon Neutrality Plan (2020, carbon neutrality by 2030) is a sector plan,
      not recorded.

  - institution: city-of-ann-arbor
    source_type: strategic_plan
    url: https://www.a2gov.org/city-administrator/
    evidence:
      url: https://www.a2gov.org/city-administrator/
      quote: "The City's goals form the basis of our Organizational Strategic Plan"
    notes: >-
      City Administrator's Office page: vision, mission, core values and the six organizational
      goals "integrated into each service area", the administrator's annual reports, the 2022 and
      2023 infrastructure agendas and the FY2025 Legislative Policy Agenda. Judgment call: the
      priorities are stated but no plan document is published; a reviewer may prefer to drop this
      entry and keep the Comprehensive Plan alone.

  - institution: city-of-ann-arbor
    source_type: meeting_video
    url: https://www.youtube.com/user/ctnannarbor
    alternates:
      - https://www.youtube.com/@CTNAnnArbor
      - https://www.a2gov.org/city-communications/ctn/watch-video-on-demand/
      - https://a2gov.legistar.com/Calendar.aspx
    platform: youtube.com
    evidence:
      url: https://www.a2gov.org/city-communications/ctn/watch-video-on-demand/
      quote: "CTN Series, Sports, City of Ann Arbor Meetings, AAPS Board of Education Meetings"
      kind: links_to
      link_target: https://www.youtube.com/user/ctnannarbor
    notes: >-
      "CTN Ann Arbor" channel of the city's Community Television Network: council, board and
      commission meeting recordings, budget work sessions and AAPS Board of Education meetings. The
      CTN Video on Demand page links the /user/ address; the handle /@CTNAnnArbor is the channel's
      canonical address (AAPS's board calendar links it). youtube.com is a listed platform. The
      CTN Video on Demand page itself (the city's page for watching meeting recordings, which
      links the channel) and the Legistar calendar, whose every meeting row carries a video link,
      are alternates (review 2026-10-09: the first run saved both); CTN's Watch Live TV page
      (ctnvideo.a2gov.org channels) is live only and not a source.

  - institution: city-of-ann-arbor
    source_type: news
    url: https://www.a2gov.org/news/
    alternates:
      - https://www.a2gov.org/news/news/
    evidence:
      url: https://www.a2gov.org/news/
      quote: "Featured News"
    notes: >-
      News feed with categories (News, Featured News, Project News, Sustainability, Parks and
