out_of_scope:
  - name: Economic Development Corporation of the City of Ann Arbor (EDC/A2)
    url: https://www.a2gov.org/finance-and-administrative-services/economic-development-corporation/
    reason: >-
      Judgment call. A corporation under Michigan's EDC Act (1978) with a council-appointed board,
      but a conduit issuer of tax-exempt revenue bonds with no staff, operations or procurement of
      its own (its counsel is an outside law firm); a board that lends the municipality's credit
      rather than a business that buys on its own account, so not a municipal_corporation despite
      "economic development". A reviewer may prefer a row.
  - name: Building Authority
    reason: >-
      A building authority incorporated to own and finance city buildings and parking structures
      (Granicus boards list); a financing vehicle with no operations or procurement of its own.
  - name: City of Ann Arbor Employees' Retirement System
    url: https://www.a2gov.org/retirement-system/
    reason: Pension board of trustees; a board that invests the municipality's money (type description), not a business.
  - name: Retiree Health Care Benefit Plan & Trust Board of Trustees (VEBA)
    reason: Trust board investing the city's retiree-health money; same as the retirement system.
  - name: 15th District Court
    url: https://www.a2gov.org/15th-judicial-district-court/
    reason: A trial court of the State of Michigan's judiciary that the city funds and hosts on its site (a "department" in the Departments list); not a city body and matches no type.
  - name: Community Television Network (CTN)
    url: https://www.a2gov.org/city-communications/ctn/
    reason: The city's public-access cable and streaming unit (a division of Communications); matches no type. Its YouTube channel is the city's meeting_video source.
  - name: Independent Community Police Oversight Commission
    url: https://www.a2gov.org/city-clerk/boards-and-commissions/independent-community-police-oversight-commission/
    reason: Council commission reviewing complaints about the police; it does not govern the department (README scope rule 2, council committees), so its meetings are not a police board_meeting source.
  - name: City Planning Commission, Park Advisory Commission, Transportation Commission, Sustainability Commission, Airport Advisory Committee, Cable Communications Commission, Housing Board of Appeals and the other council boards and commissions
    url: https://a2gov.granicus.com/boards/w/fe6c5e22e6f4a331/boards
    reason: Advisory and quasi-judicial boards and commissions of the council (README scope rule 2); they spend nothing of their own and meet on the city's Legistar.
  - name: Water Treatment Plant and Water Resource Recovery Facility
    url: https://www.a2gov.org/water-treatment-plant/
    reason: Facilities of Ann Arbor Water (its drinking-water and wastewater units), listed separately in the Departments list; folded into the ann-arbor-water row, not institutions of their own.
  - name: Office of Sustainability and Innovations (A2ZERO)
    url: https://www.a2gov.org/sustainability-innovations-home/
    reason: City office that runs the A2ZERO climate plan and administers the SEU; a division matching no type (the SEU has its own row).
  - name: Washtenaw County Office of Community & Economic Development
    url: https://www.washtenaw.org/569/Community-Economic-Development
    reason: County body met on the city's Departments list ("Community Development"); a body of the county, not the city (README scope rule 2).
  - name: Washtenaw County Health & Human Services
    url: https://www.washtenaw.org/1542/Health-Human-Services
    reason: County body met on the city's Departments list ("Human/Social Services"); the county's, not the city's.
  - name: Washtenaw County Board of Commissioners
    url: https://www.washtenaw.org/
    reason: The county government (its meetings are linked from the city's Boards and Commissions page); the subject's parent, not an institution of the city.
  - name: Washtenaw Metro Dispatch
    reason: The county sheriff's dispatch centre that answers Ann Arbor's non-emergency line; a county service.
  - name: Washtenaw Urban County
    reason: HUD entitlement consortium of county municipalities administered by the county's Office of Community & Economic Development (an "Urban County Executive Committee" on the city's Legistar list); a county body.
  - name: Washtenaw Intermediate School District
    url: https://www.washtenawisd.org/
    reason: County-level intermediate school district (school_board at the county level, not the city's); not met on the city's pages.
  - name: Washtenaw Community College
    url: https://www.wccnet.edu/
    reason: College (a state-level type); a WCC appointee sits on the LDFA board.
  - name: University of Michigan
    url: https://umich.edu/
    reason: State constitutional university (a state-level type) whose Board of Regents meetings the city's Boards and Commissions page links; not a city body.
  - name: University of Michigan Health (Michigan Medicine)
    reason: Hospital of the University of Michigan, a state-level body; not the city's.
  - name: Trinity Health Ann Arbor Hospital
    reason: Private Catholic hospital system (formerly St. Joseph Mercy); not public.
  - name: Ann Arbor SPARK
    url: https://annarborusa.org/
    reason: Regional economic development non-profit that the city's Office of Economic Development partners with and the LDFA funds by contract; a non-profit the city only funds (README scope rule 2).
  - name: Destination Ann Arbor
    url: https://www.annarbor.org/
    reason: Convention and visitors bureau (non-profit funded by the county accommodation ordinance), linked from the city's footer; not owned or controlled by the city.
  - name: getDowntown program
    url: https://www.getdowntown.org/
    reason: Commuter program the DDA funds and AAATA runs; a program, not a body.
  - name: Main Street Business Improvement Zone
    reason: BIA-like business improvement zone under Michigan's Act 120 (on the city's Legistar body list); README scope rule 2.
  - name: Avalon Housing
    reason: Non-profit supportive-housing developer that partners with the Housing Commission (Hickory Way, The Grove at Veridian, 206 N. Washington); a non-profit the city funds.
  - name: Washtenaw Housing Alliance
    url: https://www.whalliance.org/
    reason: Non-profit coalition on homelessness linked from the Housing Commission page; not a public body.
  - name: Huron River Watershed Council
    reason: Non-profit watershed group with council liaisons (Legistar body list); the United States seed has no conservation_authority type and it is not a public body.
  - name: Michigan Theater Foundation and Ann Arbor Summer Festival
    reason: Non-profits with council liaison or board seats (Legistar body list); non-profits the city at most funds.
  - name: Washtenaw Area Transportation Study (WATS) and SEMCOG
    reason: The metropolitan planning organization and the regional council of governments the city sends liaisons to; joint regional bodies matching no type.
  - name: DTE Energy
    reason: Investor-owned electric and gas utility serving the city (the grid the SEU supplements); private.
  - name: Michigan Municipal Electric Association
    url: https://mipublicpower.org/
    reason: Trade association of municipal electric utilities that the SEU joined in October 2026; not a public body.

notes: >-
  Researched 2026-10-09 from a2gov.org (sitemap of 1,527 URLs; Departments, Government, Boards and
  Commissions, Purchasing, Financial Reporting, Guide to Finance and Budget, Capital Improvement
  Planning, City Council, City Clerk, Fire, Police, Housing Commission, Smart Zone, Airport,
  Ann Arbor Water, Sustainable Energy Utility, CTN and News sections), the city's Legistar and
  Granicus pages, BidNet's MITN pages, and each body's own site (theride.org, aadl.org, a2dda.org,
  a2schools.org, a2schoolsbond.org). First United States subject: the levels are country, state,
  county and municipality, so the subject's parent is Washtenaw County and trusted_at_start holds
  the state's, the city's and the county's domains. City procurement is centralised: Purchasing
  Services posts ITBs and RFPs on its own pages and on BidNet's MITN group, and the fire, police,
  water, SEU and airport rows buy through it (absent with covered_by). The Housing Commission (its
  own policy and the Housing Agency Marketplace), the DDA (its own RFPs) and AAATA, AADL and AAPS
  (their own portals) buy on their own account. Council and every board meet on Legistar, so the
  bare calendar is an alternate under the Housing Commission, the DDA and the LDFA. Judgment calls,
  each flagged in its row: the airport as a municipal_corporation division (following Kingston),
  the SEU as a public_utility before it buys on its own account, the EDC/A2 as out_of_scope (a
  conduit bond issuer), the Comprehensive Plan as the city's strategic_plan, and the AAATA budget
  book as its capital plan. Charter schools (Central Academy, Honey Creek Community School, each a
  public school academy and a school district of its own under Michigan law) were met on none of
  the city's pages and are not labelled. Pages the fetch could not read: the Housing Agency
  Marketplace (HTTP 403 from CloudFront) and the ClearGov budget viewer (JavaScript only); both are
  recorded through the city's pages that link them. The United States seed lacks: a platform entry
  for the Housing Agency Marketplace (internationaleprocurement.com / housingagencymarketplace.com),
  for ClearGov (cleargov.com) and for Diligent Community (highbond.com; diligent.com is listed but
  the product serves from highbond.com), and a type for a court the city funds (15th District
  Court) and for a cable-access network (CTN); both stay out_of_scope.
