absent_sources:
  - institution: ministry-of-public-and-business-service-delivery-and-procurement
    source_type: tender
    covered_by: supply-ontario
    note: >-
      The ministry posts its calls on the government-wide Ontario Tenders Portal
      (ontariotenders.app.jaggaer.com), which ontario.ca calls "Supply Ontario's Ontario Tenders
      Portal" and which is recorded under supply-ontario. The ministry page and its doing-business
      page link only to that portal; no ministry-specific bid listing.

  - institution: supply-ontario
    source_type: board_meeting
    note: >-
      No board agendas or minutes published. Checked the site navigation (About us > Governance,
      Board of Directors and Committees, Corporate reporting) and the site search
      (?s=minutes, ?s=agenda, ?s=board+meeting: hits were only news items and expense
      disclosures), and the page sitemap, re-checked 2026-10-01. The board page lists members,
      terms and committees only.

candidate_domains:
  - domain: supplyontario.ca
    institution: supply-ontario
    expected: confirm
    reason: Supply Ontario's own site; linked from ontario.ca (Buy Ontario and doing-business pages) and listed as its URL by the Public Appointments Secretariat.
  - domain: infogo.gov.on.ca
    institution: ministry-of-public-and-business-service-delivery-and-procurement
    expected: confirm
    reason: >-
      INFO-GO, the Government of Ontario staff directory (leadership source), linked from the
      ministry page as "Employee directory". An Ontario government host other than ontario.ca, so a
      confirm candidate (README, Candidate domains).
  - domain: doingbusiness.mgs.gov.on.ca
    institution: ministry-of-public-and-business-service-delivery-and-procurement
    expected: confirm
    reason: >-
      Legacy "Doing Business with the Ontario Government" site of the former Ministry of Government
      Services, this ministry's predecessor. Its home page now says "We have Moved!" to
      SupplyOntario.ca, but it still serves the buyer login linked from ontario.ca and the live
      enterprise VOR CSV. An old ministry domain, so confirm (README, Candidate domains).
  - domain: ontariotenders.ca
    institution: ministry-of-public-and-business-service-delivery-and-procurement
    expected: reject
    reason: Lookalike trap. A parked domain ("Parked Domain | easyDNS", re-checked 2026-10-01), unrelated to the Ontario Tenders Portal.
  - domain: archives.gov.on.ca
    institution: ministry-of-public-and-business-service-delivery-and-procurement
    expected: confirm
    reason: >-
      Archives of Ontario, a division of this ministry (out_of_scope as an institution), linked
      from the ministry page. An Ontario government host other than ontario.ca, so a confirm
      candidate for the ministry it serves (README, Candidate domains). Behind a Radware bot wall
      for curl on 2026-10-01.
  - domain: forms.mgcs.gov.on.ca
    institution: ministry-of-public-and-business-service-delivery-and-procurement
    expected: confirm
    reason: >-
      Central Forms Repository on the ministry's old MGCS domain; the doing-business page links its
      "complaint form" (form 002-5205, "Complaint Regarding an Ontario Government Procurement",
      which names this ministry). An Ontario government host other than ontario.ca, so confirm.

