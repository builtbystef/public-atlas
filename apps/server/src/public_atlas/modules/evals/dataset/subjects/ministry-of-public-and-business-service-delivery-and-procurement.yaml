  # --- Supply Ontario ---
  - institution: supply-ontario
    source_type: procurement
    url: https://www.supplyontario.ca/become-a-vendor/
    alternates:
      - https://www.supplyontario.ca/fr/devenir-un-fournisseur/
    evidence:
      url: https://www.supplyontario.ca/become-a-vendor/
      quote: The process of becoming a Vendor of Record (VOR) for the government includes several steps, including where to find VOR arrangements and bidding requirements.
    notes: >-
      Supply Ontario runs government purchasing, so its vendor page is its purchasing page
      (competition thresholds, VOR arrangements, the Ontario Tenders Portal). Buyer-side pages
      (/buy-for-the-government/, /registered-buyers/) are for public-sector buyers, not suppliers.

  - institution: supply-ontario
    source_type: tender
    url: https://ontariotenders.app.jaggaer.com/esop/nac-host/public/web/login.html
    alternates:
      - https://ontariotenders.app.jaggaer.com/
      - https://ontariotenders.app.jaggaer.com/esop/guest/go/public/opportunity/current?locale=en_CA&customLoginPage=/esop/nac-host/public/web/login.html&customGuest=
    platform: jaggaer.com
    evidence:
      url: https://ontariotenders.app.jaggaer.com/esop/nac-host/public/web/login.html
      quote: Looking for new business with Ontario Public Sector? Register for FREE to receive email alerts and bid for opportunities tailored to your business.
    notes: >-
      Ontario Tenders Portal, the government's single portal for open competitive procurements.
      Recorded here because Supply Ontario runs it: "Vendors can find the government's open
      competitive procurements on Supply Ontario's Ontario Tenders Portal" (ontario.ca
      doing-business page, which links to the login.html URL), and Supply Ontario's
      become-a-vendor page links to it ("VOR arrangements are established through requests for
      bids posted on the Ontario Tenders Portal"). Hosted on JAGGAER (jaggaer.com, on
      platforms). The public "Current Opportunities" list needs no sign-in (guest
      session); bidding needs supplier registration. Other ministries record it through covered_by
      (README, government-wide Ontario pages).

  - institution: supply-ontario
    source_type: contract_award
    url: https://www.supplyontario.ca/vendors-of-record-arrangements/
    alternates:
      - https://www.supplyontario.ca/fr/entente-relative-aux-fournisseurs-attitres/
      - https://www.supplyontario.ca/procurement-bulletins/
      - https://www.supplyontario.ca/fr/bulletins-portant-sur-lapprovisionnement/
    evidence:
      url: https://www.supplyontario.ca/vendors-of-record-arrangements/
      quote: delivers procurement arrangements that allow one or more vendors to provide goods or services to OPS and BPS entities for a defined period of time
    notes: >-
      List of awarded enterprise-wide VOR arrangements and VLAs (tender number, description,
      expiry), each with a details page naming the qualified vendors; no contract values. The
      procurement bulletins page ("Supply Ontario (SO) has established a new Vendor of Record (VOR)
      arrangement ...") announces each new award and is accepted as an alternate. Supply Ontario
      establishes the arrangements, so this is its source; the ministry keeps the open-data CSV
      of the same program.

