sources:
  # --- ministry ---
  - institution: ministry-of-public-and-business-service-delivery-and-procurement
    source_type: procurement
    url: https://www.ontario.ca/page/doing-business-government-ontario
    alternates:
      - https://www.ontario.ca/fr/page/faire-affaire-avec-le-gouvernement-de-lontario
    evidence:
      url: https://www.ontario.ca/page/doing-business-government-ontario
      quote: Find out how to sell your goods and services to the Ontario government as a vendor or buy products and services if you work for the Ontario Public Service or broader public sector.
    notes: >-
      "Doing business with the Government of Ontario", linked from the ministry page. Points
      vendors to Supply Ontario (vendor registration, VOR arrangements) and the Ontario Tenders
      Portal; bid disputes go to the ministry's Supply Chain Policy and Oversight Division.

  - institution: ministry-of-public-and-business-service-delivery-and-procurement
    source_type: contract_award
    url: https://data.ontario.ca/dataset/enterprise-vendor-of-record-arrangements
    evidence:
      url: https://data.ontario.ca/dataset/enterprise-vendor-of-record-arrangements
      quote: The Government of Ontario's enterprise-wide Vendor of Record (VOR) Program provides goods and services commonly acquired by government ministries.
    notes: >-
      Judgement call. Ontario has no central contract-award disclosure page: award notices sit
      inside individual opportunities on the Ontario Tenders Portal (its Past Opportunities list
      shows expired calls, not awards). This open-data record (filed under the ministry on
      data.ontario.ca) lists awarded enterprise VOR arrangements with qualified vendors and dates
      but no values; its CSV is live (served from doingbusiness.mgs.gov.on.ca, an Ontario
      government domain other than ontario.ca, regenerated daily: the 2026-10-01 copy is stamped
      202609302340). data.ontario.ca is a subdomain of ontario.ca, so trusted. Supply Ontario's own
      list of the same arrangements is recorded as Supply Ontario's contract_award source (it
      establishes the arrangements), no longer as an alternate here.

  - institution: ministry-of-public-and-business-service-delivery-and-procurement
    source_type: contract_award
    url: https://data.ontario.ca/dataset/consulting-services-contracts
    evidence:
      url: https://data.ontario.ca/dataset/consulting-services-contracts
      quote: This data represents government ministries consulting services contracts related to management, information technology, technical, research and development, policy and communication.
    notes: >-
      Supplier and ceiling price for every ministry's consulting contracts (ministry contact
      MPBSDP), but stale: latest file covers 2017-18, last validated 2022-02-03. Kept because it
      is the only award list with values; a reviewer may prefer to drop it.

