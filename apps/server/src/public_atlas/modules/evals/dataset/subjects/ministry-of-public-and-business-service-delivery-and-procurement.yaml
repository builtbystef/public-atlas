notes: >-
  Name confirmed on ontario.ca on 2026-10-01: still "Ministry of Public and Business Service
  Delivery and Procurement" (page updated 2026-09-29; the French link carries
  utm_campaign=ministry-government-services, a leftover of the old MGCS name), and the same in
  the ontario.ca ministries list, the PAS ministry filter and INFO-GO (org 1102, MPBSDP).
  Agency directory: the ontario.ca "Agencies, boards and commissions" page only links out to
  the Public Appointments Secretariat list (pas.gov.on.ca, trusted at start). That list files 14
  bodies under this ministry, but 12 are the delegated administrative authorities and 2 are
  advisory appointments; the only provincial agency is Centralized Supply Chain Ontario
  (Supply Ontario). The ministry's own 2025-26 published plan on ontario.ca confirms this: its
  "AGENCIES, BOARDS AND COMMISSIONS (ABCS)" section lists Supply Ontario alone, and the
  administrative authorities are listed in a separate section. No 2026-27 published plan was
  on ontario.ca on 2026-10-01 (the 2026-2027 URL pattern returns 404, and the "All published
  plans and annual reports" index stops at 2025-2026). Re-checked 2026-10-01: PAS still lists
  the same 14 bodies; the administrative authority PAS calls "Ontario One Call" now operates as
  Ontario Dig Authority (the ministry page links it under that name).

