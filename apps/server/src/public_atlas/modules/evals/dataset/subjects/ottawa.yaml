      link_target: https://hydroottawa.com/
    notes: >-
      Local electricity distribution company (also serves Casselman). https://ottawa.ca/en/who-call redirects to the
      evidence URL. https://hydroottawa.com/ serves the English home at /en (French: https://hydroottawa.com/fr).
      Operating utility, so it has the row (Scope rule 6) and runs its own procurement. Its parent Hydro Ottawa Holding
      Inc. ("Hydro Ottawa Group") is out_of_scope rather than in `names`: hydroottawa.com uses the Group name only for
      the parent ("Hydro Ottawa Limited is a wholly-owned subsidiary of Hydro Ottawa Group", site footer) and for Group
      reports, never as the utility's own name. ottawa.ca is bot-protected: quote checked in a browser.
    # Adopted Budget 2026 book (documents.ottawa.ca, an ottawa.ca host, so trusted). It says "Hydro Ottawa", the
    # utility's brand; the legal chain is City -> Hydro Ottawa Holding Inc. (the same page's table has "Hydro Ottawa
