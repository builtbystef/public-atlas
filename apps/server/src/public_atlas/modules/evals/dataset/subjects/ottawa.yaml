notes: >-
  Bilingual subject: every in-scope institution carries English and French names; French twins of source pages are in
  alternates. ottawa.ca returns an Imperva/Incapsula challenge to non-browser clients (HTTP 200 with a JS stub, or 403
  after repeated requests), so ottawa.ca pages cannot be checked by dataset.py; they were read and quotes verified in Chrome
  on 2026-09-29. Scope decisions: OC Transpo and Ottawa Fire Services are internal divisions with their own names (rule
  3b); the Police Service Board and OPL Board are folded into the bodies they govern (Scope rule 5, board names in
  `names`); Hydro Ottawa is one row for the operating utility Hydro Ottawa Limited, with the holding company Hydro
  Ottawa Holding Inc. out_of_scope (Scope rule 6). Divisions (OC Transpo, fire) and local boards that buy or budget
  through the City have those source types in absent_sources with covered_by: city-of-ottawa. With the five types added
  on 2026-10-01: Ottawa Public Health (Board of Health folded in), Ottawa Community Housing Corporation, Build Ottawa
  (formerly OCLDC; no website) and the ByWard Market District Authority (municipal services corporation) moved from
  out_of_scope to institutions; the three corporations are municipal_corporation since housing_corporation was folded
  into it, and Ottawa Paramedic Service went back to out_of_scope when paramedic_service was dropped. Rideau Valley, Mississippi Valley and South
  Nation conservation authorities are shared bodies (rule 4) whose rows live here, each with a member_of from the City.
  The Sparks Street Mall Authority and the Ottawa Investment Board stay out of scope (see their reasons).
