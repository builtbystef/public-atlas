      manual_check: "pdftotext 2026-10-01"
      locator: "pdf page 244 (printed 225)"
    notes: >-
      City-controlled real estate development corporation (rule 3(a); municipal_corporation: real estate). Incorporated
      in 2009 as the Ottawa Community Lands Development Corporation and renamed Build Ottawa in December 2023 (Build
      Ottawa 2023 Annual Report to Council, ACS2024-SI-HSI-0019, on the City's eSCRIBE portal), with a mandate now
      focused on putting surplus City land to affordable housing. Judgement call: it develops and sells land rather than
      owning or running housing (municipal_corporation either way since housing_corporation was folded into it on
      2026-10-01). It has no website: buildottawa.ca
      and ocldc.ca do not resolve and ottawa.ca has no page of its own for it, so find_homepage should record no
      webpage. The same budget page lists "Build Ottawa (OCLDC)" as a revenue line.
