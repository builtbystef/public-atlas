  - institution: mcgarry-public-library
    source_type: budget
    covered_by: township-of-mcgarry
    note: >-
      No library budget published separately. Searched the library page, the library database folders
      (Agendas and Minutes only) and the sitemap. The library is budgeted through the township: the
      2026 Budget Report (a scanned PDF, read as images) has a "LIBRARY 600" department with a 2026
