    evidence:
      url: https://mcgarry.ca/town-hallasset-management
      quote: "Asset Management Plan - Non-Core Asset"
    notes: >-
      No capital plan or capital budget page of its own (capital lines sit inside the 2026 Budget
      Report), so the asset management page is the capital_plan source (README, asset management
      plans count as capital_plan).
      Core and non-core asset management plans (PDFs created September 2024) and the strategic asset
      management policy by-law. The Plans, Reports and Studies page also links an older Asset
      Management Plan 2016-2025; that page is a grab-bag of reports and is not an alternate.

  - institution: township-of-mcgarry
