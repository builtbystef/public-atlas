institutions:
  - key: township-of-mcgarry
    type: municipal_government
    names:
      - { text: Township of McGarry, lang: en }
      - { text: Corporation of the Township of McGarry, lang: en }
      - { text: McGarry Township, lang: en }
    homepage: https://mcgarry.ca/
    homepage_host: trusted_domain
    evidence:
      url: https://mcgarry.ca/
      quote: "The Corporation of the Township of McGarry 27 Webster Street, P.O. Box 99, Virginiatown, ON, P0K 1X0"
    notes: >-
      Own domain mcgarry.ca, but the site is built and hosted by the municipal website vendor Catalis
      (footer "Government Websites by Catalis"). The vendor alias https://mcgarryon.web.catalisgov.ca/
      301-redirects to mcgarry.ca, and the budget page links its financial statements on that alias, so
      an agent will meet catalisgov.ca links from a trusted page. www.mcgarry.ca 301-redirects to
      mcgarry.ca. Old eSolutions-style URLs (www.mcgarry.ca/en/....aspx) still show in search results
      but now redirect to a 404 page.

  - key: mcgarry-volunteer-fire-brigade
    type: fire_service
    names:
      - { text: McGarry Volunteer Fire Brigade, lang: en }
      - { text: Fire Department, lang: en }
    homepage: https://mcgarry.ca/residents-visitorsfire-department
    homepage_host: trusted_domain
    evidence:
      url: https://mcgarry.ca/index.asp?SEC=0A782192-FD21-4D84-A6E6-518EA255287A
      quote: "McGarry Volunteer Fire Brigade 27 Webster Street"
    notes: >-
      Internal township department (volunteer crew, chief and council representative listed on the
      Fire Department page). It gets a row under rule 3(b) because the township's Community Groups and
      Organizations page lists it under its own name, "McGarry Volunteer Fire Brigade". The Fire
      Department page itself only says "Fire Department". Judgement call for a reviewer.
    parent:
      institution: township-of-mcgarry
      label: has a dedicated crew of volunteer firefighters
      evidence:
        url: https://mcgarry.ca/residents-visitorsfire-department
        quote: The Township of McGarry has a dedicated crew of volunteer firefighters

  - key: mcgarry-public-library
    type: library
    names:
      - { text: McGarry Public Library, lang: en }
    homepage: https://mcgarry.ca/residents-visitorslibrary
    homepage_host: trusted_domain
    evidence:
      url: https://mcgarry.ca/residents-visitorslibrary
      quote: "The McGarry Public Library is here to serve the community of the Township of McGarry"
    notes: >-
      Public library board (Public Libraries Act): the page lists a librarian, two council
      representatives and three members, and links the board's agendas and minutes. No website of its
      own was found. Web search (2026-10-01) shows a Facebook page (facebook.com/McGarryLibrary) and
      211 directory listings, but no mcgarry.ca page links to them (the site footer's Facebook icon
      points at the bare facebook.com), so the homepage stays the section of mcgarry.ca.
    parent:
      institution: township-of-mcgarry
      label: Council Representatives
      evidence:
        url: https://mcgarry.ca/residents-visitorslibrary
        quote: Council Representatives Councillor Elaine Fic Councillor Louanne Caza

sources:
