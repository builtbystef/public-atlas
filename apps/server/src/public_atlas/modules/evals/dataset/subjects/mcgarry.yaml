      url: https://mcgarry.ca/town-halltenders-rfp-s-and-tax-sales
      quote: "When required, staff will prepare a tender, request for proposal or other method of procurement. The Township encourages competition among suppliers in order to maximize savings for taxpayers."
    notes: >-
      The only purchasing page: how the township buys, tenders vs RFPs, tax and surplus land sales.
      The procurement by-law ("2018-33 Adopt Procurement Policy", plus the older purchasing policies
      2008-24 and 2004-47) is a single PDF in the By-Law Database document library
      (index.asp?SEC=DB2FCCCF-6E13-4124-AEE3-B948929C932F, linked from By-Laws and Policies); it is a
      file, not a landing page, so it is not a source.

  - institution: township-of-mcgarry
    source_type: tender
    url: https://biddingo.com/mcgarry
    alternates:
      - https://portal.biddingo.com/landingpage/mcgarry
      - https://biddingo.com/landingpage/mcgarry
      - https://mcgarry.ca/town-halltenders-rfp-s-and-tax-sales
    platform: biddingo.com
    evidence:
      url: https://biddingo.com/mcgarry
      quote: "Welcome to the Purchasing Portal for Township of McGarry."
      manual_check: "browser 2026-09-29"
    notes: >-
      Biddingo is a listed third-party platform (platforms). The township page links https://portal.biddingo.com/landingpage/mcgarry, which
      301-redirects to https://biddingo.com:443/landingpage/mcgarry (checked 2026-10-01); the app shows
      the portal at https://biddingo.com/mcgarry. Biddingo's public API
      (api.biddingo.com/restapi/setting/noauthorize/buyerlandingpageinfo/mcgarry) confirms the landing
      page ("orgFullName":"Township of McGarry", "hasLandingpage":"Y"). The page is JavaScript-rendered: the quote and the bid
      listing (RFPs for Community Centre Exterior Upgrades 2025, insurance 2022, audit services 2021,
      surplus equipment sales) were read in Chrome, hence manual_check. No bid
      was open on 2026-09-29. Trap: the township page frames Biddingo only as a place to "auction off
      surplus equipment", but it carries the township's real RFPs. The township page's own "Tenders" and
      "Bid Opportunities" accordions are empty; it is kept as an alternate because it is the page one
      click up.

  - institution: township-of-mcgarry
    source_type: budget
    url: https://mcgarry.ca/town-hallbudget-and-finances
    evidence:
      url: https://mcgarry.ca/town-hallbudget-and-finances
      quote: "The Municipal Budget is prepared yearly to determine the Operating and Capital requirements for the year."
    notes: >-
      Links the "2026 Budget Report" (PDF, 5 pages, April 2026), budget decisions and staff report, plus
      financial statements 2015-2025 served from the vendor alias mcgarryon.web.catalisgov.ca.

  - institution: township-of-mcgarry
