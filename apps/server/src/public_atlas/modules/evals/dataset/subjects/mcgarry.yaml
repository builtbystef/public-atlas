candidate_domains:
  - domain: catalisgov.com
    institution: township-of-mcgarry
    expected: reject
    reason: The vendor's corporate site, linked from the footer of every page ("Government Websites by Catalis").
  - domain: vtownhistory.org
    institution: township-of-mcgarry
    expected: reject
    reason: >-
      Community history site, "Kearns & Virginiatown Ontario". Search surfaces it for the township's
      villages, but it is not run by the township.
  - domain: timiskaminghu.com
    institution: township-of-mcgarry
    expected: reject
    reason: >-
      The old Timiskaming Health Unit site, still linked from the Health and Wellness page ("Click here
      for Timiskaming Health Unit webpage"). It belongs to another body (out of scope), which merged
      into Northeastern Public Health (neph.ca) on 2025-01-01. On 2026-10-01 the host refused
      connections (HTTPS) and timed out (HTTP), so it is also dead.
  - domain: tembuild.com
    institution: township-of-mcgarry
    expected: reject
    reason: >-
      The Temiskaming Municipal Services Association site (building services; CBO email
      cbo@tembuild.com), linked twice from the Planning and Development page. A shared service
      association, not the township (out of scope).
  - domain: circularmaterials.ca
    institution: township-of-mcgarry
    expected: reject
    reason: >-
      The recycling program operator's page for McGarry (circularmaterials.ca/resident-communities/mcgarry/),
      linked from the Garbage and Recycling page. A private producer responsibility organization, not
      the township.

out_of_scope:
  - name: Ontario Provincial Police (Kirkland Lake detachment)
    url: https://www.opp.ca/
    reason: >-
      Polices the township. It is listed on the Community Groups page with a Kirkland Lake address. It is a
      provincial police service, not a township police_service.
  - name: Kirkland Lake O.P.P. Detachment Board
    url: https://www.pas.gov.on.ca/Home/Agency/793
    reason: >-
      OPP detachment board under the Community Safety and Policing Act; McGarry Township appoints one
      member (Public Appointments Secretariat page). It governs the OPP, which is provincial, so it is
      out of scope (README rule 5).
  - name: Community Policing Committee
    url: https://mcgarry.ca/council-committeescommunity-policing-committee
    reason: >-
      Advisory committee of council (two councillors, reports at Regular Council Meetings) that works
      with the OPP. It is not a police service or a police board; precision trap for police_service.
  - name: Northeastern Public Health (formerly Timiskaming Health Unit)
    url: https://www.neph.ca/
    reason: >-
      Public health unit. The township still calls it the Timiskaming Health Unit (Health and Wellness
      page, linking the dead timiskaminghu.com) and the "Kirkland Lake District Health Unit" (Animal
      Control page); it merged with the Porcupine Health Unit into Northeastern Public Health on
      2025-01-01. It is a public_health_unit, but a district body shared by the municipalities of the
      Timiskaming and Cochrane districts; the township does not own or control it (the Health and
      Wellness page only links to it), so it gets no row in this file.
  - name: Timiskaming Health Unit
    url: https://www.timiskaminghu.com/
    reason: >-
      The former name of Northeastern Public Health (entry above), still used and linked on the Health
      and Wellness page ("Click here for Timiskaming Health Unit webpage"). A district public health
      unit the township does not control, and it no longer exists under this name. Precision trap.
  - name: Township of McGarry Public Works (water, sewer and landfill)
    url: https://mcgarry.ca/residents-visitorswater-and-sewer
    reason: >-
      The township runs water, wastewater and the landfill through Public Works, with no name or site
      of its own (Water and Sewer, Garbage and Recycling pages). A service area, not a public_utility
      (README rule 8).
  - name: District of Timiskaming Social Services Administration Board
    url: https://www.dtssab.com/
    reason: >-
      District social services board (social assistance, housing, child care, paramedics) for Timiskaming
      municipalities. Its housing and paramedic work would fit housing_corporation or
      paramedic_service, but it is a district board shared by the Timiskaming municipalities and
      unorganized territory; the township does not own or control it, so it gets no row in this file.
  - name: Ontario Clean Water Agency
    url: https://www.ocwa.com/
    reason: >-
      Operates the township's wastewater lagoons and plant "through a contract" (Water and Sewer page).
      It is a provincial agency and a contractor, not a township utility.
  - name: Temiskaming Municipal Services Association (TMSA)
    url: http://www.tembuild.com/
    reason: >-
      Provides building department services (Chief Building Official) for the township (Planning and
      Development page). It is a shared service association of Timiskaming municipalities that the
      township buys a service from; McGarry does not own or control it, and inspecting buildings for its
      members is not a business of its own of the kind municipal_corporation covers.
  - name: Hydro One
    url: https://www.hydroone.com/
    reason: >-
      Electricity distributor for the area (the township site has a "Hydro One Power Outage" notices
      page). It is provincially owned, so it is not a township public_utility. Precision trap.
  - name: Centre de santé communautaire du Témiskaming
    reason: >-
      Community health centre in Virginiatown, listed on the Community Groups page. It is provincially
      funded health care run by its own not-for-profit board, which the township does not own or
      control. It is not a public health unit.
  - name: District School Board Ontario North East
    url: https://www.dsb1.ca/
    reason: School board (province-level type), scored under Ontario, not the township.
  - name: Northeastern Catholic District School Board
    url: https://www.ncdsb.on.ca/
    reason: School board (province-level type), scored under Ontario, not the township.
  - name: Conseil scolaire catholique de district des Grandes Rivières
    url: https://cscdgr.education/
    reason: French Catholic school board (province-level type), scored under Ontario, not the township.
  - name: Conseil scolaire public du Nord-Est de l'Ontario
    url: https://www.cspne.ca/
    reason: French public school board (province-level type), scored under Ontario, not the township.
  - name: Strategic Planning Committee
    url: https://mcgarry.ca/council-committeesstrategic-planning-committee
    reason: >-
      Advisory committee of council with its own agenda and minutes database. Council committees are out
      of scope (README rule 2: they spend little and buy through the township), so they get no row; the
      township's other committees are listed one by one below.
  - name: Recreation Committee
    url: https://mcgarry.ca/council-committeesrecreation-committee
    reason: >-
      Committee of council that organizes recreation "from the budget allocated to it by the Township of
      McGarry". A council committee (README rule 2), not a municipal_corporation.
  - name: Tourist Committee
    url: https://mcgarry.ca/council-committeestourist-committee
    reason: >-
      Advises council on parks, recreation, culture and tourism and helps run the Tourist Centre. A council
      committee (README rule 2), not an economic development municipal_corporation. Precision trap.
  - name: Communication Committee
    url: https://mcgarry.ca/council-committeescommunication-committee
    reason: Standing committee of council (communications policies); council committees are out of scope (README rule 2).
  - name: Emergency Management Program Committee
    url: https://mcgarry.ca/council-committeesemergency-management-program-committee
    reason: Committee of council required by the Emergency Management and Civil Protection Act; council committees are out of scope (README rule 2).
  - name: Property Standards Committee
    url: https://mcgarry.ca/council-committeesproperty-standards-committee
    reason: >-
      Quasi-judicial committee appointed by council to hear appeals of property standards orders (also
      called the Appeals Committee). A tribunal, out of scope under README rule 2.
  - name: Appeals Committee
    url: https://mcgarry.ca/council-committeesappeals-committee
    reason: >-
      Same body as the Property Standards Committee ("Property Standards Committee / Appeals Committee are
      the same committee"). A tribunal, out of scope under README rule 2.
  - name: Circular Materials and GFL Environmental
    url: https://mcgarry.ca/residents-visitorsgarbage-and-recycling
    reason: Private recycling program operator and hauler (Garbage and Recycling page). They are contractors, not public institutions.

notes: >-
  Subject choice: the Township of McGarry (Timiskaming District, northeastern Ontario; villages
  Virginiatown and Kearns; 2021 census population 579, CSD 3554058, single-tier because districts are
  not municipalities). Considered: Hornepayne (968; eSolutions-hosted but a rich site with its own
  purchasing and tenders pages, too easy); Head, Clara and Maria (lower-tier in Renfrew, about 270, thin
  and split across headclaramaria.ca and townshipsofheadclaramaria.ca, but no library board); Evanturel
  (Catalis-hosted too, thinner, no library found); Chamberlain (a nearly empty Wix site). McGarry was
  picked because it combines a vendor-hosted site (Catalis, with a catalisgov.ca alias), real tenders
  only on a third-party bid platform (Biddingo, now on the platform list), which the township's own page
  mislabels as a surplus auction site, a volunteer fire brigade, a library board whose only presence is
  a page and a JS-loaded minutes database on the township site, JS-rendered meeting databases with an
  embedded Catalis meeting platform, and a strategic plan PDF reachable only from an unrelated page.
  Trust: the township's own domain mcgarry.ca is trusted. The vendor domains catalisgov.ca (the
  mcgarryon.web.catalisgov.ca alias serving the financial statement PDFs) and allnetmeetings.com
  (the embedded meeting platform) are on platforms, like biddingo.com: fetchable, never
  trusted, so pages there count only when a trusted mcgarry.ca page links to them, and that is
  true for both. The government is therefore trusted_domain, not
  platform. No conservation authority covers McGarry as far as found, so none is listed. For the five
  types added to the country file (housing_corporation, conservation_authority, paramedic_service,
  public_health_unit, municipal_corporation) the sitemap (2026-10-01) shows no township-controlled body:
  housing and paramedics come from the District of Timiskaming Social Services Administration Board and
  public health from Northeastern Public Health, both district bodies the township does not control
  (out_of_scope); the marina and facility rentals are run by the township itself. No ontario.ca
  page was needed as evidence.
