trusted_at_start: [nv.gov, washoeschools.net]

institutions:
  - key: washoe-county-school-district
    type: school_board
    names:
      - { text: Washoe County School District, lang: en }
      - { text: WCSD, lang: en, is_acronym: true }
      - { text: Washoe County, lang: en }
      - { text: Washoe County School District Board of Trustees, lang: en }
      - { text: Distrito Escolar del Condado de Washoe, lang: es }
    homepage: https://www.washoeschools.net/
    homepage_host: trusted_domain
    evidence:
      url: https://www.washoeschools.net/
      quote: "Welcome to the Washoe County School District"
    notes: >-
      County-wide school district of Washoe County, Nevada (Reno, Sparks, Incline Village, Gerlach),
      "the second-largest public school district in Nevada", 59,565 students and 100+ schools (Who We
      Are page, 2026-10-09). The NCES directory loaded it under the place Washoe County with the
      directory's name "Washoe County" (NCES id 3200480), hence that entry in names; the scorer matches
      the loaded row on it. "Washoe County School District Board of Trustees" is the governing body's
      name as the Board Meeting Archive page writes it; the board folds into the district (README rule
      5). The Spanish name is the one its own strategic plan page uses for the Spanish edition of the
      plan ("Distrito Escolar Del Condado de Washoe Plan Estratégico para 2023-2026"). The site is
      built by the school website vendor Finalsite ("Powered by Finalsite" in every footer); each
      school has a subdomain (reno.washoeschools.net, aact.washoeschools.net, ...), and so do the
      district's own bid portal (solicitations.washoeschools.net), its Data Gallery
      (datagallery.washoeschools.net) and its staff intranet (insight.washoeschools.net), all covered
      by the trusted domain. Its board policies live on a separate domain, wcsdpolicy.net
      (candidate_domains). washoeschools.net without www serves the same site (200, no redirect).

sources:
