candidate_domains:
  - domain: wcsdpolicy.net
    institution: washoe-county-school-district
    expected: confirm
    reason: >-
      The district's own policy site, "WCSD Board Policy and Administrative Regulations Home Page"
      ("The Washoe County School District (District) Board Policy Online system", run by the Office
      of the General Counsel at 425 East 9th Street, Reno). Linked from the home page menu ("Policy
      and Regulation Information"), the Purchasing page and the Diligent portal.
  - domain: diligentoneplatform.com
    institution: washoe-county-school-district
    expected: review
    reason: >-
      Diligent Community, the meeting portal (washoeschools.community.diligentoneplatform.com),
      linked as "Online Governance" from every page. A shared platform not on the United States
      platform list, whose diligent.com entry does not cover this domain: a candidate for the list.
  - domain: diligent.community
    institution: washoe-county-school-district
    expected: reject
    reason: >-
      The same platform's older host (washoeschools.diligent.community), still linked from the
      Capital Funding Protection Committee and Education Alliance pages. It only 301-redirects to
      diligentoneplatform.com and serves nothing of its own (checked 2026-10-09), so there is nothing
      on it to quote; the target domain is the one to review.
  - domain: finalsite.com
    institution: washoe-county-school-district
    expected: reject
    reason: The website vendor's corporate site, linked from the footer of every page ("Powered by Finalsite").
  - domain: publicsurplus.com
    institution: washoe-county-school-district
    expected: reject
    reason: >-
      "Public Surplus: Government Surplus Auctions", a surplus auction marketplace linked from the
      Purchasing page's Quick Links. Sales of surplus property, not the district's domain and not a
      tender source.
  - domain: leg.state.nv.us
    institution: washoe-county-school-district
    expected: reject
    reason: >-
      The Nevada Legislature's statutes site (NRS chapters 332, 338, 388, 393), linked from the How
      to do Business page and the committee pages. It belongs to the Legislature, not the district,
      and is not under the trusted nv.gov.
  - domain: flipbookpdf.net
    institution: washoe-county-school-district
    expected: reject
    reason: >-
      A third-party flipbook host serving a copy of the 2023-2026 Strategic Plan, linked from the
      plan's page. A file host, not the district.

out_of_scope:
  - name: Washoe County School District Police Department (School Police)
    url: https://www.washoeschools.net/directory/school-police/department-homepage
    reason: >-
      The district's own police department ("Washoe County School Police"), a department of the
      district that buys and budgets through it. Not a municipal or regional police_service;
      precision trap.
  - name: Education Alliance of Washoe County Board of Directors
    url: https://www.washoeschools.net/trustees/committees/education-alliance-board-of-directors
    reason: >-
      The district's business-and-community partnership body (NRS 388.750), run as a committee of
      the Board of Trustees: listed under Committees, public comment to a washoeschools.net address,
      meetings on the district's Diligent portal. A committee under README rule 2, not a foundation
      with buying power of its own; precision trap for municipal_corporation.
  - name: Capital Funding Protection Committee
    url: https://www.washoeschools.net/trustees/committees/capital-funding-protection-committee
    reason: >-
      "functions as a committee of the Board of Trustees related to oversight of the capital
      expenditures" (NRS 393.092), with city, county and public members. A committee of the board
      (README rule 2); its meetings are on the Diligent portal.
  - name: Oversight Panel for School Facilities
    url: https://www.washoeschools.net/trustees/committees/oversight-panel-for-school-facilities
    reason: >-
      "functions as a committee of the Board of Trustees related to renovation and construction of
      school facilities" (NRS 393.092). A committee of the board (README rule 2).
  - name: Committees of the Board of Trustees (Audit, Group Insurance, OPEB Trustees, Zoning Advisory, Safe and Healthy Schools Commission, School Naming, Student Attendance Advisory, Council on Family Resource Centers)
    url: https://www.washoeschools.net/trustees/committees/committees-home
    reason: >-
      Advisory committees and public bodies of the Board and the Superintendent, each with its
      agendas on the Diligent portal. Committees are out of scope (README rule 2).
  - name: Individual schools (e.g. Reno High School, Academy of Arts, Careers and Technology)
    url: https://reno.washoeschools.net/
    reason: >-
      Each of the 100+ schools has a subdomain of washoeschools.net linked from the Our Schools menu.
      Schools of the district, not institutions; they buy through the district's Purchasing
      Department ("the only department authorized to issue valid District Purchase Orders").
  - name: Nevada Department of Education
    url: https://doe.nv.gov/
    reason: >-
      State department linked from the home page footer and the accountability pages (and the host
      of the Nevada Report Card). A body of the State of Nevada, scored under Nevada, not the district.

notes: >-
  Subject choice: the Washoe County School District, the first United States institution subject,
  a large county-wide district (about 60,000 students) whose site, built by the school website vendor
  Finalsite, is server-rendered and rich: a purchasing department with its own bid portal on a
  subdomain (two lists, goods and services under NRS 332 and public works under NRS 338, each with
  an awards list), a budget documents page, a capital program page with a 20-year draft plan and a
  separate facility modernization plan, a Diligent Community meeting portal on a domain the seed
  does not list, a district-side meeting archive, a dedicated YouTube channel for board meeting
  recordings, and a news hub. Every type the seed expects of a school_board was found, so there are
  no absent_sources. The county government: the loader has http://www.washoecounty.us/, which on
  2026-10-09 refused connections on port 80 and, over HTTPS, 301-redirected to
  https://www.washoecounty.gov/ (title "Washoe County, NV"), the government_homepage above. It is
  not an out_of_scope entry: the harness seeds the place's government itself, as verified, so the
  scorer would count the seed as a false positive (the first run did). The district's pages name
  it ("The district works closely with the Cities of Reno and Sparks, Washoe County", WCSD
  Building page) but it is not a body of the district. Trust:
  washoeschools.net and its subdomains (the bid portal, the Data Gallery, the schools) are trusted;
  nv.gov covers the Nevada Report Card and the Governor's Office of Economic Development pages the
  district links. Platforms met: youtube.com (listed) and diligentoneplatform.com (not listed; the
  seed's diligent.com does not cover it, so it is a candidate for the list, see candidate_domains);
  demandstar.com (listed) is named on the Solicitation Opportunities page but only its home page is
  linked, and its agency pages are JavaScript-only, so no DemandStar page is recorded. Pages the
  script cannot read: the YouTube channel pages render with JavaScript, but the channel name,
  description and video titles are in the served HTML's JSON, and the evidence is the district page
  that links the channel. Bodies the district sponsors or sits on but that have no row: the charter
  schools it sponsors (Encompass Academy, SNACS, named in the 2026 Board Archive without links) and
  the Education Alliance (out_of_scope). No page of the district links the teachers' union or a
  foundation of its own, so none is listed.
