out_of_scope:
  - name: Regional Municipality of Halton (Halton Region)
    url: https://www.halton.ca/
    reason: The upper-tier parent. It is a regional_government at level region, so it is scored under Halton or Ontario, not Oakville.
  - name: Halton Regional Police Service
    url: https://www.haltonpolice.ca/
    reason: Policing in Oakville is regional. Halton Region's police service, governed by the Halton Police Board, is not Oakville's.
  - name: Halton Region water and wastewater services
    url: https://www.halton.ca/for-residents/water-and-wastewater-services
    reason: Water, wastewater and fire hydrants in Oakville are Halton Region's (the Town's Fire Stations & Equipment page says "The Municipality of Halton Region is responsible for the fire hydrants in Oakville"). This is a regional service, not an Oakville utility.
  - name: Halton Region Public Health
    url: https://www.halton.ca/for-residents/public-health
    reason: >-
      A public health unit run by Halton Region, not the Town: a body of the upper tier met on a
      lower tier's site belongs to the upper tier's file (README rule 2). Halton Region is not a
      subject.
  - name: Halton Region Paramedic Services
    reason: >-
      Ambulance service in Oakville is Halton Region's: a body of the upper tier met on a lower
      tier's site belongs to the upper tier's file (README rule 2). Halton Region is not a subject.
  - name: Halton Community Housing Corporation
    reason: >-
      Halton Region's housing corporation, not the Town's: a body of the upper tier belongs to the
      upper tier's file (README rule 2). Halton Region is not a subject.
  - name: Oakville Enterprises Corporation
    url: https://oec.ca/
    reason: >-
      A holding company that is 90% Town-owned (Enbridge 10%) and a "government business
      enterprise" in the Town's statements. It runs a commercial group of about 15 energy and
      infrastructure contractors (Trans Power, El-Con, Planview and others). The utility function
      sits in its subsidiary Oakville Hydro, which has the row. Under rule 6 the holding company of
      a utility stays out (it is not a municipal_corporation row either), and would get a row only
      if it ran procurement separately from Oakville Hydro; oec.ca
      has no procurement, supplier or tender page (navigation and page-sitemap.xml checked
      2026-10-01), so it stays out of scope.
  - name: Halton Cooperative Purchasing Group (HCPG)
    reason: A cooperative buying group listed on Oakville's bids&tenders page. It is a buying consortium, not an institution type.
  - name: Halton District School Board
    url: https://www.hdsb.ca/
    reason: school_board is a province-level type, scored under Ontario.
  - name: Halton Catholic District School Board
    url: https://www.hcdsb.org/
    reason: school_board is a province-level type, scored under Ontario.
  - name: Conseil scolaire Viamonde
    url: https://csviamonde.ca/
    reason: A French-language public school board serving Oakville. school_board is a province-level type.
  - name: Conseil scolaire catholique MonAvenir
    url: https://cscmonavenir.ca/
    reason: A French-language Catholic school board serving Oakville. school_board is a province-level type.
  - name: Halton Healthcare (Oakville Trafalgar Memorial Hospital)
    url: https://www.haltonhealthcare.on.ca/
    reason: hospital is a province-level type, scored under Ontario.
  - name: Sheridan College (Trafalgar Road Campus)
    url: https://www.sheridancollege.ca/
    reason: college is a province-level type, scored under Ontario.
  - name: Metrolinx (GO Transit)
    url: https://www.metrolinx.com/en
    reason: A provincial agency that runs GO service at Oakville, Bronte and other stations. It is a transit body but provincial, not Oakville's.
  - name: Downtown Oakville Business Improvement Area
    url: https://www.oakvilledowntown.com/
    reason: A BIA (consolidated in the Town's statements). BIAs are out of scope (README rule 2).
  - name: Kerr Village Business Improvement Area
    url: https://www.kerr-village.ca/
    reason: A BIA. BIAs are out of scope (README rule 2).
  - name: Bronte Business Improvement Area
    reason: A BIA (Bronte Village BIA). BIAs are out of scope (README rule 2). No working website was found (brontevillage.com did not resolve).
  - name: Oakville Centre for the Performing Arts
    url: https://www.oakvillecentre.ca/
    reason: >-
      A Town-run theatre in the Recreation and Culture department: a division, not a separately
      constituted corporation, authority or board, so not a municipal_corporation (rule 3).
  - name: Oakville Museum
    url: https://www.oakville.ca/parks-recreation-culture/arts-culture/oakville-museum/
    reason: >-
      A Town division (Recreation and Culture), not a separately constituted corporation or board,
      so not a municipal_corporation (rule 3); museums match no other type.
  - name: Oakville Galleries
    url: https://www.oakvillegalleries.com/
    reason: >-
      A not-for-profit public art gallery, not a Town body: not among the bodies the Town's
      financial statements consolidate, so a not-for-profit the Town does not control (README
      rule 2).
  - name: Oakville Milton Humane Society
    url: https://hsomh.ca/
    reason: A charity contracted for animal services, listed on Find Town Services as an "other organization". It is not a Town body.
  - name: Visit Oakville
    url: https://visitoakville.com/
    reason: >-
      A not-for-profit tourism organisation the Town does not control: "a volunteer board of
      directors who represent the local tourism and business community", elected at its AGM
      (visitoakville.com Board of Directors), and not among the bodies the Town's financial
      statements consolidate. A not-for-profit the municipality only funds (README rule 2).
  - name: Oakville Chamber of Commerce
    url: https://oakvillechamber.com/
    reason: A private membership organisation, not a public body.
  - name: Committee of Adjustment
    url: https://www.oakville.ca/town-hall/mayor-council-administration/committees/committee-of-adjustment/
    reason: A tribunal of Council. Council committees and tribunals are out of scope (README rule 2).
  - name: Accessibility Advisory Committee
    url: https://www.oakville.ca/town-hall/accessibility-inclusion/accessibility-advisory-committee/
    reason: An advisory committee of Council. Council committees are out of scope (README rule 2).
  - name: Heritage Oakville Advisory Committee
    url: https://www.oakville.ca/town-hall/mayor-council-administration/committees/heritage-oakville-advisory-committee/
    reason: An advisory committee of Council. Council committees are out of scope (README rule 2).
  - name: Transit Advisory Committee
    reason: >-
      An advisory committee of Council (an eSCRIBE meeting type). Council committees are out of
      scope (README rule 2); not Oakville Transit's board (it has none).
  - name: Halton Police Board
    url: https://haltonpoliceboard.ca/
    reason: >-
      Governs the Halton Regional Police Service, so it folds into that service (rule 5), which is
      Halton Region's and out of scope here.

notes: >-
  Hydro holding structure: Town -> OEC (90%, Enbridge 10%) -> Oakville Hydro Electricity
  Distribution Inc. The LDC is the public_utility row and OEC is out of scope. Neither publishes
  procurement (rechecked 2026-10-01 for the open question now in docs/todo.md; rule 6 keeps OEC out), so
  all four utility source types are absent. Transit and fire are Town departments
  with no procurement or budget pages of their own; their absent entries carry covered_by:
  town-of-oakville, as do the library's (its bids run through the Town's bids&tenders and its
  budget is a section of the Town's budget book).
  The five types added on 2026-10-01 brought in the Oakville Municipal Development Corporation
  (municipal_corporation, Town-owned), the Halton Digital Access Services Corporation
  (municipal_corporation, jointly owned with the Region and the other three Halton towns; shared
  row here under rule 4), and two shared conservation authorities: Conservation Halton (assigned
  to this file) and Credit Valley Conservation (no other subject meets it; the Town's Flood
  Protection page links both). Halton Region's public health, paramedics and housing corporation
  stay out as the upper tier's bodies. The Town has no housing corporation, parking authority or
  other local board of its own: its financial statements consolidate only the library board and
  the three BIAs, and list MDC, HDASC and OEC as government business enterprises.
