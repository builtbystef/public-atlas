      (https://www.oakvilletransit.ca/about-us/oakville-transit-five-year-business-plan/) and Annual
      Plan pages are service plans, not capital plans; fleet and facility capital sits in the Town's
      2026-2035 Capital Details. Electric-bus page is news-style, not a plan.
  - institution: oakville-transit
    source_type: board_meeting
    note: >-
      No board: Oakville Transit is governed by Town Council. The eSCRIBE "Transit Advisory
      Committee" meeting type is an advisory committee, not a board of directors.

  # --- Oakville Fire Department (a Town department) ---
  - institution: oakville-fire-department
    source_type: procurement
    covered_by: town-of-oakville
    note: >-
      Searched the Fire & Safety section, fire department page and oakville.ca sitemap; no fire
      purchasing page. Fire buys through the Town's Purchasing / bids&tenders.
  - institution: oakville-fire-department
    source_type: budget
    covered_by: town-of-oakville
    note: >-
      No fire budget page; the fire budget is part of the Town's budget book (Budget Documents).
      Fire Master Plan page exists but is not a budget.

  # --- Oakville Public Library ---
  - institution: oakville-public-library
    source_type: procurement
    covered_by: town-of-oakville
    note: >-
      Searched opl.ca navigation and footer, About OPL, Policies, Library Board, Plans & Reports, and
      a site:opl.ca web search for procurement/tender/RFP/purchasing. No purchasing page; the OPL
      employee code of conduct points to the Town's Purchasing By-law and library bids run through
      the Town's bids&tenders.
  - institution: oakville-public-library
    source_type: budget
    covered_by: town-of-oakville
    note: >-
      No budget page on opl.ca (Plans & Reports has strategic plans and Reports to the Community
      only). The library budget goes to the Board as eSCRIBE reports and is a section of the Town's
      budget book.

  # --- Oakville Hydro ---
  - institution: oakville-hydro
    source_type: procurement
    note: >-
      Searched the oakvillehydro.com navigation, footer and sitemap.xml (181 URLs; only a contractor
      certificate-of-insurance page, which returns 404 on 2026-10-01), and the parent OEC site oec.ca
      (navigation, page-sitemap.xml). No supplier or purchasing page.
  - institution: oakville-hydro
    source_type: tender
    note: >-
      No bid page on oakvillehydro.com or oec.ca; not on the Town's bids&tenders. Web search for
      Oakville Hydro / OEC tenders found none.
  - institution: oakville-hydro
    source_type: capital_plan
    note: >-
      The Distribution System Plan is filed with the OEB only in cost-of-service applications; the
      current 2027 application on Regulatory Affairs is an IRM filing, and the old
      /projects-operations/distribution-system-plan URL in the sitemap returns 404. "System Renewal
      & Expansion" (/generation-projects/grid-advancement/system-renewal-expansion) describes
      investment but is not a multi-year plan, and "Asset Management"
      (/accounts-customer-services/grid-advancement/asset-management, in the main navigation) is
      one paragraph on its asset management approach with no plan or document (checked 2026-10-01).
  - institution: oakville-hydro
    source_type: board_meeting
    note: >-
      The Board of Directors page (/about-us/about-oakville-hydro/board-directors) lists members
      only; a private OBCA corporation that publishes no agendas or minutes.

  - institution: oakville-public-library
    source_type: tender
    covered_by: town-of-oakville
    note: >-
      No bid page on opl.ca (the procurement search above covered tender and RFP). Library bids go
      through the Town's bids&tenders site, recorded under the town.

  # --- Oakville Municipal Development Corporation ---
  - institution: oakville-municipal-development-corporation
    source_type: procurement
    note: >-
      oakvillemdc.ca has eleven pages (sitemap.xml: Home, About Us, Board of Directors and its
      member pages, Development Opportunities and its property pages); no purchasing or supplier
      page. Not covered_by the Town: no page says MDC buys through the Town's Purchasing.
  - institution: oakville-municipal-development-corporation
    source_type: tender
    note: >-
      No calls for bids on oakvillemdc.ca (same sitemap). Development Opportunities lists Town
      properties for redevelopment (several "now sold"), not tenders.
  - institution: oakville-municipal-development-corporation
    source_type: annual_report
    note: >-
      No annual report on oakvillemdc.ca. Its Annual Report and Business Plan goes to Town Council
      as an eSCRIBE report attachment (e.g. "Oakville Municipal Development Corporation Annual Report
      2021", pub-oakville.escribemeetings.com/filestream.ashx?DocumentId=37395), a single file on the
      Town's council portal rather than a landing page. A summary of its finances is note 4 of the
      Town's financial statements.
  - institution: oakville-municipal-development-corporation
    source_type: board_meeting
    note: >-
      The Board of Directors page lists directors and officers only; no agendas or minutes on
      oakvillemdc.ca (sitemap checked 2026-10-01).

  # --- Halton Digital Access Services Corporation ---
  - institution: halton-digital-access-services-corporation
    source_type: procurement
    note: >-
      No site of its own (hdasc.ca is a parked registrar page; its e-mail runs on the domain). The
      halton.ca page says "it outsources most of its services" but has no purchasing information;
      a web search for the corporation found only Halton Region and Burlington/Oakville council
      reports and a Halton careers posting (2026-10-01).
  - institution: halton-digital-access-services-corporation
    source_type: tender
    note: No bid page found (same searches).
  - institution: halton-digital-access-services-corporation
    source_type: annual_report
    note: >-
      No annual report found (same searches). The Town's financial statements give a summary of its
      results (2025, note 5).
  - institution: halton-digital-access-services-corporation
    source_type: board_meeting
    note: >-
      The halton.ca page says each owner and each local hydro has a representative on its board of
      directors; no board agendas or minutes are published (same searches).

  # --- Credit Valley Conservation ---
  - institution: credit-valley-conservation
    source_type: procurement
    note: >-
      No purchasing page on cvc.ca: the sitemap (no procurement, purchasing, tender or supplier
      URL), the About Us menu, footer and Jobs page, and a web search of cvc.ca for procurement and
      purchasing policy (2026-10-01). Its bids&tenders site is the tender source.

