    expected: confirm
    reason: Oakville Public Library's own site, linked from oakville.ca.
  - domain: opl.on.ca
    institution: oakville-public-library
    expected: confirm
    reason: >-
      OPL's second domain, which hosts the program registration system at attend.opl.on.ca, linked
      from opl.ca ("My Programs/Events"); the page is titled "attend--reserve - Oakville Public
      Library". Judgement call: attend.opl.on.ca is a CNAME to Communico (lb1.communico.co, a
      library events product), and on 2026-10-01 the bare opl.on.ca serves only a default IIS page
      over http (its https certificate is for another host) while www.opl.on.ca times out. Kept
      as confirm because the linked page is live and presents as OPL on OPL's own registered
      domain; a run that judges only the bare home page would reject it as dead.
