  - key: oakville-transit
    type: transit_agency
    names:
      - { text: Oakville Transit, lang: en }
    homepage: https://www.oakvilletransit.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.oakville.ca/transportation-roads/oakville-transit/
      quote: "Public transportation throughout the town is provided by Oakville Transit"
      kind: links_to
      link_target: https://www.oakvilletransit.ca/
    notes: >-
      A department of the Town's Community Infrastructure Commission, not a separate board or
      corporation; in scope under rule 3(b) (own name, own domain). The Town page
      https://www.oakville.ca/transportation-roads/oakville-transit/ is its section on the
      trusted domain; the site footer on oakvilletransit.ca reads "Copyright © 2026 Town of Oakville".
    parent:
      institution: town-of-oakville
      label: Departments
      evidence:
        url: https://www.oakville.ca/town-hall/mayor-council-administration/cao-administration/
        quote: "Departments: Asset Management Oakville Transit Roads and Works Operations Transportation and Engineering"

  - key: oakville-fire-department
    type: fire_service
    names:
      - { text: Oakville Fire Department, lang: en }
      - { text: Fire and Emergency Services, lang: en }
    homepage: https://www.oakville.ca/home-environment/fire-safety/fire-department/
    homepage_host: trusted_domain
    evidence:
      url: https://www.oakville.ca/home-environment/fire-safety/fire-department/
      quote: "The Oakville Fire Department provides fire protection services to our community."
    notes: >-
      Internal department ("Fire and Emergency Services" in the CAO org list) presenting itself as
      "Oakville Fire Department"; rule 3(b). No site of its own. The Fire Master Plan is recorded
      as its strategic_plan under the floor rule (see sources).
    parent:
      institution: town-of-oakville
      label: the Town's fire department
      evidence:
        url: https://www.oakville.ca/home-environment/fire-safety/fire-department/
        quote: The head of the Town's fire department is the director of emergency planning and fire services, also known as the Fire Chief.

  - key: oakville-public-library
    type: library
    names:
      - { text: Oakville Public Library, lang: en }
      - { text: OPL, lang: en, is_acronym: true }
      - { text: Oakville Public Library Board, lang: en }
    homepage: https://opl.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.oakville.ca/community-events/oakville-public-library/
      quote: "Visit the Oakville Public Library website"
      kind: links_to
      link_target: https://opl.ca/
    notes: >-
      A public library board under the Public Libraries Act (consolidated in the Town's financial
      statements as "The Oakville Public Library Board"), also listed as a department of the
      Community Services Commission. www.opl.ca 301-redirects to https://opl.ca/.
    parent:
      institution: town-of-oakville
      label: Departments
      evidence:
        url: https://www.oakville.ca/town-hall/mayor-council-administration/cao-administration/
        quote: "Departments: Facility Services Fire and Emergency Services Oakville Public Library Parks and Open Space Recreation and Culture"

  - key: oakville-hydro
    type: public_utility
    names:
      - { text: Oakville Hydro, lang: en }
      - { text: Oakville Hydro Electricity Distribution Inc., lang: en }
    homepage: https://www.oakvillehydro.com/
    homepage_host: own_domain
    evidence:
      url: https://www.oakville.ca/town-hall/contact-us/find-town-services/
      quote: "Halton Regional Police Service Oakville Hydro Oakville Milton Humane Society"
      kind: links_to
      link_target: https://www.oakvillehydro.com/
    notes: >-
      Judgement call. The Town owns 90% of Oakville Enterprises Corporation (OEC, a holding
      company; Enbridge holds 10%), and OEC wholly owns Oakville Hydro Electricity Distribution
      Inc., the OEB-licensed local distribution company. The row goes to the LDC because it is the
      body that matches public_utility and the one the Town links to; OEC is in out_of_scope.
      Neither OEC (oec.ca) nor Oakville Hydro publishes a procurement or tender page, so rule 6's
      "procurement run separately" test does not give OEC a row of its own (checked 2026-10-01:
      oec.ca navigation and page-sitemap.xml, /procurement, /suppliers, /tenders, /bids all 404,
      and a web search found no OEC or Oakville Hydro bid page).
    parent:
      institution: town-of-oakville
      label: The Corporations’ subsidiary
      evidence:
        url: https://www.oakville.ca/getmedia/745020aa-b0ca-4b0e-b245-68e77faa04ed/town-hall-financial-statement-2025.pdf
        quote: The Corporations’ subsidiary, Oakville Hydro Electricity Distribution Inc. has access to a revolving credit facility
        locator: "PDF page 29 (printed page 23), note 6(d); ownership in note 6 on PDF page 25: 'Oakville Enterprises Corporation and its wholly owned subsidiaries ... is 90% (2024 - 90%) owned and controlled by the Town'"
        manual_check: pdftotext 2026-09-29

  - key: oakville-municipal-development-corporation
    type: municipal_corporation
    names:
      - { text: Oakville Municipal Development Corporation, lang: en }
      - { text: OakvilleMDC, lang: en }
      - { text: Oakville MDC, lang: en }
      - { text: Oakville Municipal Development Corp., lang: en }
      - { text: MDC, lang: en, is_acronym: true }
    homepage: https://www.oakvillemdc.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.oakville.ca/town-hall/news-notices/2025-planning-public-notices-archive/complete-application-statutory-public-meeting-for-proposed-opa-zba-2264-trafalgar-road/
      quote: "The Town of Oakville has received a complete application by the Oakville Municipal Development Corporation (OakvilleMDC)."
    notes: >-
      Town-owned real estate corporation (municipal_corporation; was out of scope before the type
      existed). Rule 3(a): "a wholly owned subsidiary of the Town of Oakville" (oakvillemdc.ca About
      Us), governed by "a five-member Board of Directors appointed by town Council"; the Town's 2025
      financial statements (note 4, PDF page 22) say MDC "is owned and controlled by the Town" and
      account for it as a government business enterprise. No oakville.ca page links to
      oakvillemdc.ca (checked the planning notice, the development application page and the Mayor's
      page, which names it), so the evidence is appears_on. The "MDC" acronym is the Town's
      (financial statements); "Oakville Municipal Development Corp." is the development
      application page's form.
    parent:
      institution: town-of-oakville
      label: a wholly owned subsidiary of the Town of Oakville
      evidence:
        url: https://www.oakvillemdc.ca/about-us/
        quote: is a wholly owned subsidiary of the Town of Oakville

  - key: halton-digital-access-services-corporation
    type: municipal_corporation
    names:
      - { text: Halton Digital Access Services Corporation, lang: en }
      - { text: Halton Digital Access Municipal Services Corporation, lang: en }
      - { text: HDASC, lang: en, is_acronym: true }
    homepage: https://www.halton.ca/the-region/projects-and-initiatives/halton-digital-access-msc
    homepage_host: trusted_domain
    evidence:
      url: https://www.halton.ca/the-region/projects-and-initiatives/halton-digital-access-msc
      quote: "the Region and Local Municipalities established the Halton Digital Access Services Corporation"
    notes: >-
      Judgement call. A corporation jointly owned (20% each) by Halton Region, Burlington, Halton
      Hills, Milton and Oakville that runs a business of its own: it licenses space on about 80,000
      streetlights and hydro poles to telecoms "for market rate fees" and pays dividends to its
      owners (halton.ca page). The Town's statements carry it as a government business enterprise
      (2025 financial statements, note 5). So municipal_corporation, a shared body under rule 4:
      Halton Region, where it sits, is not a subject, so the row is here, with a member_of from the
      Town. It has no site of its own: hdasc.ca is used only for e-mail (a parked registrar page,
      see candidate_domains), so the Region's page about it, which carries its name and the General
      Manager's contact, is its webpage on a trusted domain. Was out of scope as "no fitting type".

  - key: conservation-halton
    type: conservation_authority
    names:
      - { text: Conservation Halton, lang: en }
      - { text: Halton Region Conservation Authority, lang: en }
    homepage: https://www.conservationhalton.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.oakville.ca/home-environment/flooding/flood-protection/
      quote: "Watch for alerts issued by Conservation Halton and Credit Valley Conservation"
      kind: links_to
      link_target: https://www.conservationhalton.ca/
    notes: >-
      Shared conservation authority (rule 4) whose watersheds include Sixteen Mile Creek, which
      "drains parts of Halton Hills, Milton, Mississauga, and Oakville", and smaller watersheds in
      Oakville (conservationhalton.ca Watersheds). Headquartered in Burlington, which is not a
      subject, so the row is in this file. "Halton Region Conservation
      Authority" is its legal name, used on its Governance page (by-laws). No member_of: its
      participating municipalities appoint the board ("The municipalities located in the watershed
      appoint representatives", Governance page), but no page found names the Town of Oakville as a
      member (Oakville's seats come through Halton Region). Was out of scope before the type existed.

  - key: credit-valley-conservation
    type: conservation_authority
    names:
      - { text: Credit Valley Conservation, lang: en }
      - { text: CVC, lang: en, is_acronym: true }
      - { text: Credit Valley Conservation Authority, lang: en }
    homepage: https://cvc.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.oakville.ca/home-environment/flooding/flood-protection/
      quote: "Watch for alerts issued by Conservation Halton and Credit Valley Conservation"
      kind: links_to
      link_target: https://cvc.ca/
    notes: >-
      Shared conservation authority (rule 4) for the Credit River watershed, which takes in part of
      Oakville. Headquartered in Mississauga, which is not a subject, and no other dataset file meets
      it, so the row is in this file, the first subject that does: the Town's Flood Protection page
      links it beside Conservation Halton. Its board lists a "Regional Councillor Ward 6, Town of
      Oakville" (cvc.ca Governance), but appointments are by upper tier ("Representation on the
      board is based on population of the municipality (upper tier)"), so no member_of from the
      Town. "Credit Valley Conservation Authority" is the name on its budget documents.

