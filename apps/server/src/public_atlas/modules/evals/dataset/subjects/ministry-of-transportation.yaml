institutions:
  - key: ministry-of-transportation
    type: ministry
    names:
      - { text: Ministry of Transportation, lang: en }
      - { text: MTO, lang: en, is_acronym: true }
      - { text: Ministère des Transports, lang: fr }
    homepage: https://www.ontario.ca/page/ministry-transportation
    homepage_alternates:
      - https://www.ontario.ca/fr/page/ministere-des-transports
    homepage_host: trusted_domain
    evidence:
      url: https://www.ontario.ca/page/ministry-transportation
      quote: "Ministry of Transportation Moving people and goods safely, efficiently and sustainably across Ontario"
    notes: >-
      Official name confirmed on ontario.ca (page title and breadcrumb "Ministries > Ministry of Transportation").
      French twin: https://www.ontario.ca/fr/page/ministere-des-transports. The legacy domain
      http://www.mto.gov.on.ca/english/ (still linked from several ontario.ca pages) redirects to this page.

  - key: metrolinx
    type: agency
    names:
      - { text: Metrolinx, lang: en }
      - { text: Metrolinx, lang: fr }
    homepage: https://www.metrolinx.com/en
    homepage_alternates:
      - https://www.metrolinx.com/fr
    homepage_host: own_domain
    evidence:
      url: https://www.ontario.ca/page/ministry-transportation
      quote: "The ministry is affiliated with the following independent agencies: Metrolinx"
      kind: links_to
      link_target: http://www.metrolinx.com/en/
    notes: >-
      ontario.ca links http://www.metrolinx.com/en/, which redirects to https://www.metrolinx.com/en.
      Its own footer: "Metrolinx, an agency of the Ontario Government under the Metrolinx Act, 2006".
      Typed agency (ontario.ca and its own pages say "agency"); it is a Crown agency without share capital,
      so crown_corporation is arguable. GO Transit, UP Express and PRESTO are Metrolinx divisions (see out_of_scope).
    parent:
      institution: ministry-of-transportation
      label: The ministry is affiliated with the following independent agencies
      evidence:
        url: https://www.ontario.ca/page/ministry-transportation
        quote: "The ministry is affiliated with the following independent agencies: Metrolinx Owen Sound Transportation Company Ontario Northland Transportation Commission"

  - key: ontario-northland-transportation-commission
    type: agency
    names:
      - { text: Ontario Northland Transportation Commission, lang: en }
      - { text: Ontario Northland, lang: en }
      - { text: ONTC, lang: en, is_acronym: true }
      - { text: Commission de transport Ontario Northland, lang: fr }
      - { text: CTON, lang: fr, is_acronym: true }
    homepage: https://www.ontarionorthland.ca/en
    homepage_alternates:
      - https://www.ontarionorthland.ca/fr
    homepage_host: own_domain
    evidence:
      url: https://www.ontario.ca/page/ministry-transportation
      quote: "Ontario Northland Transportation Commission"
      kind: links_to
      link_target: http://www.ontarionorthland.ca/en
    notes: >-
      Currently reports to MTO (older lists, e.g. the MGS classified agencies PDF, put it under Northern
      Development and Mines). Its governance page: "Ontario Northland is an agency of the Province of Ontario
      that reports to the Ministry of Transportation." Typed agency per ontario.ca wording; it is a commercial
      operational enterprise often called a Crown corporation, so crown_corporation is arguable.
      The Public Appointments Secretariat lists its URL as www.ontc.on.ca, which (http only) redirects here.
    parent:
      institution: ministry-of-transportation
      label: The ministry is affiliated with the following independent agencies
      evidence:
        url: https://www.ontario.ca/page/ministry-transportation
        quote: "The ministry is affiliated with the following independent agencies: Metrolinx Owen Sound Transportation Company Ontario Northland Transportation Commission"

  - key: owen-sound-transportation-company
    type: agency
    names:
      - { text: Owen Sound Transportation Company, lang: en }
      - { text: "Owen Sound Transportation Company, Limited", lang: en }
      - { text: OSTC, lang: en, is_acronym: true }
    homepage: https://www.ontarioferries.com/
    homepage_alternates:
      - https://www.ontarioferries.com/fr/accueil/
    homepage_host: own_domain
    evidence:
      url: https://www.ontario.ca/page/ministry-transportation
      quote: "Owen Sound Transportation Company"
      kind: links_to
      link_target: https://www.ontarioferries.com/
    notes: >-
      Own site: "Owen Sound Transportation Company is an operational enterprise agency of the Province of Ontario."
      Incorporated under the Business Corporations Act with the Minister as sole shareholder (per the Public
      Appointments Secretariat), so crown_corporation is arguable; typed agency per ontario.ca wording.
      The French pages use the English name only. "Owen Sound Transportation Company, Limited" is the
      form in the MTO-OSTC MOU posted on its Corporate & Governance page; the Public Appointments
      Secretariat writes "Owen Sound Transportation Company Limited" (checked 2026-10-01).
    parent:
      institution: ministry-of-transportation
      label: The ministry is affiliated with the following independent agencies
      evidence:
        url: https://www.ontario.ca/page/ministry-transportation
        quote: "The ministry is affiliated with the following independent agencies: Metrolinx Owen Sound Transportation Company Ontario Northland Transportation Commission"

  - key: go-transit
    type: transit_agency
    expected: review
    names:
      - { text: GO Transit, lang: en }
      - { text: GO Transit, lang: fr }
    homepage: https://www.gotransit.com/en
    homepage_alternates:
      - https://www.gotransit.com/fr
    homepage_host: own_domain
    evidence:
      url: https://www.ontario.ca/page/published-plans-and-annual-reports-2025-2026-ministry-transportation
      quote: "The agency is responsible for the operation of the GO Transit system"
    notes: >-
      Moved from out_of_scope on 2026-10-01. GO Transit is an operating division of Metrolinx, not a
      separate body, but it presents under its own name and domain and its work is transit, so
      README rule 3(b) gives it a row (like OC Transpo). transit_agency is listed under region and
      municipality only, so this is the README rule 1 case: save it as transit_agency and it lands in
      review. It buys, tenders, budgets, plans and reports through Metrolinx (its Vendor Information
      page: "Metrolinx procurement strategies and practices..."); its "Our Management Team" page only
      sends readers to the Metrolinx Senior Management Team. No ontario.ca page found that links
      gotransit.com, so the evidence is appears_on. gotransit.com also says plain "GO" (About GO), left
      out of names: ontario.ca marks GO up as <abbr title="Government of Ontario">, so it would collide.
    parent:
      institution: metrolinx
      label: A division of Metrolinx
      evidence:
        url: https://www.gotransit.com/en/about-go
        quote: A division of Metrolinx, GO Transit is the regional public transit service for the Greater Toronto and Hamilton Area

  - key: up-express
    type: transit_agency
    expected: review
    names:
      - { text: UP Express, lang: en }
      - { text: Union Pearson Express, lang: en }
      - { text: UP Express, lang: fr }
      - { text: Union Pearson Express, lang: fr }
    homepage: https://www.upexpress.com/en
    homepage_alternates:
      - https://www.upexpress.com/fr
    homepage_host: own_domain
    evidence:
      url: https://www.ontario.ca/page/published-plans-and-annual-reports-2025-2026-ministry-transportation
      quote: "the PRESTO fare card payment system, the Union–Pearson (UP) Express"
    notes: >-
      Moved from out_of_scope on 2026-10-01, for the same reason as go-transit: a Metrolinx operating
      division (airport rail link) that presents under its own name and domain, so rule 3(b) gives it a
      row and rule 1 sends transit_agency at the province level to review. Judgement call: a reviewer
      may see the airport rail link as a service line rather than a transit agency. upexpress.com has
      no procurement, plan or governance page of its own (checked the 453 URLs in its sitemap-0.xml);
      all of it runs through Metrolinx.
    parent:
      institution: metrolinx
      label: A division of Metrolinx
      evidence:
        url: https://www.upexpress.com/en/about-up
        quote: A division of Metrolinx, an agency of the Ontario Government, UP Express connects Toronto Pearson International Airport and Union Station

sources:
  # --- Ministry of Transportation -------------------------------------------------
  - institution: ministry-of-transportation
    source_type: procurement
    url: https://www.raqs.merx.com/public/main/home.jsf
    alternates:
      - https://www.raqs.merx.com/
      - https://www.raqs.merx.com/public/main/home.jsf?language=FRENCH
    platform: merx.com
    evidence:
      url: https://www.raqs.merx.com/public/main/home.jsf
      quote: "If you have questions or need technical assistance, please contact the RAQS Help Desk"
    notes: >-
      MTO's Registry, Appraisal and Qualification System (RAQS) on MERX: contractor registration,
      qualification procedures, forms and help desk for highway construction and maintenance contracts.
      Linked from tcp.mto.gov.on.ca; ontario.ca/page/ontarios-highway-programs links its Contract Bulletin.
      MTO's own procurement page, so the government-wide "Doing business with the Government of
      Ontario" page (ontario.ca/page/doing-business-government-ontario) is not recorded here: it is
      the procurement source of ministry-of-public-and-business-service-delivery-and-procurement,
      which owns it (README, government-wide Ontario pages). No covered_by, since MTO has its own
      procurement source.
  - institution: ministry-of-transportation
    source_type: tender
    url: https://www.raqs.merx.com/public/bulletin/bulletin.jsf
    alternates:
      - https://www.raqs.merx.com/public/contract/contractsByRegionMap.jsf
      # MTO also posts non-construction solicitations on the government-wide Ontario Tenders
      # Portal (a Supply Ontario source), so saving it for MTO is accepted, not a false positive.
      - https://ontariotenders.app.jaggaer.com/
      - https://ontariotenders.app.jaggaer.com/esop/nac-host/public/web/login.html
    platform: merx.com
    evidence:
      url: https://www.raqs.merx.com/public/bulletin/bulletin.jsf
      quote: "Tenders Under Call"
    notes: >-
      RAQS Contract Bulletin: MTO Capital and Regional construction contracts under call. Linked from
      ontario.ca/page/ontarios-highway-programs as "MERX - information about past and future tenders".
      MTO's goods and services calls go on the government-wide Ontario Tenders Portal
      (ontariotenders.app.jaggaer.com), which is recorded once, as the tender source of
      ministry-of-public-and-business-service-delivery-and-procurement:supply-ontario (which runs
      it). It is not an MTO source, and MTO has its own tender pages, so there is no covered_by.
  - institution: ministry-of-transportation
    source_type: tender
    url: https://www.raqsesp.merx.com/
    platform: merx.com
    evidence:
