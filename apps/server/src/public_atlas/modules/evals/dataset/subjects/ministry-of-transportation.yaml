candidate_domains:
  - domain: metrolinx.com
    institution: metrolinx
    expected: confirm
    reason: Metrolinx's own site, linked from the MTO page on ontario.ca.
  - domain: ontarionorthland.ca
    institution: ontario-northland-transportation-commission
    expected: confirm
    reason: ONTC's own site, linked from the MTO page on ontario.ca.
  - domain: ontarioferries.com
    institution: owen-sound-transportation-company
    expected: confirm
    reason: OSTC's own site, linked from the MTO page on ontario.ca under "Owen Sound Transportation Company".
  - domain: mto.gov.on.ca
    institution: ministry-of-transportation
    expected: confirm
    reason: >-
      MTO's legacy domain, still linked from ontario.ca pages ("Ministry of Transportation" -> http://www.mto.gov.on.ca/english/,
      which redirects to ontario.ca) and from the RAQS header ("MINISTRY HOME"). Hosts MTO's technical publications
      library (www.library.mto.gov.on.ca) and the MTO Technical Consultation Portal (tcp.mto.gov.on.ca), both live
      on 2026-10-01. An Ontario government domain other than ontario.ca.
  - domain: infogo.gov.on.ca
    institution: ministry-of-transportation
    expected: confirm
    reason: >-
      INFO-GO, the Government of Ontario employee directory, linked from the MTO page as "Employee directory".
      An Ontario government host other than ontario.ca, so a confirm candidate (README, Candidate domains).
      Untrusted at start, so the leadership source on it is unreachable until it is confirmed.
  - domain: ontarioferries.net
    institution: owen-sound-transportation-company
    expected: reject
    reason: >-
      Trap: lookalike named by OSTC as a fraudulent site impersonating it (as are ontarioferries.org,
      ontarioferries.blog and on-ferries.com), per ontarioferries.com/fradulentwebsitedetected/. On
      2026-10-01 it serves a "domain for sale" page (porkbun.com).
  - domain: 407etr.com
    institution: ministry-of-transportation
    expected: reject
    reason: >-
      Trap: Highway 407 ETR is run by the private concessionaire 407 International Inc., not by MTO or a provincial agency.
  - domain: 511on.ca
    institution: ministry-of-transportation
    expected: confirm
    reason: >-
      Ontario 511, linked from the MTO page ("Get the latest on highway closures ... on Ontario 511"). Its
      About page (511on.ca/about/about511): "Ontario 511 is a bilingual digital traveller information service
      provided by the Ontario Ministry of Transportation." MTO's own service site, so confirm for MTO; the
      service itself is not an institution (out_of_scope). Checked 2026-10-01.
  - domain: highway407east.com
    institution: ministry-of-transportation
    expected: reject
    reason: >-
      Trap: ontario.ca's Highway 407 East environmental assessment page (proponent: Ministry of
      Transportation) links it as "Proponent website", but on 2026-10-01 it redirects to an unrelated
      gambling site (pragmatic4da.top). Lapsed project domain; nothing on it belongs to MTO.
  - domain: gotransit.com
    institution: go-transit
    expected: confirm
    reason: >-
      GO Transit's own site, linked from metrolinx.com; its About GO page: "A division of Metrolinx, GO
      Transit is the regional public transit service for the Greater Toronto and Hamilton Area."
  - domain: upexpress.com
    institution: up-express
    expected: confirm
    reason: >-
      UP Express's own site, linked from metrolinx.com; its footer: "A division of Metrolinx, an agency of
      the Ontario Government, UP Express connects Toronto Pearson International Airport and Union Station".

out_of_scope:
  # GO Transit and UP Express were here; moved to institutions (expected: review) on 2026-10-01 under
  # README rules 1 and 3(b): named divisions whose work matches transit_agency.
  - name: PRESTO
    url: https://www.prestocard.ca/en
    reason: Metrolinx's fare-card division, not a separate body, and a fare system matches no YAML type (rule 3(b)).
  - name: Nipissing Central Railway
    reason: >-
      Wholly owned subsidiary of ONTC (per ONTC's Document Centre); no procurement of its own found, so no
      row under README rule 3.
  - name: Pelee Island Transportation Service
    reason: MTO ferry service whose vessels OSTC manages under contract; a service, not a body.
  - name: Greater Toronto Airports Authority
    url: https://www.torontopearson.com/
    reason: >-
      Federal not-for-profit airport authority. The Public Appointments Secretariat lists it under MTO only
      because Ontario nominates a director; not a provincial agency. www.gtaa.com 301-redirects to
      torontopearson.com (checked 2026-10-01).
  - name: Ottawa Macdonald-Cartier International Airport Authority
    reason: Federal airport authority; Ontario nominates a director (PAS lists it under MTO). Not a provincial agency.
  - name: Greater London International Airport Authority
    reason: Federal airport authority; Ontario nominates a director (PAS lists it under MTO). Not a provincial agency.
  - name: Thunder Bay International Airports Authority Inc.
    reason: Federal airport authority; Ontario nominates a director (PAS lists it under MTO). Not a provincial agency.
  - name: Hamilton-Oshawa Port Authority
    reason: Federal Canada Port Authority; Ontario appoints one director (PAS "Port Authority Board of Directors - Hamilton-Oshawa"). Not provincial.
  - name: Thunder Bay Port Authority
    reason: Federal Canada Port Authority; Ontario appoints one director (PAS lists it under MTO). Not provincial.
  - name: Toronto Port Authority (PortsToronto)
    reason: Federal Canada Port Authority; Ontario appoints one director (PAS lists it under MTO). Not provincial.
  - name: Windsor Port Authority
    reason: Federal Canada Port Authority; Ontario appoints one director (PAS lists it under MTO). Not provincial.
  - name: Niagara Falls Bridge Commission
    url: https://www.niagarafallsbridges.com
    reason: Binational commission incorporated under US law; Ontario appoints four members (PAS lists it under MTO). Not a provincial agency.
  - name: St. Lawrence Seaway Management Corporation
    url: https://www.greatlakes-seaway.com
    reason: Federal not-for-profit corporation; Ontario's minister appoints one member who elects a director. Not provincial.
  - name: Infrastructure Ontario (Ontario Infrastructure and Lands Corporation)
    reason: >-
      Crown agency of the Ministry of Infrastructure. It co-delivers MTO highway and transit projects and appears in
      MTO's estimates as a consolidation adjustment, but it does not report to MTO.
  - name: Ontario Motor Vehicle Industry Council
    reason: Delegated administrative authority under the Ministry of Public and Business Service Delivery and Procurement, not MTO; DAAs match no YAML type.
  - name: Licence Appeal Tribunal
    reason: Hears appeals of MTO licence decisions but is part of Tribunals Ontario (Ministry of the Attorney General).
  - name: DriveTest
    reason: Driver examination centres run for MTO under contract by a private operator; a contracted service, not a public body.
  - name: Ontario 511
    url: https://511on.ca/
    reason: MTO traveller information service (a website and app), not a body.
  - name: Ontario Highway Transport Board
    reason: >-
      Former MTO adjudicative agency for intercity bus licensing, dissolved on July 1, 2021 when the
      Ontario Highway Transport Board Act was repealed (Bill 213, Better for People, Smarter for Business
      Act, 2020). Still named in older MTO pages; not on the current PAS list.
  - name: 407 ETR Concession Company Limited (Highway 407 ETR)
    url: https://www.407etr.com/
    reason: >-
      Private toll-highway concessionaire (owned by 407 International Inc.), not a provincial body. The
      provincially owned Highway 407 East is a highway, not an institution.
  - name: Oversight and Agency Governance Division
    reason: MTO internal division (ADM-led), no YAML type. Divisions are not institutions (README rule 3).
  - name: Transit Division
    reason: MTO internal division; no YAML type (transit_agency is municipal/regional and this division runs no service).
  - name: Integrated Policy and Planning Division
    reason: MTO internal division; no YAML type.
  - name: Transportation Infrastructure Management Division
    reason: MTO internal division; no YAML type.
  - name: Transportation Safety Division
    reason: MTO internal division; no YAML type.
  - name: Operations Division
    reason: MTO internal division; no YAML type.
  - name: Commercial Transportation Safety and Enforcement Division
    reason: MTO internal division; no YAML type.
  - name: Corporate Services Division
    reason: MTO internal division (shared Land and Resources Cluster); no YAML type.

notes: >-
  Agency list: the ontario.ca MTO page ("affiliated with the following independent agencies") and the
  2025-26 published plan (Oversight and Agency Governance Program: "Metrolinx, Owen Sound Transportation
  Company (OSTC), and Ontario Northland Transportation Commission (ONTC)") agree on three agencies. ontario.ca's
  "Agencies, boards and commissions" page sends readers to the Public Appointments Secretariat
  (pas.gov.on.ca/Home/Agencies-list), the official list by ministry, trusted at start beside ontario.ca (an
  anchor domain in data/canada/country.yaml since 2026-10-01). It lists 13 bodies under MTO (checked 2026-10-01, SelectedMinistryId=26); the other
  10 are federal or binational bodies where Ontario only makes appointments (out_of_scope). No MTO advisory
  boards or delegated administrative authorities were found. GO Transit and UP Express, Metrolinx divisions
  under their own names and domains, are transit_agency rows with expected: review (README rules 1 and 3(b)).
  Sources of types the institution's type does not list (MTO capital_plan; agencies'
  strategic_plan, contract_award, Metrolinx budget and capital_plan) are recorded under the floor rule.
  Sources on raqs.merx.com / raqsesp.merx.com / metrolinx.merx.com are merx.com platform pages.
  Government-wide pages (Doing business with the Government of Ontario, the Ontario Tenders Portal) are
  recorded in ministry-of-public-and-business-service-delivery-and-procurement, not here; MTO has its own
  RAQS procurement and tender pages, so none of its source types needs covered_by.
