sources:
  # --- Washtenaw County --------------------------------------------------------------
  - institution: washtenaw-county
    source_type: procurement
    url: https://www.washtenaw.org/purchasing
    alternates:
      - https://www.washtenaw.org/information-for-vendors
      - https://www.washtenaw.org/general-procurement-information
      - https://www.washtenaw.org/bid-quote-information
    evidence:
      url: https://www.washtenaw.org/purchasing
      quote: Bids/Proposals will be publicly opened by the Washtenaw County Purchasing Division on the date and time specified in the column titled
    notes: >-
      Purchasing Division page (Finance > Purchasing): how bids are opened, the Doing Business with
      Washtenaw County brochure, General Procurement Information and Information for Vendors
      (BidNet Direct, Vendor Self-Service). Those sub-pages and the Bid & Quote Information hub
      are alternates.

  - institution: washtenaw-county
    source_type: tender
    url: https://www.washtenaw.org/open-bids-quotes
    alternates:
      - https://www.washtenaw.org/bid-quote-information
      - https://www.washtenaw.org/closed-bids-quotes
    evidence:
      url: https://www.washtenaw.org/purchasing
      quote: Open Bids & Quotes
      kind: links_to
      link_target: https://www.washtenaw.org/open-bids-quotes
    notes: >-
      "Open Bids & Quotes": the list of RFPs currently open, with bid documents and the opening
      date ("This is the list of bid (RFP) solicitations currently open and available for
      response"), rendered by JavaScript. Closed Bids & Quotes and the hub page are alternates.

  - institution: washtenaw-county
    source_type: tender
    url: https://www.bidnetdirect.com/mitn/washtenaw-county
    platform: bidnetdirect.com
    evidence:
      url: https://www.washtenaw.org/information-for-vendors
      quote: Washtenaw County is utilizing a regional bid notification system created exclusively for the Tri-County Purchasing Cooperative known as BidNet Direct.
    notes: >-
      The county's agency page on BidNet Direct (MITN Purchasing Group), where its solicitations
      are also posted and vendors register for notifications. A genuinely different page from
      the county's own Open Bids list, so a second tender entry. The BidNet Direct Notification
      Information page links it, but that page's body is JavaScript-rendered.

  - institution: washtenaw-county
    source_type: budget
    url: https://www.washtenaw.org/open-book-financial-transparency
    alternates:
      - https://www.washtenaw.org/county-budget
      - https://www.washtenaw.org/finance
      - https://www.washtenaw.org/budget-planning
    evidence:
      url: https://www.washtenaw.org/open-book-financial-transparency
      quote: 2026 to 2029 Adopted & Projected Budgets
    notes: >-
      Open Book - Financial Transparency: tabs for the 2026 to 2029 Adopted & Projected Budgets, the
      2026 to 2029 Line Item Budget, the 2024 to 2027 Budget Summary, reaffirmed budgets and
      quarterly budget updates (the documents load by JavaScript). The county budgets on a
      four-year (quadrennial) cycle. The County Budget page (the 2019-2022 and 2024-2027 budget
      books), the Finance hub and the Administrator's Budget Planning page are alternates.

  - institution: washtenaw-county
    source_type: capital_plan
    url: https://www.washtenaw.org/county-budget
    alternates:
      - https://www.washtenaw.org/open-book-financial-transparency
      - https://www.washtenaw.org/finance
    evidence:
      url: https://www.washtenaw.org/county-budget
      quote: 2024 to 2027 Budget Book (PDF)
    notes: >-
      No stand-alone capital plan page. The capital plan is inside the budget book: the 2024 to
      2027 Budget Book PDF (https://mi-washtenawcounty2.civicplus.pro/asset/9ef529ac-01a7-4b0b-a126-5aabc89186a9,
      336 pages) has a "Capital Plan" section (pdf page 88, printed 90) and a "Capital Improvement /
      Debt Service" section (printed 275), and its Readers Guide (pdf page 12) says "The County
      prepares a long-term Capital Improvement Plan as part of the annual budget process"; the
      budget policies require a 20-year capital improvement plan. Judgement call, as in the County
      of Simcoe file: the budget page is the capital_plan source. Facilities Management's
      "Washtenaw County Facilities Portfolio" and the Space Plan Steering Committee materials
      (CivicClerk category 80) were checked and are not a capital plan.

  - institution: washtenaw-county
    source_type: council_meeting
    url: https://washtenawcomi.portal.civicclerk.com/
    alternates:
      - https://washtenawcomi.portal.civicclerk.com/?category_id=26,27
      - https://meetings.washtenaw.org/
      - https://www.washtenaw.org/meetings
      - https://www.washtenaw.org/agendas-minutes
      - https://www.washtenaw.org/board-meeting-agendas-minutes
    platform: civicclerk.com
    evidence:
      url: https://www.washtenaw.org/county-events
      quote: Meeting Webcasts
      kind: links_to
      link_target: https://washtenawcomi.portal.civicclerk.com/
    notes: >-
      The county's CivicClerk public portal (a JavaScript app; "CivicClerk events and agendas for
      citizens"): agendas, packets and minutes of the Board of Commissioners (Ways & Means and
      Board meetings, categories 26 and 27) and of its boards and commissions. Linked as "County
      Meetings Calendar & Materials" on the homepage (meetings.washtenaw.org redirects here), as
      "Meeting Webcasts" in the Board of Commissioners "How Do I" menu, and from the Meetings,
      Agendas & Minutes and Board Meeting Agendas & Minutes pages, whose bodies are
      JavaScript-rendered and only point here, so they are alternates.

  - institution: washtenaw-county
    source_type: strategic_plan
    url: https://www.washtenaw.org/vision-guiding-principles
    evidence:
      url: https://www.washtenaw.org/administrator
      quote: Vision & Guiding Principles
      kind: links_to
      link_target: https://www.washtenaw.org/vision-guiding-principles
    notes: >-
      Judgement call. The county publishes no document called a strategic plan. The
      Administrator's "Vision & Guiding Principles" page ("Washtenaw County will be a world-class
      service provider", then the County Guiding Principles: long-term fiscal stability, cost of
      business, customer service, mandated services) is the statement of priorities the budget
      book is built on, so it is recorded as the strategic_plan; its body is JavaScript-rendered.
      The Board's Washtenaw Rescue Plan pages (Connecting Washtenaw County, Community Engagement,
      Creating a Sustainable Community, Encouraging Generational Success, Investing in our
      Community's Health & Wellbeing) are the ARPA spending plan, not a strategic plan. A reviewer
      may prefer the absence.

  - institution: washtenaw-county
    source_type: meeting_video
    url: https://washtenawcomi.portal.civicclerk.com/
    alternates:
      - https://washtenawcomi.portal.civicclerk.com/?category_id=26,27
      - https://www.washtenaw.org/board-meeting-agendas-minutes
    platform: civicclerk.com
    evidence:
      url: https://www.washtenaw.org/county-events
      quote: Meeting Webcasts
      kind: links_to
      link_target: https://washtenawcomi.portal.civicclerk.com/
    notes: >-
      The same CivicClerk portal keeps each Board meeting's webcast ("Watch Board Meeting
      Webcasts" and "Video Portal" on the Board of Commissioners landing page both point to
      categories 26,27). The Webcast page (Board Meeting Agendas & Minutes) only embeds the live
      player and links the portal, so it is an alternate. The county's YouTube handle in the page
      data (@washtenawcountygovernment4312) returns 404 and is not recorded.

  - institution: washtenaw-county
    source_type: news
    url: https://www.washtenaw.org/county-news
