notes: >-
  Washtenaw County, Michigan (FIPS 26161): a county-level regional_government whose elected Board
  of Commissioners is its council, with an elected Sheriff, Clerk/Register of Deeds, Prosecutor,
  Treasurer and Water Resources Commissioner and an appointed Administrator. Its site is CivicPlus
  with JavaScript-rendered bodies on most pages; the pages with server-rendered text (County
  Departments, Your Government, Commissioners, Purchasing, Finance, Open Book, Parks Connect and
  Administration, the sitemap) carry the evidence, and the JavaScript-only pages' content was read
  through the site's CivicPlus content API (content.civicplus.com, app mi-washtenawcounty, with the
  read-only token the page itself ships) to decide what they say; quotes from those pages carry
  manual_check. Besides the county, the file labels the Sheriff's Office (police_service, review),
  the Parks and Recreation Commission (park_district, a judgement call), the Road Commission (other,
  review: the seed has no road commission type) and, from the county's Schools page, Washtenaw
  Community College (college, review), eight school districts headquartered in the county and the
  intermediate school district (school_board, expected at the county level). Ann Arbor Public
  Schools and the Ann Arbor Area Transportation Authority are left to the ann-arbor file. The
  county's pages do not lead to the district libraries (Ypsilanti, Chelsea, Dexter, Saline,
  Manchester: none is linked or named on a served or JavaScript page), to the Ypsilanti Community
  Utilities Authority (a shared body of the City and Charter Township of Ypsilanti), to any
  fire department, hospital, housing commission, land bank or county-owned corporation that buys
  (the Building Authority and the EDC are financing shells), so none of those gets a row; the
  county has no land bank authority. Other school districts partly in the county (Ann Arbor, and
  districts based in neighbouring counties such as Pinckney, South Lyon, Northville, Van Buren,
  Grass Lake, Stockbridge, Napoleon, Clinton and Jackson's) are not linked by the county and are
  not labelled. The county's meetings, webcasts and its boards' meetings are all on one CivicClerk
  portal (meetings.washtenaw.org); its bids are on its own Open Bids page and on BidNet Direct;
  its budget is quadrennial and its capital plan is inside the budget book. Platforms met that are
  not on the United States list: civicplus.pro (CivicPlus content host), munetrix.com (school
  budget transparency), boardontrack.com (board packets) and SIGMA VSS (sigma.michigan.gov, the
  State of Michigan's bid system used by Milan and WISD, on a trusted domain).
