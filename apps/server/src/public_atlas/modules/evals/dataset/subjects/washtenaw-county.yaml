out_of_scope:
  # County departments and offices with no type of their own (README rules 2 and 3(b))
  - name: Washtenaw County Community Mental Health (WCCMH)
    url: https://www.washtenaw.org/community-mental-health
    reason: >-
      Judgement call. The county's community mental health services programme under Michigan's
      Mental Health Code, listed under County Departments with its site on washtenaw.org. It has
      a WCCMH Board the Board of Commissioners appoints (county boards directory id 93), executive
      and quality-finance committees meeting on the county's CivicClerk portal (categories 32, 34,
      35), a dedicated millage and a strategic plan PDF, but it buys through County Purchasing and
      its budget is a section of the county budget, so it does not buy on its own account and is
      not `other`; a county department whose work matches no type. A reviewer may prefer `other`
      with expected: review.
  - name: Washtenaw County Health Department
    url: https://www.washtenaw.org/health-department
    reason: County department (with a Board of Health the commissioners appoint, directory id 103); the country file has no public_health_unit type and it buys and budgets through the county.
  - name: Washtenaw County Water Resources Commissioner / Public Works
    url: https://www.washtenaw.org/water-resources
    reason: >-
      The elected Water Resources Commissioner's office (drains, stormwater, soil erosion) and the
      Public Works division under the Board of Public Works, which assists municipalities with
      water, sewer and lake projects: county offices that run no utility under a name of their own
      (README rule 8), not a public_utility.
  - name: Emergency Services / 911 Metro Dispatch
    url: https://www.washtenaw.org/emergency-services-911
    reason: A division of the Sheriff's Office (Emergency Management and 911 Metro Dispatch), not a body of its own; the Emergency Telephone District Board governs the 911 surcharge.
  - name: Washtenaw County Trial Court and 14A District Court
    url: https://www.washtenaw.org/trial-court
    reason: Courts of the State of Michigan's judiciary funded by the county; not institutions the seed types cover, and they buy through the county.
  - name: Office of Community & Economic Development (OCED)
    url: https://www.washtenaw.org/community-economic-development
    reason: County department (housing, human services, community development, economic opportunity); a department doing economic development gets no row (rule 3), unlike a corporation the county owns.
  - name: Washtenaw County Brownfield Redevelopment Authority (WCBRA)
    url: https://www.washtenaw.org/brownfield-program
    reason: >-
      A county authority (Act 381) with its own board (directory id 8) meeting on CivicClerk
      (category 41), but it approves brownfield plans, captures tax increment and gives
      environmental assessment grants: a board that grants the county's money, which
      municipal_corporation's definition excludes; it runs no business and buys nothing on its own.
  - name: Washtenaw County Building Authority
    url: https://secure.ewashtenaw.org/bocdob/bocdobSubmit.do?boardid=9
    reason: Financing vehicle (Act 31 of 1948) that issues bonds for county buildings; meets once a year and has no site, staff or procurement of its own (the county builds and buys).
  - name: Economic Development Corporation of Washtenaw County
    url: https://secure.ewashtenaw.org/bocdob/bocdobSubmit.do?boardid=19
    reason: Act 338 EDC that can issue industrial revenue bonds; mostly vacant seats, an annual meeting and no site or spending of its own, so not a municipal_corporation that buys.
  - name: Washtenaw Urban County
    url: https://www.washtenaw.org/urban-county
    reason: A consortium of the county and its cities, townships and villages for federal CDBG and HOME funds, administered by OCED with an executive committee on CivicClerk; a partnership that grants funds, not a body that buys.
  - name: County boards, committees and commissions (Commission on Aging, Environmental Council, Food Policy Council, Advisory Council on Reparations, Apportionment Commission, Social Services Board, Opioid Settlement and Space Plan steering committees, Historic District Commission, Continuum of Care Board, Retirement Commission, VEBA Board, Drainage Board, Board of Canvassers, Jury Board, Emergency Telephone District Board, EMS Commission, Police Services Steering Committee, Veterans Affairs Committee, Youth Commission)
    url: https://www.washtenaw.org/public-boards-committees-commissions-index
    reason: Advisory and statutory committees of the county (fifty-odd in the county boards directory), which spend little and buy through the county (README rule 2); their meetings are on the county's CivicClerk portal.
  # Non-profits and partnerships the county funds or hosts
  - name: Washtenaw Health Project
    url: https://www.washtenaw.org/washtenaw-health-project-whp
    reason: '"Washtenaw Health Project is a non-profit organization in partnership with the Washtenaw County Health Department" (County Departments page): a non-profit the county partners with and funds.'
  - name: Washtenaw / Livingston Medical Control Authority
    url: https://www.washtenaw.org/washtenaw-livingston-medical-control-authority
    reason: Non-profit medical control authority designated under Michigan's Public Health Code for two counties' EMS, listed under County Departments; not a county body and no type fits.
  - name: Housing Access for Washtenaw County (HAWC)
    url: https://www.housingaccess.net/
    reason: Coordinated-entry housing programme run by a non-profit under contract; not a county body.
  - name: The Dispute Resolution Center
    url: http://www.thedisputeresolutioncenter.org/
    reason: Non-profit community mediation centre linked from the county's Courts and Legal menu.
  - name: Destination Ann Arbor (Ann Arbor Area Convention & Visitors Bureau)
    reason: The tourism bureau that the county's Accommodation Excise Tax funds under a management agreement (Finance > Accommodation Excise Tax); a non-profit the county funds, not a county body. Its site is not linked from a served page.
  # Bodies of other places or levels
  - name: Huron-Clinton Metropolitan Authority (Huron-Clinton Metroparks)
    url: https://www.metroparks.com/
    reason: >-
      "a regional special park district encompassing Livingston, Macomb, Oakland, Washtenaw and
      Wayne counties" (county boards page, directory id 29), headquartered in Brighton, Livingston
      County; the county appoints one of its commissioners. A park_district of another place
      (README rule 4: labelled where it is headquartered), not Washtenaw County's.
  - name: Ann Arbor Area Transportation Authority (TheRide)
    url: https://www.theride.org/
    reason: Transit authority headquartered in Ann Arbor, labelled in the ann-arbor file; the county's JavaScript-rendered pages link it only as a transportation resource. Not a county body.
  - name: Ann Arbor Public Schools
    url: https://www.a2schools.org/
    reason: School district headquartered in Ann Arbor, linked from the county's Schools page but labelled in the ann-arbor file (ann-arbor:ann-arbor-public-schools); not labelled here to avoid a duplicate row.
  - name: Washtenaw County Conservation District
    url: https://washtenawcd.org/
    reason: A soil conservation district under Part 93 of Michigan's Natural Resources and Environmental Protection Act with its own elected directors, linked from the county's Your Government page; a state-created district, not a county body, and the country file has no conservation type.
  - name: Washtenaw Area Transportation Study (WATS)
    url: http://www.miwats.org/
    reason: The metropolitan planning organization for the county (federal transportation planning), named in the county boards directory; a planning body of its member governments, not a county body.
  - name: Regional Transit Authority of Southeast Michigan (RTA)
    url: https://www.rtamichigan.org/
    reason: State-created four-county transit authority (county boards directory id 87; its master plan is linked from the county's Comprehensive Plan page); a regional body, not Washtenaw County's.
