      manual_check: "CivicPlus content API (content.civicplus.com, app mi-washtenawcounty, article 'Schools') 2026-10-09; the page renders its body by JavaScript"
    expected: review
    notes: >-
      Public community college district of Washtenaw County (Ann Arbor Township), governed by a
      seven-member elected Board of Trustees, with its own purchasing department. college is a
      type the United States uses but lists at the state level, not the county, so expected:
      review (README scope rule 1). The county's Schools page (Live, Visit, Play > Schools) links
      it under "Colleges & Universities in Washtenaw County" next to the University of Michigan,
      Eastern Michigan University and Concordia University; the page body is JavaScript-rendered,
      so the evidence is checked by hand. Not a county body: no parent recorded.

