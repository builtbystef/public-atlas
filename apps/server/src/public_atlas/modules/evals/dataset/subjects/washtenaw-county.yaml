institutions:
  - key: washtenaw-county
    type: regional_government
    names:
      - { text: Washtenaw County, lang: en }
      - { text: County of Washtenaw, lang: en }
      - { text: Washtenaw County Government, lang: en }
      - { text: Washtenaw County Board of Commissioners, lang: en }
      - { text: BOC, lang: en, is_acronym: true }
    homepage: https://www.washtenaw.org/
    homepage_host: trusted_domain
    evidence:
      url: https://www.washtenaw.org/commissioners
      quote: Andy LaBarre was first elected to the Washtenaw County Board of Commissioners in 2012
    notes: >-
      Michigan county of about 372,000 people (27 cities, villages and townships; seat Ann Arbor),
      governed by a nine-member elected Board of Commissioners with an appointed County
      Administrator. http://washtenaw.org and http://www.washtenaw.org redirect to
      https://www.washtenaw.org/. The site is CivicPlus: most department pages render their body
      by JavaScript (only the navigation is in the served HTML), so evidence is taken from the
      "catalog" pages that are server-rendered (County Departments, Your Government, Commissioners,
      Purchasing, Finance, Open Book, Parks & Recreation Connect and Administration) and from
      link text. Meetings and webcasts are on a CivicClerk portal (meetings.washtenaw.org
      redirects to washtenawcomi.portal.civicclerk.com). The Census of Governments lists
      http://www.ewashtenaw.org/, whose apex and www hosts no longer answer (see candidate_domains);
      the county's applications still live on ewashtenaw.org subdomains (secure.ewashtenaw.org
      boards directory and jobs, gisappsecure, prodpermits).

  - key: washtenaw-county-sheriffs-office
    type: police_service
    names:
      - { text: Washtenaw County Sheriff's Office, lang: en }
      - { text: Washtenaw County Sheriff, lang: en }
      - { text: WCSO, lang: en, is_acronym: true }
    homepage: https://www.washtenaw.org/sheriff
    homepage_alternates:
      - https://www.washtenaw.org/your-sheriffs-office
    homepage_host: trusted_domain
    evidence:
      url: https://www.washtenaw.org/your-sheriffs-office
      quote: "The Washtenaw County Sheriff's Office is organized into six divisions: Administrative Operations, Community Engagement, Corrections, Emergency Services, Innovative Reentry, and Police Services."
    expected: review
    notes: >-
      The county's police service, led by an elected Sheriff and listed under County Departments;
      it polices eight townships under contract and runs the jail, 911 Metro Dispatch and
      Emergency Management. police_service is a type the United States uses but does not list at
      the county level, so expected: review (README scope rule 1). It presents under its own name
      with a section of the county site (rule 3(b)). No board governs it (the Sheriff is elected);
      the Public Safety Millage Advisory Committee and the Police Services Steering Committee are
      advisory. It buys and budgets through the county, so its procurement, tender and budget are
      covered_by the county. Its Emergency Services / 911 division and 911 Metro Dispatch are
      divisions of the office, not bodies of their own.

  - key: washtenaw-county-parks-and-recreation-commission
    type: park_district
    names:
      - { text: Washtenaw County Parks and Recreation Commission, lang: en }
      - { text: Washtenaw County Parks & Recreation Commission, lang: en }
      - { text: Washtenaw County Parks and Recreation, lang: en }
      - { text: Washtenaw County Parks, lang: en }
      - { text: WCPARC, lang: en, is_acronym: true }
    homepage: https://www.washtenaw.org/parks-recreation
    homepage_host: trusted_domain
    evidence:
      url: https://www.washtenaw.org/parks-preserves-trails
      quote: Washtenaw County Parks and Recreation Commission (WCPARC) has led the multi-agency effort to develop the Border to Border Trail (B2B Trail) since its inception in the late 1990s.
    parent:
      institution: washtenaw-county
      label: commission appointed by
      evidence:
        url: https://www.washtenaw.org/administration
        quote: The Commission consists of 10 members including a member of the County Road Commission, the County Water Resources Commissioner, and seven members appointed by the Board of Commissioners
    notes: >-
      Judgement call. A county parks and recreation commission under Michigan's Act 261 of 1965:
      a separately constituted ten-member commission the Board of Commissioners appoints, with its
      own voter-approved millages (parks operating, natural areas preservation, roads and
      non-motorized trails), its own meetings on the county's CivicClerk portal and its own master
      plans, running county parks, preserves, the Meri Lou Murray Recreation Center, Rolling Hills
      and Independence Lake water parks and Pierce Lake Golf Course. It is not an independent
      special district (the Census of Governments counts it as part of the county), but it is a
      body the county controls (rule 3(a)) whose work matches park_district, the only type that
      fits; a reviewer may prefer out_of_scope as a county department. It buys through County
      Purchasing and its funds are part of the county budget, so procurement, tender and budget are
      covered_by the county. Its section of the county site has its own navigation (Parks,
      Preserves, Trails; Recreation; Activities; Connect; Register) and YouTube channel
      (https://www.youtube.com/@WashtenawParks, linked from the JavaScript-rendered landing page).

  - key: washtenaw-county-road-commission
    type: other
    names:
      - { text: Washtenaw County Road Commission, lang: en }
      - { text: WCRC, lang: en, is_acronym: true }
      - { text: Washtenaw County Board of County Road Commissioners, lang: en }
    homepage: https://www.wcroads.org/
    homepage_host: own_domain
    evidence:
      url: https://www.washtenaw.org/your-government
      quote: The Washtenaw County Road Commission (WCRC) is the county-level road agency in Washtenaw County, Michigan responsible for maintaining a road system that is reasonably safe and convenient to the traveling public.
      kind: links_to
      link_target: https://www.wcroads.org/
    parent:
      institution: washtenaw-county
      label: board appointed by
      evidence:
        url: https://www.wcroads.org/about/the-board/
        quote: The Washtenaw County Road Commission is governed by a five-member Washtenaw County Board of County Road Commissioners, appointed by the Washtenaw County Board of Commissioners.
    expected: review
    notes: >-
      Judgement call. A Michigan county road commission (Act 283 of 1909): a body of its own with a
      five-member board the county appoints, its own site, its own procurement (BidNet/MITN for
      goods and services, BidExpress for construction) and its own budget ("WCRC is an independent
      financial entity", Transparency & Budget page), funded by the Michigan Transportation Fund
      and a county-wide roads millage, with 136 employees maintaining 1,650 miles of road. It buys
      on its own account and matches no seed type (not a public_utility, not a municipal_corporation
      running a business), so it is `other` with expected: review (README scope rule 1). The
      country file may want a road_commission or highway_district type: see the report. Its budget,
      asset management plan, board meetings, news and YouTube recordings are recorded as off-list
      sources. The county's Your Government page and sitemap link it as "Road Commission".

