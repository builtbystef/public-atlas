absent_sources:
  - institution: toronto-hydro
    source_type: procurement
    note: >-
      No purchasing or supplier page on torontohydro.com: checked the sitemap, About Us, Governance,
      Contractors & Developers and Corporate Reports pages, and web searches for procurement, bid
      opportunities and supplier registration. The only nearby pages are the Contractor Pre-Qualification
      Application (qualified contractor status for third-party work on the grid) and the Local Demand
      Response Program (a capacity programme), and neither is a purchasing page.
  - institution: toronto-hydro
    source_type: tender
    note: No public bid listing on torontohydro.com, and no Toronto Hydro buyer page found on MERX, Bonfire, Biddingo or Ariba by web search.
  - institution: toronto-hydro
    source_type: board_meeting
    note: >-
      The Board of Directors is described on /about-us/governance and /about-us/leadership, but no agendas
      or minutes are published (a Business Corporations Act company whose board meets in private).
  - institution: toronto-fire-services
    source_type: procurement
    covered_by: city-of-toronto
    note: >-
      TFS is a City division and buys through the City's Purchasing & Materials Management Division
      ("procures most of its goods and services on behalf of the 44 divisions" on the City procurement
      page). No TFS-specific purchasing page was found in the TFS division page or toronto.ca search.
  - institution: toronto-water
    source_type: procurement
    covered_by: city-of-toronto
    note: A City division that buys through the City's Purchasing & Materials Management Division; no Toronto Water purchasing page (division page, Doing Business with the City pages checked).
  - institution: toronto-water
    source_type: tender
    covered_by: city-of-toronto
    note: Toronto Water solicitations are issued by the City through the Toronto Bids Portal / SAP Ariba (recorded under city-of-toronto); there is no Toronto Water tender page of its own.
  - institution: toronto-water
    source_type: board_meeting
    note: A City division with no board; its reports go to City Council's Infrastructure and Environment Committee (under city-of-toronto council_meeting).
  - institution: toronto-public-health
    source_type: procurement
    covered_by: city-of-toronto
    note: >-
      TPH is a City division and buys through the City's Purchasing & Materials Management Division; no
      TPH purchasing page on the division or agency pages, the health pages or by toronto.ca search.
