notes: >-
  Institution list built from the toronto.ca Agencies & Corporations pages (service agencies,
  corporations, partnered bodies, adjudicative boards) and the Staff Directory, Divisions & Customer
  Service page. In-scope rows besides the City: TTC, TPS (with its Board folded in), TPL, Toronto
  Hydro, Toronto Fire Services (division) and Toronto Water (division, a judgement call); and, since the
  country file gained new types (2026-10-01), Toronto Public Health (with the Board of Health folded
  in), TRCA (shared conservation authority, its row lives here), and TCHC, Toronto Seniors Housing,
  CreateTO, Exhibition Place, TO Live, the Toronto Parking Authority, the Toronto Zoo and Sankofa
  Square (municipal corporations; Sankofa Square a judgement call; the two housing corporations were
  housing_corporation until that type was folded into municipal_corporation). Toronto Paramedic
  Services is out_of_scope since paramedic_service was dropped (a City division). Kept out under the new rules: agencies that run no business of the
  municipal_corporation kinds (Heritage Toronto, the Atmospheric Fund, the Investment Board), CreateTO's
  subsidiaries, single-facility arena and community centre boards, Casa Loma Corporation (lease
  oversight only), Lakeshore Arena and the Pan Am Sports Centre (single facilities, the latter jointly
  owned), and Waterfront Toronto (tri-government). Several agency boards (CreateTO, Exhibition Place,
  TO Live, TPA, Toronto Zoo, Board of Health) meet on TMMIS, which answers scripts with an Akamai block,
  so TMMIS committee pages are alternates or carry a browser manual_check. The City's
  budget notes page
  (https://www.toronto.ca/city-government/budget-finances/city-budget/notes-reports-and-presentations/)
  is a budget/capital_plan source for several institutions because it lists each agency's and
  division's budget note and 10-year capital plan. Precision traps: merx.com/cityoftoronto (0
  solicitations, not linked from toronto.ca), the parked lookalike cityoftoronto.ca, and the out_of_scope
  agencies above. Checked against the live web 2026-10-01: sources outside each type's list (annual
  reports, leadership, the agencies' own capital plans and strategic plans, TTC contract awards, Toronto
  Water's budget note) were added under the floor rule; the City's contract awards were looked for and
  not found as a page of their own (the TO Bids portal lists awarded solicitations inside its JavaScript
  app, and procurement metrics point to Open Data).
