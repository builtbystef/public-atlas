      TSHC's About Us page: "We partner closely with Toronto Community Housing, which owns the buildings
      that we operate." Capital repairs to those buildings sit in TCHC's 10-year capital plan. No capital
      plan page on torontoseniorshousing.ca (sitemap and Reports pages checked) and no TSHC capital
      section on the City budget notes page.
