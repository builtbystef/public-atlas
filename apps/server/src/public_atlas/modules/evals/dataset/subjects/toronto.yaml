      its procurement "is a shared service that Toronto Community Housing Corporation (TCHC) performs on
      the behalf of TSHC"; no purchasing page on torontoseniorshousing.ca (sitemap checked).
  - institution: toronto-seniors-housing-corporation
    source_type: tender
    covered_by: toronto-community-housing-corporation
