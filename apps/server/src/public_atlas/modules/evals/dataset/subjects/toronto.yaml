      quote: "The Toronto Board of Health, supported by Toronto Public Health (TPH), determines and sets public health policy"
    notes: >-
      The Board of Health (a local board of the City under the Health Protection and Promotion Act) and
      Toronto Public Health, the City division that reports to it, are one row, as with police and
      library boards (rule 5). TPH is listed both as a City division and among the City's service
      agencies. It buys through the City; its budget is a City budget note and its board meets on TMMIS.
    parent:
      institution: city-of-toronto
      label: local board of the City
      evidence:
        url: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/city-managers-office/agencies-corporations/agencies/toronto-public-health/
