    parent:
      institution: city-of-toronto
      label: the City’s only all hazards emergency response organization
      evidence:
        url: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/staff-directory-divisions-and-customer-service/fire-services/
        quote: Toronto Fire Services is the City’s only all hazards emergency response organization.

  - key: toronto-water
    type: public_utility
    names:
      - { text: Toronto Water, lang: en }
    homepage: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/staff-directory-divisions-and-customer-service/toronto-water/
    homepage_host: trusted_domain
    evidence:
      url: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/staff-directory-divisions-and-customer-service/toronto-water/
      quote: "Management of one of the largest municipal water, wastewater and stormwater utilities in North America"
    notes: >-
      JUDGEMENT CALL: a City division (not a separate corporation) that describes itself as a utility
      and presents under its own name, so it gets a row under rule 3b. It has no board and buys through
      the City's Purchasing & Materials Management Division, so most of its source types are absent.
      Solid Waste Management Services was put in out_of_scope instead (see there).
    parent:
      institution: city-of-toronto
      label: Division
      evidence:
        url: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/staff-directory-divisions-and-customer-service/toronto-water/
        quote: The Division’s seven business sections manage a large number of facilities and assets across the city

  - key: toronto-public-health
    type: public_health_unit
    names:
      - { text: Toronto Public Health, lang: en }
      - { text: TPH, lang: en, is_acronym: true }
      - { text: Toronto Board of Health, lang: en }
