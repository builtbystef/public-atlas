institutions:
  - key: city-of-toronto
    type: municipal_government
    names:
      - { text: City of Toronto, lang: en }
    homepage: https://www.toronto.ca/
    homepage_host: trusted_domain
    evidence:
      url: https://www.ontario.ca/page/list-ontario-municipalities
      quote: "A single-tier municipality (such as the City of Toronto, the City of Stratford or the County of Brant) is not part of an upper-tier municipality."

  - key: toronto-transit-commission
    type: transit_agency
    names:
      - { text: Toronto Transit Commission, lang: en }
      - { text: TTC, lang: en, is_acronym: true }
      - { text: TTC Board, lang: en }
    homepage: https://www.ttc.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/city-managers-office/agencies-corporations/agencies/toronto-transit-commission/
      quote: "The Toronto Transit Commission (TTC) is a City agency that provides public transit services"
      kind: links_to
      link_target: http://www.ttc.ca/
    notes: >-
      Wheel-Trans is a TTC service, not a separate body. The TTC Board (10 members appointed by City
      Council) is the TTC's governing board and is folded into this row. Subsidiaries Toronto Coach
      Terminal Inc. and TTC Insurance Company are in out_of_scope.
    parent:
      institution: city-of-toronto
      label: City agency
      evidence:
        url: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/city-managers-office/agencies-corporations/agencies/toronto-transit-commission/
        quote: The Toronto Transit Commission (TTC) is a City agency

  - key: toronto-police-service
    type: police_service
    names:
      - { text: Toronto Police Service, lang: en }
      - { text: TPS, lang: en, is_acronym: true }
      - { text: Toronto Police Service Board, lang: en }
      - { text: Toronto Police Services Board, lang: en }
    homepage: https://www.tps.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/city-managers-office/agencies-corporations/agencies/toronto-police-service/
      quote: "The Toronto Police Service (TPS) is the police service for Toronto."
      kind: links_to
      link_target: http://torontopolice.on.ca/
    notes: >-
      The toronto.ca agency page links the legacy domain torontopolice.on.ca; the service's current
      site is tps.ca (linked, logo only, from https://www.toronto.ca/community-people/public-safety-alerts/).
      Both are behind a Cloudflare bot challenge that intermittently returns 403 to curl.
      JUDGEMENT CALL: the Toronto Police Service Board (tpsb.ca) is the statutory body that governs the
      service, employs its members and sets its budget; it is folded into this row (same pattern as the
      TTC Board and TPL Board) so the police_service board_meeting source lives on tpsb.ca. An agent that
      saves the Board as a separate police_service institution should be treated as a duplicate of this
      row, not a new institution. The Board's names are in `names`: tpsb.ca says "Toronto Police Service
      Board" and tps.ca's procurement page says "Toronto Police Services Board". Checked 2026-10-01: the
      Cloudflare challenge answers curl with 403 but lets Python httpx through (as the evidence checker uses).
    parent:
      institution: city-of-toronto
      label: service agency
      evidence:
        url: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/city-managers-office/agencies-corporations/agencies/
        quote: Service agencies provide services such as public transit, library, police, parking and theatres.

  - key: toronto-public-library
    type: library
    names:
      - { text: Toronto Public Library, lang: en }
      - { text: TPL, lang: en, is_acronym: true }
      - { text: Toronto Public Library Board, lang: en }
    homepage: https://tpl.ca/
    homepage_host: own_domain
    evidence:
      url: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/city-managers-office/agencies-corporations/agencies/toronto-public-library/
      quote: "The Toronto Public Library operates the library system in Toronto, which is the largest public library system in Canada."
      kind: links_to
      link_target: https://www.torontopubliclibrary.ca/
    notes: >-
      toronto.ca links torontopubliclibrary.ca, which 301-redirects to https://tpl.ca/. The Toronto Public
      Library Board governs the library and is folded into this row.
    parent:
      institution: city-of-toronto
      label: established by City Council
      evidence:
        url: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/city-managers-office/agencies-corporations/agencies/toronto-public-library/
        quote: The TPL Board was established by City Council in 1998 and is continued as a library board under the City of Toronto Act, 2006.

  - key: toronto-hydro
    type: public_utility
    names:
      - { text: Toronto Hydro, lang: en }
      - { text: Toronto Hydro Corporation, lang: en }
      - { text: Toronto Hydro-Electric System Limited, lang: en }
    homepage: https://www.torontohydro.com/
    homepage_host: own_domain
    evidence:
      url: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/city-managers-office/agencies-corporations/corporations/toronto-hydro/
      quote: "is a holding company of the City of Toronto which, through its subsidiaries, distributes electricity"
      kind: links_to
      link_target: http://www.torontohydro.com/sites/electricsystem/Pages/foryourhome.aspx
    notes: >-
      Toronto Hydro Corporation (holding company, City sole shareholder) and its regulated distributor
      Toronto Hydro-Electric System Limited are one row: torontohydro.com calls THESL "Toronto Hydro" and no
      separate procurement function is published for either. Toronto Hydro Energy Services Inc. is in
      out_of_scope. The toronto.ca link target redirects to https://www.torontohydro.com/for-home. torontohydro.com sets a cookie on a 302 first, so clients without a cookie jar loop on redirects.
    parent:
      institution: city-of-toronto
      label: holding company of the City of Toronto; the City of Toronto is the sole shareholder
      evidence:
        url: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/city-managers-office/agencies-corporations/corporations/toronto-hydro/
        quote: The City of Toronto is the sole shareholder.

