    notes: >-
      JUDGEMENT CALL: a single-site board of management, but a City service agency (not a
      community-based one like the arena boards and AOCCs) that runs a venue business: event
      production, bookings of the Square for third-party and corporate events, sponsorship. It has its
      own City budget note and 10-year capital plan. The toronto.ca page does not link sankofasquare.ca,
      so the evidence is plain appears_on. No procurement, tender or annual report page was found.
